<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#C8102E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Renfe Opos">
<meta name="description" content="Prepara las oposiciones Renfe Operador Comercial N2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='32' fill='%23C8102E'/><text x='96' y='130' font-family='serif' font-size='100' font-weight='900' text-anchor='middle' fill='white'>R</text></svg>">
<title>Renfe Oposiciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --red: #C8102E; --red-dark: #9B0C22; --red-light: #E8314A;
  --cream: #F4EFE6; --dark: #1A1A2E; --dark-mid: #16213E;
  --gold: #D4A017; --gray: #6B7280; --gray-light: #E5E7EB;
  --white: #FFFFFF; --green: #16A34A; --orange: #EA580C;
  --blue: #2563EB; --purple: #7C3AED;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'DM Sans', system-ui, sans-serif;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font-body);background:var(--cream);color:var(--dark);overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column}

/* ── Header ── */
.hdr{background:var(--dark);color:#fff;padding:0 1rem;height:56px;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;border-bottom:3px solid var(--red);position:relative;z-index:50}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-badge{background:var(--red);font-family:var(--font-display);font-weight:900;font-size:1rem;
  padding:3px 10px;letter-spacing:1px}
.hdr-sub{font-size:.7rem;font-weight:300;color:#999;letter-spacing:2px;text-transform:uppercase}
.hdr-actions{display:flex;gap:6px;align-items:center}
.hdr-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:#ccc;padding:5px 10px;
  border-radius:4px;cursor:pointer;font-family:var(--font-body);font-size:.75rem;transition:all .2s}
.hdr-btn:hover,.hdr-btn.active{background:var(--red);border-color:var(--red);color:#fff}
.online-dot{width:8px;height:8px;border-radius:50%;background:#6B7280;flex-shrink:0}
.online-dot.online{background:#22C55E;box-shadow:0 0 6px #22C55E}

/* ── Scroll container ── */
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;
  border-radius:6px;cursor:pointer;font-family:var(--font-body);font-weight:600;
  font-size:.9rem;padding:11px 20px;transition:all .2s;letter-spacing:.3px}
.btn-primary{background:var(--red);color:#fff}.btn-primary:hover{background:var(--red-dark)}
.btn-primary:active{transform:scale(.97)}
.btn-secondary{background:transparent;color:var(--dark);border:2px solid var(--dark)}
.btn-secondary:hover{background:var(--dark);color:#fff}
.btn-ghost{background:transparent;color:var(--gray);border:1.5px solid var(--gray-light)}
.btn-ghost:hover{border-color:var(--dark);color:var(--dark)}
.btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.btn-sm{padding:7px 14px;font-size:.8rem}

/* ── HOME ── */
.home{padding:1.25rem;max-width:680px;margin:0 auto}
.hero{background:var(--dark);border-radius:12px;padding:1.5rem;color:#fff;
  margin-bottom:1.25rem;position:relative;overflow:hidden}
.hero::before{content:'🚄';font-size:6rem;position:absolute;right:-1rem;top:50%;
  transform:translateY(-50%);opacity:.08;pointer-events:none}
.hero-title{font-family:var(--font-display);font-size:1.9rem;line-height:1.1;margin-bottom:.5rem}
.hero-title em{color:var(--gold);font-style:normal}
.hero-sub{color:#aaa;font-size:.85rem;line-height:1.5;margin-bottom:1.25rem}
.hero-row{display:flex;gap:.75rem;flex-wrap:wrap}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin-bottom:1.25rem}
.stat-mini{background:#fff;border-radius:8px;padding:.9rem;text-align:center;
  border:1px solid var(--gray-light);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.stat-n{font-family:var(--font-display);font-size:1.8rem;color:var(--red);line-height:1}
.stat-l{color:var(--gray);font-size:.7rem;margin-top:3px;line-height:1.3}

.section-hd{font-family:var(--font-display);font-size:1.3rem;margin-bottom:1rem;color:var(--dark)}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.25rem}
.topic-card{background:#fff;border-radius:10px;padding:1rem;cursor:pointer;
  border:1px solid var(--gray-light);transition:all .22s;position:relative;overflow:hidden}
.topic-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent)}
.topic-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.topic-card:active{transform:scale(.97)}
.tc-icon{font-size:1.5rem;margin-bottom:.4rem}
.tc-name{font-weight:600;font-size:.85rem;line-height:1.3;margin-bottom:.3rem}
.tc-tag{font-size:.7rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}

/* ── QUIZ ── */
.quiz{padding:1rem;max-width:680px;margin:0 auto}
.quiz-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;gap:.5rem}
.quiz-title{font-family:var(--font-display);font-size:1.2rem;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{background:var(--dark);color:#fff;padding:5px 10px;border-radius:4px;
  font-weight:700;font-size:.85rem;white-space:nowrap;font-family:monospace}
.timer.warn{background:var(--orange)}.timer.danger{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.65}}
.prog-bar{height:5px;background:var(--gray-light);border-radius:3px;overflow:hidden;margin-bottom:1rem}
.prog-fill{height:100%;background:var(--red);transition:width .3s;border-radius:3px}
.prog-txt{text-align:right;font-size:.75rem;color:var(--gray);margin-top:3px;margin-bottom:.75rem}

.q-card{background:#fff;border-radius:12px;padding:1.25rem;margin-bottom:.75rem;
  border:1px solid var(--gray-light);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.q-num{color:var(--red);font-weight:700;font-size:.75rem;text-transform:uppercase;
  letter-spacing:1px;margin-bottom:.6rem}
.q-badge{display:inline-block;background:var(--gray-light);color:var(--gray);
  font-size:.65rem;padding:2px 6px;border-radius:3px;margin-left:6px;font-weight:500}
.q-text{font-size:1rem;font-weight:500;line-height:1.55;margin-bottom:1rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:10px;background:var(--cream);border:2px solid transparent;
  border-radius:8px;padding:11px 14px;cursor:pointer;font-family:var(--font-body);font-size:.9rem;
  line-height:1.4;text-align:left;transition:all .15s;width:100%}
.opt:hover:not(:disabled){border-color:var(--red);background:#fff}
.opt.sel{border-color:var(--dark);background:#fff}
.opt.ok{border-color:var(--green);background:#F0FDF4;color:var(--green)}
.opt.ko{border-color:var(--red);background:#FEF2F2;color:var(--red)}
.opt:disabled{cursor:default}
.opt-l{width:24px;height:24px;border-radius:50%;background:var(--gray-light);display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:.75rem;flex-shrink:0;margin-top:1px}
.opt.sel .opt-l{background:var(--dark);color:#fff}
.opt.ok .opt-l{background:var(--green);color:#fff}
.opt.ko .opt-l{background:var(--red);color:#fff}
.expl{background:#EFF6FF;border-left:4px solid var(--blue);border-radius:0 8px 8px 0;
  padding:1rem;margin-top:.75rem;font-size:.85rem;line-height:1.6;color:#1E40AF}
.expl strong{display:block;margin-bottom:3px;font-size:.8rem}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;
  padding:1rem;background:var(--cream);border-top:1px solid var(--gray-light);
  flex-shrink:0;padding-bottom:calc(1rem + var(--safe-bottom))}

/* ── LOADER ── */
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:1rem;color:var(--gray);padding:2rem;text-align:center}
.spin{width:40px;height:40px;border:3px solid var(--gray-light);border-top-color:var(--red);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-title{font-weight:600;font-size:1rem;color:var(--dark)}
.loader-sub{font-size:.85rem}

/* ── RESULTS ── */
.results{padding:1.25rem;max-width:680px;margin:0 auto}
.res-hero{background:var(--dark);border-radius:12px;padding:1.75rem;text-align:center;color:#fff;margin-bottom:1.25rem}
.res-score{font-family:var(--font-display);font-size:4.5rem;color:var(--gold);line-height:1}
.res-label{color:#999;font-size:.85rem;margin-top:.25rem}
.res-verdict{font-size:1.1rem;font-weight:600;margin-top:.75rem}
.res-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin-top:1rem}
.rs{text-align:center}
.rs-n{font-family:var(--font-display);font-size:1.6rem;font-weight:700}
.rs-l{font-size:.72rem;color:#aaa}
.c-green{color:#4ADE80}.c-red{color:#F87171}.c-gray{color:#94A3B8}
.review-list{display:flex;flex-direction:column;gap:.75rem}
.rev-item{background:#fff;border-radius:8px;padding:1rem 1rem 1rem 1.25rem;
  border:1px solid var(--gray-light);border-left:4px solid var(--accent)}
.rev-q{font-weight:500;font-size:.9rem;margin-bottom:.5rem;line-height:1.4}
.rev-a{font-size:.82rem}

/* ── STATS ── */
.stats-pg{padding:1.25rem;max-width:680px;margin:0 auto}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.25rem}
.big-stat{background:#fff;border-radius:8px;padding:1.25rem;text-align:center;
  border:1px solid var(--gray-light)}
.big-n{font-family:var(--font-display);font-size:2.2rem;color:var(--red)}
.big-l{color:var(--gray);font-size:.75rem;margin-top:3px}
.hist-table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;
  overflow:hidden;border:1px solid var(--gray-light);font-size:.85rem}
.hist-table th{background:var(--dark);color:#fff;padding:10px 12px;text-align:left;font-weight:500;font-size:.78rem}
.hist-table td{padding:10px 12px;border-bottom:1px solid var(--gray-light)}
.hist-table tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.72rem;font-weight:600}
.b-green{background:#D1FAE5;color:var(--green)}.b-orange{background:#FEF3C7;color:var(--orange)}
.b-red{background:#FEE2E2;color:var(--red)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--gray)}
.empty-icon{font-size:3rem;margin-bottom:1rem}

/* ── CONFIG MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;
  display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem;width:100%;max-width:560px;
  max-height:90vh;overflow-y:auto;padding-bottom:calc(1.5rem + var(--safe-bottom))}
.modal-title{font-family:var(--font-display);font-size:1.3rem;margin-bottom:1.25rem}
.modal-sec{margin-bottom:1.25rem}
.modal-lbl{font-weight:600;font-size:.85rem;margin-bottom:.6rem;color:var(--dark)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--gray-light);border-radius:20px;padding:5px 12px;
  font-size:.8rem;cursor:pointer;transition:all .15s;background:#fff;
  font-family:var(--font-body)}
.chip.on{border-color:var(--red);background:var(--red);color:#fff}
.num-row{display:flex;align-items:center;gap:1rem}
.num-btn{width:36px;height:36px;border-radius:50%;border:2px solid var(--gray-light);
  background:#fff;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;
  justify-content:center;transition:all .15s;font-family:var(--font-body)}
.num-btn:hover{border-color:var(--red);color:var(--red)}
.num-v{font-size:1.2rem;font-weight:700;min-width:32px;text-align:center}
.modal-actions{display:flex;gap:.75rem;justify-content:flex-end;margin-top:1.25rem}

/* ── PSICO ── */
.psico{padding:1.25rem;max-width:680px;margin:0 auto}
.psico-card{background:#fff;border-radius:12px;padding:1.5rem;text-align:center;
  margin-bottom:.75rem;border:1px solid var(--gray-light)}
.series-seq{font-family:var(--font-display);font-size:2rem;font-weight:700;
  letter-spacing:6px;color:var(--dark);margin:1.25rem 0}
.series-q{font-size:1rem;color:var(--gray);margin-bottom:1.5rem}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-num{background:var(--cream);border:2px solid transparent;border-radius:8px;padding:14px;
  font-size:1.4rem;font-weight:700;cursor:pointer;transition:all .15s;
  font-family:var(--font-display)}
.opt-num:hover:not(:disabled){border-color:var(--red);background:#fff}
.opt-num.ok{border-color:var(--green);background:#F0FDF4;color:var(--green)}
.opt-num.ko{border-color:var(--red);background:#FEF2F2;color:var(--red)}

/* ── INSTALL BANNER ── */
.install-bar{background:var(--dark);color:#fff;padding:.75rem 1rem;
  display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-shrink:0}
.install-txt{font-size:.82rem;flex:1;line-height:1.4}
.install-close{background:transparent;border:none;color:#aaa;cursor:pointer;font-size:1rem;padding:4px}

@media(min-width:600px){
  .topic-grid{grid-template-columns:repeat(3,1fr)}
  .stats-grid{grid-template-columns:repeat(4,1fr)}
  .overlay{align-items:center}
  .modal{border-radius:12px;max-height:80vh}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ══════════════════════════════════════════════════════
//  BANCO DE PREGUNTAS OFFLINE — 200+ preguntas
// ══════════════════════════════════════════════════════
const OFFLINE_QUESTIONS = {

oc_empresa: [
  {q:"¿En qué año fue fundada RENFE?",opts:["1938","1941","1950","1936"],c:1,e:"RENFE fue creada por decreto el 24 de enero de 1941, unificando todas las compañías ferroviarias privadas que operaban en España hasta ese momento."},
  {q:"¿Qué significa el acrónimo RENFE?",opts:["Red Nacional Ferroviaria Española","Red Nacional de los Ferrocarriles Españoles","Red Nacional Ferroviaria de España","Redes Nacionales Ferroviarias Españolas"],c:1,e:"RENFE son las siglas de Red Nacional de los Ferrocarriles Españoles, empresa creada en 1941."},
  {q:"¿Cuál fue el resultado de la Ley del Sector Ferroviario de 2003 respecto a RENFE?",opts:["RENFE se privatizó totalmente","RENFE se dividió en RENFE Operadora y ADIF","RENFE fue absorbida por el Estado","RENFE desapareció como empresa"],c:1,e:"La Ley 39/2003 del Sector Ferroviario separó la gestión de infraestructuras (ADIF) de la operación de servicios ferroviarios (RENFE Operadora), liberalizando progresivamente el sector."},
  {q:"¿Cuál es el principal organismo que gestiona las infraestructuras ferroviarias en España?",opts:["RENFE Operadora","Ministerio de Transportes","ADIF","Fomento Ferroviario"],c:2,e:"ADIF (Administrador de Infraestructuras Ferroviarias) es el organismo público encargado de administrar, mantener y gestionar la red ferroviaria de interés general en España."},
  {q:"¿Qué tipo de entidad jurídica es RENFE Operadora actualmente?",opts:["Sociedad Anónima privada","Empresa pública estatal (Entidad Pública Empresarial)","Organismo autónomo","Fundación pública"],c:1,e:"RENFE Operadora es una Entidad Pública Empresarial (EPE), cuyo capital pertenece íntegramente al Estado español."},
  {q:"¿Qué servicio de RENFE une Madrid con Barcelona en menos de 3 horas?",opts:["Alvia","Avant","AVE","Euromed"],c:2,e:"El AVE (Alta Velocidad Española) Madrid-Barcelona opera desde 2008 y cubre el trayecto en aproximadamente 2h30 min, siendo uno de los servicios de alta velocidad más utilizados de Europa."},
  {q:"¿Bajo qué ministerio está adscrita RENFE?",opts:["Ministerio de Economía","Ministerio de Transportes, Movilidad y Agenda Urbana","Ministerio de Hacienda","Ministerio de Industria"],c:1,e:"RENFE Operadora está adscrita al Ministerio de Transportes, Movilidad y Agenda Urbana, que es el organismo rector del sector ferroviario en España."},
  {q:"¿Cuál de los siguientes es un servicio de media distancia de RENFE?",opts:["AVE","Cercanías","Alvia","Trenhotel"],c:2,e:"Alvia es el servicio de media-larga distancia de RENFE, que opera sobre infraestructura de alta velocidad y convencional. Cercanías es de corta distancia y el AVE de larga distancia."},
  {q:"¿Qué año entró en servicio el primer tren AVE en España?",opts:["1988","1992","1995","2000"],c:1,e:"El primer tren AVE en España entró en servicio el 14 de abril de 1992, coincidiendo con la inauguración de la Expo de Sevilla, en la línea Madrid-Sevilla."},
  {q:"¿Cómo se denomina el servicio de RENFE para trayectos nocturnos de larga distancia?",opts:["Altaria","Euromed","Trenhotel","Intercity"],c:2,e:"Trenhotel es el servicio de RENFE que opera trenes nocturnos con camas y literas para trayectos de larga distancia, tanto nacionales como internacionales."},
],

oc_ferroviario: [
  {q:"¿Cuál es el ancho de vía estándar utilizado en la red de alta velocidad española?",opts:["1.668 mm (ibérico)","1.435 mm (UIC)","1.520 mm (ruso)","1.000 mm (métrico)"],c:1,e:"La red de alta velocidad española utiliza el ancho UIC estándar de 1.435 mm, que es el estándar europeo, a diferencia de la red convencional que usa el ancho ibérico de 1.668 mm."},
  {q:"¿Qué organismo europeo regula la seguridad ferroviaria a nivel comunitario?",opts:["Eurostar","ERA (Agencia Ferroviaria Europea)","Eurotunnel","AESF"],c:1,e:"ERA (European Union Agency for Railways) es el organismo de la UE encargado de promover un espacio ferroviario europeo único, establecer normas técnicas de seguridad e interoperabilidad."},
  {q:"¿Qué es la interoperabilidad ferroviaria?",opts:["La capacidad de los trenes de circular a alta velocidad","La capacidad del sistema ferroviario de permitir la circulación segura de trenes entre distintas redes","El sistema de señalización ferroviaria","La coordinación de horarios entre compañías"],c:1,e:"La interoperabilidad ferroviaria es la capacidad del sistema ferroviario transeuropeo de permitir la circulación segura y sin interrupciones de trenes entre distintas redes nacionales, según la Directiva 2016/797/UE."},
  {q:"¿Qué sistema europeo de señalización y control de trenes está implantándose en España?",opts:["ASFA","ERTMS/ETCS","ATP","CTC"],c:1,e:"El ERTMS (European Rail Traffic Management System) / ETCS (European Train Control System) es el sistema europeo que está sustituyendo progresivamente a los sistemas nacionales de señalización como el ASFA español."},
  {q:"¿Qué significa ADIF?",opts:["Administración de Infraestructuras Ferroviarias","Administrador de Infraestructuras Ferroviarias","Agencia de Infraestructuras Ferroviarias","Asociación de Infraestructuras Ferroviarias"],c:1,e:"ADIF es el Administrador de Infraestructuras Ferroviarias, entidad pública empresarial encargada de gestionar y mantener la red ferroviaria de interés general."},
  {q:"¿Cuál es la velocidad máxima comercial del AVE en España?",opts:["250 km/h","300 km/h","350 km/h","400 km/h"],c:1,e:"La velocidad máxima comercial del AVE en España es de 300 km/h, aunque la infraestructura permite velocidades de hasta 350 km/h en algunos tramos."},
  {q:"¿Qué tipo de tracción utilizan los trenes de alta velocidad en España?",opts:["Diésel","Eléctrica","Bimodal (diésel-eléctrica)","Hidrógeno"],c:1,e:"Los trenes de alta velocidad en España utilizan tracción eléctrica, alimentada por catenaria a 25.000 V en corriente alterna en la red de alta velocidad."},
  {q:"¿Cuál de las siguientes líneas fue la primera de alta velocidad inaugurada en España?",opts:["Madrid-Valencia","Madrid-Sevilla","Madrid-Barcelona","Madrid-Málaga"],c:1,e:"La línea Madrid-Sevilla fue la primera de alta velocidad en España, inaugurada el 14 de abril de 1992 coincidiendo con la Expo de Sevilla."},
  {q:"¿Qué es el 'canon de acceso' en el ferrocarril?",opts:["El precio del billete de tren","La tasa que pagan las empresas ferroviarias a ADIF por usar la infraestructura","El coste del mantenimiento de los trenes","La tarifa de consigna en estaciones"],c:1,e:"El canon de acceso es la tasa o peaje que las empresas operadoras ferroviarias deben pagar a ADIF por el uso de la red ferroviaria de su titularidad, incluyendo vías, estaciones y sistemas de seguridad."},
  {q:"¿Cuántos pasajeros mueve anualmente RENFE Cercanías aproximadamente?",opts:["100 millones","300 millones","500 millones","700 millones"],c:1,e:"RENFE Cercanías mueve en torno a 300-350 millones de viajeros anuales en condiciones normales, siendo el servicio ferroviario con más usuarios de España."},
],

oc_laboral: [
  {q:"¿Cuántos días de vacaciones anuales reconoce como mínimo el Estatuto de los Trabajadores?",opts:["20 días laborables","22 días naturales","30 días naturales","30 días laborables"],c:2,e:"El artículo 38 del Estatuto de los Trabajadores establece que el período de vacaciones anuales retribuidas será de 30 días naturales como mínimo."},
  {q:"¿Cuál es la jornada laboral máxima ordinaria según el Estatuto de los Trabajadores?",opts:["35 horas semanales","40 horas semanales","42 horas semanales","45 horas semanales"],c:1,e:"El artículo 34 del ET establece que la duración de la jornada de trabajo será la pactada en los convenios colectivos o contratos de trabajo, siendo el máximo ordinario 40 horas semanales de promedio en cómputo anual."},
  {q:"¿Qué es el finiquito?",opts:["La indemnización por despido improcedente","El documento que liquida las cantidades pendientes al terminar la relación laboral","El salario del último mes trabajado","La nómina de liquidación"],c:1,e:"El finiquito es el documento mediante el cual se saldan todas las cantidades pendientes entre empresa y trabajador al extinguirse la relación laboral: días trabajados, vacaciones no disfrutadas, partes proporcionales de pagas extras, etc."},
  {q:"¿Cuánto es la indemnización por despido improcedente según la reforma laboral de 2012?",opts:["20 días por año trabajado","33 días por año trabajado con máximo de 24 mensualidades","45 días por año trabajado","45 días hasta 2012 y 33 días desde entonces con prorrateo"],c:3,e:"Tras la reforma laboral de 2012 (RDL 3/2012), la indemnización por despido improcedente es de 33 días por año con máximo de 24 mensualidades para contratos nuevos. Los contratos anteriores a 2012 mantienen 45 días hasta esa fecha y 33 días desde entonces."},
  {q:"¿Qué organismo vela por el cumplimiento de la normativa laboral en las empresas?",opts:["Ministerio de Trabajo","SEPE","Inspección de Trabajo y Seguridad Social","INSS"],c:2,e:"La Inspección de Trabajo y Seguridad Social es el organismo público encargado de vigilar el cumplimiento de las normas del orden social, incluyendo condiciones de trabajo, prevención de riesgos laborales y Seguridad Social."},
  {q:"¿Cuál es el período mínimo de preaviso para la dimisión de un trabajador según el ET?",opts:["No existe obligación de preaviso","Lo que establezca el convenio colectivo o contrato","15 días naturales","30 días naturales"],c:1,e:"El ET no fija un período mínimo de preaviso para la dimisión; corresponde al convenio colectivo o al contrato establecerlo. En caso de no existir regulación, se estará a los usos y costumbres."},
  {q:"¿Qué es un convenio colectivo?",opts:["Un acuerdo entre empresa y trabajador individual","Un acuerdo entre sindicatos y empresarios que regula condiciones de trabajo","Una norma del gobierno sobre condiciones laborales","Un contrato de trabajo especial"],c:1,e:"Un convenio colectivo es el acuerdo negociado entre los representantes de los trabajadores (sindicatos) y los empresarios, que regula las condiciones de trabajo y empleo para un sector o empresa determinados."},
  {q:"¿A qué se refiere el concepto de 'período de prueba'?",opts:["Al tiempo de formación inicial","Al tiempo al inicio de la relación laboral durante el que cualquiera de las partes puede resolver el contrato sin causa ni indemnización","Al período antes de la jubilación","Al tiempo de baja por enfermedad"],c:1,e:"El período de prueba (art. 14 ET) es una fase inicial del contrato durante la cual empresa y trabajador pueden comprobar la idoneidad de la relación, con posibilidad de rescisión sin necesidad de alegar causa ni pagar indemnización."},
  {q:"¿Cuántas horas extraordinarias puede realizar un trabajador al año como máximo?",opts:["40 horas","60 horas","80 horas","100 horas"],c:2,e:"El artículo 35 del ET establece un máximo de 80 horas extraordinarias al año por trabajador, no computándose a estos efectos las realizadas para prevenir o reparar siniestros u otros daños urgentes."},
  {q:"¿Qué es el SMIG en el contexto laboral español?",opts:["Salario Mínimo Interprofesional General","Salario Mínimo Interprofesional Garantizado","Sindicato Mayoritario Interprofesional de Garantías","Servicio Mínimo Interno Garantizado"],c:1,e:"El SMI (Salario Mínimo Interprofesional) es la cuantía retributiva mínima que percibirá el trabajador por la jornada legal de trabajo. Se fija anualmente por el Gobierno mediante Real Decreto."},
],

oc_seguridad: [
  {q:"¿Cuál es la normativa básica de Prevención de Riesgos Laborales en España?",opts:["Real Decreto 39/1997","Ley 31/1995","Ley 54/2003","Real Decreto 486/1997"],c:1,e:"La Ley 31/1995 de Prevención de Riesgos Laborales es la norma básica que establece las obligaciones de empresarios y trabajadores en materia de seguridad y salud en el trabajo."},
  {q:"¿Qué es un EPI en el contexto de la seguridad laboral?",opts:["Equipo de Prevención Industrial","Equipo de Protección Individual","Elemento de Prevención de Incidentes","Equipo Personal de Inspección"],c:1,e:"EPI son las siglas de Equipo de Protección Individual. Son dispositivos o medios que lleva o sujeta el trabajador para que le proteja de uno o varios riesgos que puedan amenazar su seguridad o salud en el trabajo."},
  {q:"¿Quién tiene la obligación de proporcionar los EPIs a los trabajadores?",opts:["El propio trabajador","Los sindicatos","El empresario, de forma gratuita","El Servicio de Prevención Ajeno"],c:2,e:"Según el artículo 17 de la Ley 31/1995 de PRL, el empresario está obligado a proporcionar a sus trabajadores los equipos de protección individual adecuados para el desempeño de sus funciones y velar por su uso efectivo, de forma gratuita."},
  {q:"En caso de emergencia en una estación ferroviaria, ¿cuál es la prioridad principal?",opts:["Proteger el material móvil","Evacuar a los viajeros en primer lugar","Avisar a los medios de comunicación","Proteger las instalaciones"],c:1,e:"En cualquier emergencia ferroviaria, la prioridad absoluta es la seguridad y evacuación de las personas (viajeros y personal). El Plan de Autoprotección de las estaciones así lo establece."},
  {q:"¿Qué significa la señal de 'vía libre' en el sistema de señalización ferroviaria español?",opts:["Señal roja","Señal amarilla","Señal verde","Señal blanca"],c:2,e:"En el sistema de señalización ferroviaria español, el color verde indica 'vía libre', es decir, el tren puede circular a la velocidad máxima autorizada. El rojo indica parada y el amarillo precaución."},
  {q:"¿Qué es el Plan de Autoprotección de una estación?",opts:["El plan de marketing de la estación","El documento que define las medidas para prevenir y hacer frente a situaciones de emergencia","El plan de mantenimiento de instalaciones","El programa de atención al cliente"],c:1,e:"El Plan de Autoprotección es el documento que establece el marco orgánico y funcional previsto para un establecimiento, con el objeto de prevenir y controlar los riesgos y dar respuesta adecuada a las posibles situaciones de emergencia."},
  {q:"¿Cuál es el número de emergencias único en España?",opts:["091","062","112","080"],c:2,e:"El 112 es el número único de emergencias europeo, vigente en España y en toda la UE, que permite contactar con los servicios de emergencias (policía, bomberos, ambulancias) desde cualquier teléfono."},
  {q:"¿Qué es la ergonomía en el trabajo?",opts:["La disciplina que estudia los riesgos eléctricos","La ciencia que adapta el trabajo a las capacidades y limitaciones físicas del trabajador","El estudio de los riesgos químicos","La normativa sobre iluminación en el puesto de trabajo"],c:1,e:"La ergonomía es la disciplina que se ocupa de la adaptación del trabajo a las características físicas y mentales del trabajador, con el fin de prevenir lesiones musculoesqueléticas y mejorar el bienestar laboral."},
  {q:"¿Cuándo un trabajador puede abandonar su puesto de trabajo por riesgo grave e inminente?",opts:["Nunca sin autorización del jefe","Cuando el riesgo no pueda evitarse y suponga un peligro grave e inminente para su vida o salud","Solo si hay una evacuación oficial","Solo si el delegado de prevención lo autoriza"],c:1,e:"El artículo 21 de la Ley 31/1995 de PRL reconoce el derecho del trabajador a interrumpir su actividad y abandonar el lugar de trabajo en caso necesario cuando considere que existe un riesgo grave e inminente para su vida o salud."},
  {q:"¿Qué es el Servicio de Prevención en una empresa?",opts:["El departamento de Recursos Humanos","El conjunto de medios humanos y materiales necesarios para realizar las actividades preventivas","El departamento de seguridad privada","El gabinete médico de empresa"],c:1,e:"El Servicio de Prevención es el conjunto de medios humanos y materiales necesarios para realizar las actividades preventivas, asesorar y asistir al empresario, a los trabajadores y a sus representantes en materia de PRL."},
],

oc_atencion: [
  {q:"¿Cuál es el protocolo correcto al atender a un cliente que presenta una reclamación?",opts:["Derivarle inmediatamente a otro departamento","Escuchar activamente, mostrar empatía, buscar solución y hacer seguimiento","Pedirle que lo ponga por escrito antes de atenderle","Indicarle que no es posible resolver su problema"],c:1,e:"El protocolo de atención de reclamaciones incluye: escucha activa sin interrumpir, empatía con el cliente, disculpa si procede, búsqueda de solución eficaz, y seguimiento para verificar la satisfacción."},
  {q:"¿Qué es la 'escucha activa' en atención al cliente?",opts:["Escuchar mientras se realizan otras tareas","Prestar atención plena al cliente, mostrando interés y confirmando la comprensión del mensaje","Interrumpir al cliente para agilizar la conversación","Tomar notas sin mirar al cliente"],c:1,e:"La escucha activa implica prestar atención plena al interlocutor: mantener contacto visual, no interrumpir, hacer gestos de asentimiento, reformular para confirmar la comprensión, y evitar distracciones."},
  {q:"¿Cuántas horas tiene el operador comercial para responder a una reclamación presentada en ventanilla según los estándares de RENFE?",opts:["24 horas","48 horas","30 días","15 días hábiles"],c:2,e:"Según la normativa de protección al consumidor y los estándares de calidad de RENFE, las reclamaciones deben responderse en un plazo máximo de 30 días desde su presentación."},
  {q:"¿Qué información mínima debe recogerse en una hoja de reclamaciones?",opts:["Solo el nombre del cliente","Datos del reclamante, fecha, hechos objeto de reclamación y firma","Número de billete únicamente","DNI y número de teléfono"],c:1,e:"Una hoja de reclamaciones debe recoger: identificación del reclamante (nombre, DNI, datos de contacto), identificación del establecimiento, fecha y lugar, descripción clara de los hechos y firma."},
  {q:"¿Cómo se debe actuar ante un cliente con discapacidad visual en una estación?",opts:["Hablarle en voz muy alta","Preguntarle si necesita ayuda y, si acepta, guiarle tomándole del codo","Ignorar su condición y tratarle igual que a cualquier otro cliente","Llamar siempre al servicio de atención especial"],c:1,e:"La atención a personas con discapacidad visual requiere ofrecerse a ayudar sin imposición, preguntar cómo prefieren recibir la asistencia. Si aceptan ser guiados, se les ofrece el codo (no se les agarra) para que vayan a su ritmo."},
  {q:"¿Qué es la 'comunicación no verbal' en el contexto de atención al cliente?",opts:["La comunicación escrita","Los mensajes transmitidos mediante gestos, expresión facial, postura y tono de voz","La comunicación telefónica","Los carteles e indicaciones visuales"],c:1,e:"La comunicación no verbal incluye el lenguaje corporal (postura, gestos), expresión facial, contacto visual, distancia interpersonal y tono, velocidad y volumen de la voz. Supone un alto porcentaje del mensaje total transmitido."},
  {q:"¿Qué significa el concepto de 'cliente interno' en una organización?",opts:["El cliente que compra dentro de la estación","Los propios empleados y compañeros de trabajo que reciben el resultado de nuestro trabajo","El cliente habitual o fidelizado","El cliente que trabaja en la empresa"],c:1,e:"El cliente interno son los propios empleados y departamentos de la organización que reciben o se benefician del trabajo de otros compañeros o áreas. Tratarles bien es esencial para la calidad del servicio final."},
  {q:"En atención telefónica, ¿cuál debe ser el saludo estándar al atender una llamada?",opts:["¿Sí? ¿Qué desea?","Buenos días/tardes, [nombre empresa/servicio], le atiende [nombre], ¿en qué puedo ayudarle?","¿Dígame?","Hola, ¿qué necesita?"],c:1,e:"El saludo telefónico profesional debe incluir: saludo según hora del día, identificación de la empresa o servicio, identificación personal del agente y ofrecimiento de ayuda. Transmite profesionalidad y orientación al cliente."},
],

oc_informatica: [
  {q:"¿Qué atajo de teclado se utiliza para guardar un archivo en la mayoría de aplicaciones Windows?",opts:["Ctrl+G","Ctrl+S","Alt+S","F5"],c:1,e:"Ctrl+S (de 'Save') es el atajo de teclado estándar para guardar en Windows. En aplicaciones de Microsoft Office también funciona Ctrl+G (en versiones en español)."},
  {q:"¿Qué es una base de datos relacional?",opts:["Un programa para crear presentaciones","Un sistema de almacenamiento de datos organizado en tablas relacionadas entre sí","Un tipo de hoja de cálculo","Un sistema de correo electrónico"],c:1,e:"Una base de datos relacional organiza los datos en tablas (relaciones) con filas y columnas, donde las tablas se pueden vincular mediante claves. El modelo relacional fue propuesto por Edgar Codd en 1970."},
  {q:"¿Cuál de los siguientes es un gestor de correo electrónico?",opts:["Microsoft Word","Mozilla Thunderbird","Google Chrome","Adobe Acrobat"],c:1,e:"Mozilla Thunderbird es un cliente de correo electrónico gratuito y de código abierto. Otros ejemplos son Microsoft Outlook, Apple Mail o el cliente web Gmail."},
  {q:"¿Qué es el 'phishing'?",opts:["Un tipo de virus informático que daña archivos","Una técnica de fraude para obtener información confidencial suplantando la identidad de entidades de confianza","Un programa para proteger el ordenador","Un tipo de actualización del sistema"],c:1,e:"El phishing es una técnica de ingeniería social mediante la cual los atacantes se hacen pasar por entidades legítimas (bancos, empresas) por correo u otros medios para engañar a las víctimas y obtener datos confidenciales."},
  {q:"¿Qué extensión tienen los archivos de Microsoft Excel?",opts:[".doc / .docx",".ppt / .pptx",".xls / .xlsx",".pdf"],c:2,e:"Los archivos de Microsoft Excel tienen extensión .xls (formato antiguo, hasta Office 2003) o .xlsx (formato Open XML, desde Office 2007). Los archivos .doc/.docx son de Word y .ppt/.pptx de PowerPoint."},
  {q:"¿Qué es una dirección IP?",opts:["El nombre del ordenador en la red","Una identificación numérica asignada a cada dispositivo conectado a una red","La contraseña de acceso a internet","El número de serie del ordenador"],c:1,e:"Una dirección IP (Internet Protocol) es un número único asignado a cada dispositivo conectado a una red, que permite identificarlo y localizarlo para el intercambio de datos. Puede ser IPv4 (p.ej. 192.168.1.1) o IPv6."},
  {q:"¿Para qué se utiliza Microsoft PowerPoint?",opts:["Gestión de correo electrónico","Creación de hojas de cálculo","Creación de presentaciones con diapositivas","Edición de imágenes"],c:2,e:"Microsoft PowerPoint es la aplicación del paquete Office destinada a la creación de presentaciones compuestas por diapositivas, que pueden incluir texto, imágenes, gráficos, vídeos y animaciones."},
  {q:"¿Qué significa 'adjunto' en el contexto del correo electrónico?",opts:["El destinatario del correo","Un archivo que se envía junto al mensaje de correo","La firma del correo","La respuesta a un correo anterior"],c:1,e:"Un adjunto o archivo adjunto en correo electrónico es cualquier archivo (documento, imagen, etc.) que se envía junto con el mensaje de correo. Aparece como un icono o enlace separado del cuerpo del mensaje."},
],

oc_ingles: [
  {q:"How do you say 'el andén' in English?",opts:["Track","Platform","Gate","Waiting room"],c:1,e:"'Platform' is the English word for 'andén', the raised area in a station where passengers board and alight from trains. Example: 'The train to Madrid departs from platform 3.'"},
  {q:"A passenger asks: 'Excuse me, where is the ticket office?' What does 'ticket office' mean?",opts:["La cafetería","Los aseos","La taquilla / ventanilla de billetes","La consigna"],c:2,e:"'Ticket office' means 'taquilla' or 'ventanilla de billetes', the place where passengers can buy or collect their train tickets. Also known as 'booking office'."},
  {q:"What is the correct English phrase to inform a passenger about a delay?",opts:["The train is late","I'm sorry, the train to Seville is running approximately 20 minutes late","The train no go on time","Sorry, train delayed"],c:1,e:"In professional customer service, the correct phrase is: 'I'm sorry, the train to [destination] is running approximately [X] minutes late.' It includes an apology, the specific service and the estimated delay."},
  {q:"What does 'round trip' mean?",opts:["Billete de ida","Billete de ida y vuelta","Viaje en círculo","Tarifa especial"],c:1,e:"'Round trip' means 'ida y vuelta' (return ticket). 'One way' or 'single' means only 'ida'. Example: 'I'd like a round trip ticket to Barcelona, please.'"},
  {q:"A foreign customer says 'I've missed my train'. What does this mean?",opts:["He perdido mi billete","He perdido el tren (no llegué a tiempo)","Quiero perder el tren","El tren se ha perdido"],c:1,e:"'I've missed my train' means 'He perdido el tren', i.e., the passenger did not make it to the train in time and it has already departed. The response should offer alternatives."},
  {q:"Which phrase correctly offers assistance to a passenger?",opts:["What do you want?","How can I help you?","Tell me your problem","You need help?"],c:1,e:"'How can I help you?' is the standard professional greeting in English customer service. It is polite and open-ended. 'What do you want?' is rude. Always use formal/polite language with customers."},
  {q:"What does 'luggage storage' mean in a train station?",opts:["Zona de equipajes perdidos","Consigna de equipajes","Tienda de maletas","Control de seguridad"],c:1,e:"'Luggage storage' or 'left-luggage office' is the 'consigna', the place where passengers can temporarily store their luggage. 'Lost luggage' or 'lost and found' refers to objetos perdidos."},
  {q:"How do you say 'el revisor / interventor de tren' in English?",opts:["Conductor","Guard","Ticket inspector","Driver"],c:2,e:"'Ticket inspector' or 'ticket collector' is the person who checks passengers' tickets on the train. 'Conductor' in British English can also mean this. 'Driver' is the train driver (maquinista)."},
],

psico_series: [
  {q:"¿Cuál es el siguiente número? 2, 6, 18, 54, ?",opts:[108,162,72,216],c:1,e:"Cada término se multiplica por 3: 2×3=6, 6×3=18, 18×3=54, 54×3=162."},
  {q:"¿Cuál es el siguiente número? 100, 91, 83, 76, 70, ?",opts:[65,64,63,66],c:0,e:"Las diferencias van disminuyendo: -9, -8, -7, -6, -5. Por tanto 70-5=65."},
  {q:"¿Cuál es el siguiente número? 1, 4, 9, 16, 25, ?",opts:[30,36,32,35],c:1,e:"Son los cuadrados perfectos: 1²=1, 2²=4, 3²=9, 4²=16, 5²=25, 6²=36."},
  {q:"¿Cuál es el siguiente número? 3, 8, 15, 24, 35, ?",opts:[45,46,48,50],c:2,e:"Las diferencias son: +5, +7, +9, +11, +13. Siguen sumando impares consecutivos. 35+13=48."},
  {q:"¿Cuál es el siguiente número? 2, 3, 5, 8, 13, 21, ?",opts:[29,31,34,36],c:2,e:"Es la serie de Fibonacci: cada número es la suma de los dos anteriores. 13+21=34."},
  {q:"¿Cuál es el siguiente número? 80, 40, 20, 10, ?",opts:[2,4,5,8],c:2,e:"Cada término se divide entre 2. 10÷2=5."},
  {q:"¿Cuál es el siguiente número? 7, 14, 28, 56, ?",opts:[98,112,100,120],c:1,e:"Cada término se multiplica por 2. 56×2=112."},
  {q:"¿Cuál es el siguiente número? 1, 2, 4, 7, 11, 16, ?",opts:[20,21,22,23],c:2,e:"Las diferencias son: +1, +2, +3, +4, +5, +6. Por tanto 16+6=22."},
  {q:"¿Cuál es el siguiente número? 5, 10, 20, 40, 80, ?",opts:[120,140,160,180],c:2,e:"Cada término se multiplica por 2. 80×2=160."},
  {q:"¿Cuál es el siguiente número? 15, 12, 9, 6, ?",opts:[2,3,4,5],c:1,e:"Se resta 3 en cada paso. 6-3=3."},
  {q:"¿Cuál es el siguiente número? 1, 3, 7, 15, 31, ?",opts:[57,61,63,65],c:2,e:"Cada término se multiplica por 2 y se suma 1: 1×2+1=3, 3×2+1=7... 31×2+1=63."},
  {q:"¿Cuál es el siguiente número? 144, 121, 100, 81, ?",opts:[64,62,72,68],c:0,e:"Son cuadrados perfectos en orden descendente: 12², 11², 10², 9², 8²=64."},
],

psico_verbal: [
  {q:"¿Cuál es el sinónimo de DILIGENTE?",opts:["Perezoso","Laborioso","Descuidado","Lento"],c:1,e:"DILIGENTE significa que actúa con rapidez, cuidado y eficacia. Su sinónimo más adecuado es LABORIOSO (trabajador, aplicado). Lo contrario (antónimo) sería perezoso."},
  {q:"¿Cuál es el antónimo de FRUGAL?",opts:["Austero","Pobre","Derrochador","Sencillo"],c:2,e:"FRUGAL significa moderado en comer y beber, o en gastos. Su antónimo es DERROCHADOR (que gasta sin mesura). Austero y sencillo son sinónimos."},
  {q:"LIBRO es a BIBLIOTECA como CUADRO es a...",opts:["Pintura","Museo","Marco","Artista"],c:1,e:"La analogía es: un libro se guarda/expone en una biblioteca; un cuadro se guarda/expone en un museo. La relación es objeto-lugar donde se expone."},
  {q:"¿Cuál es el sinónimo de EFÍMERO?",opts:["Eterno","Transitorio","Permanente","Sólido"],c:1,e:"EFÍMERO significa que dura muy poco tiempo. Su sinónimo es TRANSITORIO (pasajero, de corta duración). Eterno y permanente son antónimos."},
  {q:"¿Cuál es el antónimo de BENEVOLENTE?",opts:["Bondadoso","Generoso","Malévolo","Amable"],c:2,e:"BENEVOLENTE significa bien intencionado, bondadoso. Su antónimo es MALÉVOLO (con mala voluntad o intención de hacer daño)."},
  {q:"MÉDICO es a HOSPITAL como MAESTRO es a...",opts:["Libro","Alumno","Escuela","Conocimiento"],c:2,e:"La analogía es: un médico trabaja en un hospital; un maestro trabaja en una escuela. La relación es profesional-lugar de trabajo."},
  {q:"¿Cuál es el sinónimo de PERSPICAZ?",opts:["Torpe","Agudo","Lento","Ingenuo"],c:1,e:"PERSPICAZ significa que tiene gran capacidad para percibir y comprender. Su sinónimo es AGUDO (inteligente, de comprensión rápida). Torpe e ingenuo son antónimos."},
  {q:"¿Qué palabra completa la analogía? AGUA : SED :: COMIDA : ?",opts:["Hambre","Cocina","Restaurante","Boca"],c:0,e:"El agua calma la sed; la comida calma el hambre. La relación es sustancia-necesidad que satisface."},
],

  // result
  result: null,
  showReview: false,
  // stats
  stats: loadStats(),
  // config modal
  configTopics: ['oc_empresa','oc_ferroviario','oc_laboral'],
  configNumQ: 20,
  configTime: 30,
};

function loadStats(){
  try{const s=localStorage.getItem('renfe_stats_v2');return s?JSON.parse(s):{exams:[]}}
  catch{return{exams:[]}}
}
function saveStats(){
  try{localStorage.setItem('renfe_stats_v2',JSON.stringify(STATE.stats))}catch{}
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function fmt(s){const m=Math.floor(s/60),sc=s%60;return`${m}:${String(sc).padStart(2,'0')}`}

// ══════════════════════════════════════════════════════
//  GENERACIÓN DE PREGUNTAS IA (online)
// ══════════════════════════════════════════════════════
async function generateAI(topicId, label, count){
  const extra = {
    oc_empresa:"Historia, estructura, filiales y servicios de Renfe.",
    oc_ferroviario:"Red ferroviaria española, ADIF, tipos de trenes, Ley del Sector Ferroviario 2003.",
    oc_laboral:"Estatuto de los Trabajadores, convenio RENFE, jornada, contratos, despidos.",
    oc_seguridad:"PRL en ferroviario, seguridad en instalaciones, normas de circulación.",
    oc_atencion:"Protocolo de atención al cliente, reclamaciones, calidad en el servicio.",
    oc_informatica:"Office, correo electrónico, sistemas de reservas, ciberseguridad básica.",
    oc_ingles:"Vocabulario ferroviario, atención básica a clientes extranjeros.",
    psico_series:"Series numéricas para oposiciones.",
    psico_verbal:"Sinónimos, antónimos y analogías verbales para oposiciones.",
  };
  const p=`Eres experto en oposiciones Renfe Operador Comercial N2.
Genera ${count} preguntas tipo test sobre: ${label}. Contexto: ${extra[topicId]||label}
REGLAS: preguntas rigurosas del nivel real de las oposiciones, 4 opciones (A-D), 1 correcta, opciones plausibles.
Responde SOLO JSON sin markdown:
{"questions":[{"question":"...","options":["A","B","C","D"],"correct":0,"explanation":"..."}]}`;
  const r=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,
      messages:[{role:"user",content:p}]})
  });
  const d=await r.json();
  const t=d.content?.map(i=>i.text||"").join("")||"";
  const clean=t.replace(/```json|```/g,"").trim();
  return JSON.parse(clean).questions||[];
}

// ══════════════════════════════════════════════════════
//  LÓGICA DE QUIZ
// ══════════════════════════════════════════════════════
async function startQuiz(cfg){
  STATE.quizConfig=cfg;
  STATE.view='quiz_loading';
  STATE.answers={};STATE.revealed={};STATE.current=0;
  render();

  let questions=[];
  if(STATE.online && cfg.useAI){
    try{
      const perTopic=Math.max(3,Math.ceil(cfg.numQ/cfg.topics.length));
      const all=await Promise.all(cfg.topics.map(id=>{
        const t=TOPICS.find(t=>t.id===id);
        return generateAI(id,t?.label||id,perTopic);
      }));
      questions=shuffle(all.flat()).slice(0,cfg.numQ)
        .map((q,i)=>({...q,id:i,source:'ai'}));
    }catch(e){console.warn('AI failed, using offline',e)}
  }

  if(questions.length<cfg.numQ){
    // Completar con offline
    let offline=[];
    cfg.topics.forEach(id=>{
      const pool=OFFLINE_QUESTIONS[id]||[];
      offline.push(...pool.map(q=>({...q,id:0,source:'offline',topicId:id})));
    });
    const needed=cfg.numQ-questions.length;
    const fill=shuffle(offline).slice(0,needed);
    questions=[...questions,...fill].map((q,i)=>({...q,id:i}));
  }

  STATE.questions=questions;
  STATE.timeLeft=cfg.timeLimitSec;
  STATE.view='quiz';

  clearInterval(STATE.timerInterval);
  STATE.timerInterval=setInterval(()=>{
    STATE.timeLeft--;
    if(STATE.timeLeft<=0){clearInterval(STATE.timerInterval);finishQuiz();}
    else{updateTimer();}
  },1000);
  render();
}

function updateTimer(){
  const el=document.getElementById('timer');
  if(!el)return;
  el.textContent='⏱ '+fmt(STATE.timeLeft);
  el.className='timer'+(STATE.timeLeft<60?' danger':STATE.timeLeft<180?' warn':'');
}

function selectAnswer(qi,opt){
  if(STATE.answers[qi]!==undefined)return;
  STATE.answers[qi]=opt;
  STATE.revealed[qi]=true;
  renderQuestion();
}

function finishQuiz(){
  clearInterval(STATE.timerInterval);
  const q=STATE.questions;
  const correct=q.filter((_,i)=>STATE.answers[i]===q[i].c||STATE.answers[i]===q[i].correct).length;
  const wrong=q.filter((_,i)=>STATE.answers[i]!==undefined&&STATE.answers[i]!==-1&&STATE.answers[i]!==(q[i].c!==undefined?q[i].c:q[i].correct)).length;
  const skipped=q.length-correct-wrong;
  const pct=Math.round(correct/q.length*100);
  STATE.result={questions:q,answers:{...STATE.answers},correct,wrong,skipped,total:q.length,
    pct,timeTaken:STATE.quizConfig.timeLimitSec-STATE.timeLeft};
  STATE.stats.exams.push({date:Date.now(),correct,total:q.length,pct});
  saveStats();
  STATE.showReview=false;
  STATE.view='results';
  render();
}

// ══════════════════════════════════════════════════════
//  RENDER HELPERS
// ══════════════════════════════════════════════════════
const $=id=>document.getElementById(id);
const h=(tag,attrs,children)=>{
  let s=`<${tag}`;
  for(const[k,v]of Object.entries(attrs||{}))if(v!==undefined&&v!==false)s+=` ${k}="${v}"`;
  if(children===null)return s+'/>';
  return s+`>${Array.isArray(children)?children.join(''):children||''}</${tag}>`;
};

function getCorrect(q){return q.c!==undefined?q.c:q.correct;}

function renderOption(q,qi,i,letters){
  const rev=STATE.revealed[qi];
  const sel=STATE.answers[qi]===i;
  const c=getCorrect(q);
  let cls='opt';
  if(rev){
    if(i===c)cls+=' ok';
    else if(sel&&i!==c)cls+=' ko';
  } else if(sel) cls+=' sel';
  const disabled=STATE.answers[qi]!==undefined?'disabled':'';
  return `<button class="${cls}" onclick="selectAnswer(${qi},${i})" ${disabled}>
    <span class="opt-l">${letters[i]}</span>${q.opts?.[i]||q.options?.[i]||''}
  </button>`;
}

function renderQuestion(){
  const el=$('q-area');if(!el)return;
  const qi=STATE.current;
  const q=STATE.questions[qi];
  if(!q){el.innerHTML='';return;}
  const letters=['A','B','C','D'];
  const rev=STATE.revealed[qi];
  const c=getCorrect(q);
  const expl=q.e||q.explanation||'';
  el.innerHTML=`
  <div class="q-card">
    <div class="q-num">Pregunta ${qi+1} <span class="q-badge">${q.source==='ai'?'IA':'Offline'}</span></div>
    <div class="q-text">${q.q||q.question}</div>
    <div class="opts">${[0,1,2,3].map(i=>renderOption(q,qi,i,letters)).join('')}</div>
    ${rev&&expl?`<div class="expl"><strong>💡 Explicación</strong>${expl}</div>`:''}
  </div>`;
  // nav buttons
  const navEl=$('quiz-nav-btns');if(!navEl)return;
  const answered=STATE.answers[qi]!==undefined;
  const last=qi===STATE.questions.length-1;
  navEl.innerHTML=`
    <button class="btn btn-ghost btn-sm" ${qi===0?'disabled':''} onclick="prevQ()">← Anterior</button>
    <div style="display:flex;gap:8px">
      ${!answered?`<button class="btn btn-ghost btn-sm" onclick="skipQ()">Omitir</button>`:''}
      ${!last?`<button class="btn btn-primary btn-sm" ${!answered?'disabled':''} onclick="nextQ()">Siguiente →</button>`
              :`<button class="btn btn-primary btn-sm" onclick="finishQuiz()">Finalizar ✓</button>`}
    </div>`;
}

function prevQ(){STATE.current--;renderQuestion();scrollTop();}
function nextQ(){STATE.current++;renderQuestion();scrollTop();}
function skipQ(){
  STATE.answers[STATE.current]=-1;
  if(STATE.current<STATE.questions.length-1){STATE.current++;renderQuestion();}
  else renderQuestion();
}
function scrollTop(){const s=$('main-screen');if(s)s.scrollTo(0,0);}

// ══════════════════════════════════════════════════════
//  RENDER PRINCIPAL
// ══════════════════════════════════════════════════════
function render(){
  const app=$('app');
  const stats=STATE.stats;
  const totalExams=stats.exams.length;
  const avgScore=totalExams?Math.round(stats.exams.reduce((a,b)=>a+b.pct,0)/totalExams):0;

  app.innerHTML=`
  ${STATE.showInstall?`
  <div class="install-bar">
    <div class="install-txt">📱 <strong>Instalar como app</strong> — Úsala sin internet, en tu pantalla de inicio</div>
    <button class="btn btn-primary btn-sm" onclick="installApp()">Instalar</button>
    <button class="install-close" onclick="dismissInstall()">✕</button>
  </div>`:''}

  <header class="hdr">
    <div class="hdr-logo">
      <div class="hdr-badge">RENFE</div>
      <div class="hdr-sub">Opos · OC N2</div>
    </div>
    <div class="hdr-actions">
      <div class="online-dot ${STATE.online?'online':''}" title="${STATE.online?'Online':'Sin conexión'}"></div>
      <button class="hdr-btn ${STATE.view==='home'?'active':''}" onclick="goHome()">Inicio</button>
      <button class="hdr-btn ${STATE.view==='stats'?'active':''}" onclick="goStats()">📊</button>
    </div>
  </header>

  <div class="screen" id="main-screen">
    ${renderView(totalExams,avgScore)}
  </div>

  ${STATE.view==='quiz'?`
  <div class="quiz-nav">
    <div id="quiz-nav-btns" style="display:flex;justify-content:space-between;width:100%;align-items:center"></div>
  </div>`:''}

  ${STATE.view==='config'?renderConfigModal():''}
  `;

  if(STATE.view==='quiz'){renderQuestion();updateTimer();}
}

function renderView(totalExams,avgScore){
  switch(STATE.view){
    case 'home': return renderHome(totalExams,avgScore);
    case 'quiz_loading': return `<div class="loader"><div class="spin"></div><div class="loader-title">Preparando preguntas…</div><div class="loader-sub">${STATE.online?'Generando con IA + banco offline':'Cargando banco offline'}</div></div>`;
    case 'quiz': return renderQuizScreen();
    case 'results': return renderResults();
    case 'stats': return renderStats(totalExams,avgScore);
    default: return renderHome(totalExams,avgScore);
  }
}

function renderHome(totalExams,avgScore){
  const topicCards=TOPICS.map(t=>`
    <div class="topic-card" style="--accent:${t.accent}" onclick="startTopicTest('${t.id}')">
      <div class="tc-icon">${t.icon}</div>
      <div class="tc-name">${t.label}</div>
      <div class="tc-tag">${t.tag}</div>
    </div>`).join('');

  return `<div class="home">
    <div class="hero">
      <div class="hero-title">Prepara tu <em>oposición</em> Renfe</div>
      <div class="hero-sub">Simulacros con IA + banco offline de +200 preguntas del temario oficial OC N2</div>
      <div class="hero-row">
        <button class="btn btn-primary" onclick="openConfig()">🚀 Simulacro oficial</button>
        <button class="btn btn-ghost" style="color:#fff;border-color:rgba(255,255,255,.3)" onclick="startTopicTest('psico_series')">🔢 Psicotécnicos</button>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat-mini"><div class="stat-n">${totalExams}</div><div class="stat-l">Simulacros</div></div>
      <div class="stat-mini"><div class="stat-n">${avgScore?avgScore+'%':'—'}</div><div class="stat-l">Media</div></div>
      <div class="stat-mini"><div class="stat-n">${STATE.online?'🟢':'🔴'}</div><div class="stat-l">${STATE.online?'Online':'Offline'}</div></div>
    </div>
    <div class="section-hd">📚 Practicar por tema</div>
    <div class="topic-grid">${topicCards}</div>
  </div>`;
}

function renderQuizScreen(){
  const prog=Math.round(((STATE.current+1)/STATE.questions.length)*100);
  return `<div class="quiz">
    <div class="quiz-hdr">
      <div class="quiz-title">Simulacro Operador Comercial N2</div>
      <div class="timer" id="timer">⏱ ${fmt(STATE.timeLeft)}</div>
    </div>
    <div class="prog-bar"><div class="prog-fill" style="width:${prog}%"></div></div>
    <div class="prog-txt">${STATE.current+1} / ${STATE.questions.length}</div>
    <div id="q-area"></div>
  </div>`;
}

function renderResults(){
  const r=STATE.result;
  const passed=r.pct>=50;
  let reviewHtml='';
  if(STATE.showReview){
    reviewHtml=`<div class="section-hd" style="margin-top:1.5rem">Revisión</div>
    <div class="review-list">${r.questions.map((q,i)=>{
      const ua=r.answers[i];
      const c=getCorrect(q);
      const isOk=ua===c;
      const isSkip=ua===-1||ua===undefined;
      const accent=isSkip?'#6B7280':isOk?'#16A34A':'#C8102E';
      const opts=q.opts||q.options||[];
      return `<div class="rev-item" style="--accent:${accent}">
        <div class="rev-q">${i+1}. ${q.q||q.question}</div>
        <div class="rev-a">${isSkip?'<span style="color:#6B7280">⬜ Sin contestar</span>':
          isOk?`<span style="color:#16A34A">✅ ${opts[c]}</span>`:
          `<span style="color:#C8102E">❌ Tu respuesta: ${opts[ua]||'?'}</span> · <span style="color:#16A34A">✓ ${opts[c]}</span>`}
        </div>
        ${!isSkip&&!isOk&&(q.e||q.explanation)?`<div class="expl" style="margin-top:.5rem;font-size:.8rem"><strong>💡</strong>${q.e||q.explanation}</div>`:''}
      </div>`;
    }).join('')}</div>`;
  }

  return `<div class="results">
    <div class="res-hero">
      <div class="res-score">${r.pct}%</div>
      <div class="res-label">${r.correct}/${r.total} correctas · ${fmt(r.timeTaken)}</div>
      <div class="res-verdict">${passed?'✅ APROBADO':'❌ SUSPENSO'}</div>
      <div class="res-grid">
        <div class="rs"><div class="rs-n c-green">${r.correct}</div><div class="rs-l">Correctas</div></div>
        <div class="rs"><div class="rs-n c-red">${r.wrong}</div><div class="rs-l">Incorrectas</div></div>
        <div class="rs"><div class="rs-n c-gray">${r.skipped}</div><div class="rs-l">Omitidas</div></div>
      </div>
    </div>
    <div style="display:flex;gap:.75rem;margin-bottom:1.25rem;flex-wrap:wrap">
      <button class="btn btn-secondary btn-sm" onclick="goHome()">← Nuevo simulacro</button>
      <button class="btn btn-primary btn-sm" onclick="toggleReview()">📋 ${STATE.showReview?'Ocultar':'Ver'} revisión</button>
    </div>
    ${reviewHtml}
  </div>`;
}

function renderStats(totalExams,avgScore){
  const best=totalExams?Math.max(...STATE.stats.exams.map(e=>e.pct)):0;
  const totalQ=STATE.stats.exams.reduce((a,b)=>a+(b.total||0),0);
  const histRows=totalExams?[...STATE.stats.exams].reverse().slice(0,15).map((e,i)=>`
    <tr>
      <td>${STATE.stats.exams.length-i}</td>
      <td>${new Date(e.date).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})}</td>
      <td>${e.correct}/${e.total}</td>
      <td><strong>${e.pct}%</strong></td>
      <td><span class="badge ${e.pct>=50?'b-green':e.pct>=35?'b-orange':'b-red'}">${e.pct>=50?'Aprobado':e.pct>=35?'Cerca':'Suspenso'}</span></td>
    </tr>`).join('')
    :`<tr><td colspan="5" style="text-align:center;color:#6B7280;padding:1.5rem">Sin simulacros aún</td></tr>`;

  return `<div class="stats-pg">
    <div class="section-hd">📊 Mis Estadísticas</div>
    <div class="stats-grid">
      <div class="big-stat"><div class="big-n">${totalExams}</div><div class="big-l">Simulacros</div></div>
      <div class="big-stat"><div class="big-n">${avgScore?avgScore+'%':'—'}</div><div class="big-l">Media</div></div>
      <div class="big-stat"><div class="big-n">${best?best+'%':'—'}</div><div class="big-l">Mejor nota</div></div>
      <div class="big-stat"><div class="big-n">${totalQ}</div><div class="big-l">Preguntas</div></div>
    </div>
    <div class="section-hd">Historial</div>
    <table class="hist-table">
      <thead><tr><th>#</th><th>Fecha</th><th>Resultado</th><th>%</th><th>Estado</th></tr></thead>
      <tbody>${histRows}</tbody>
    </table>
    <div style="margin-top:1rem;text-align:right">
      <button class="btn btn-ghost btn-sm" onclick="clearStats()">🗑 Borrar historial</button>
    </div>
  </div>`;
}

function renderConfigModal(){
  const topicChips=TOPICS.map(t=>`
    <button class="chip ${STATE.configTopics.includes(t.id)?'on':''}"
      onclick="toggleTopic('${t.id}')">${t.icon} ${t.label.split(' ').slice(0,2).join(' ')}</button>`).join('');

  const aiOpt=STATE.online?`
    <div class="modal-sec">
      <div class="modal-lbl">Tipo de preguntas</div>
      <div class="chips">
        <button class="chip on" id="chip-offline" onclick="toggleAI(false)">📦 Banco offline</button>
        <button class="chip" id="chip-ai" onclick="toggleAI(true)">🤖 IA (requiere conexión)</button>
      </div>
    </div>`:'<div style="color:#6B7280;font-size:.82rem;margin-bottom:1rem">📦 Modo offline — se usará el banco de preguntas integrado</div>';

  return `<div class="overlay" onclick="closeConfig()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">⚙️ Configurar simulacro</div>
    <div class="modal-sec">
      <div class="modal-lbl">Temas</div>
      <div class="chips">${topicChips}</div>
    </div>
    <div class="modal-sec">
      <div class="modal-lbl">Nº de preguntas</div>
      <div class="num-row">
        <button class="num-btn" onclick="adjNumQ(-5)">−</button>
        <div class="num-v" id="nq-val">${STATE.configNumQ}</div>
        <button class="num-btn" onclick="adjNumQ(5)">+</button>
      </div>
    </div>
    <div class="modal-sec">
      <div class="modal-lbl">Tiempo (minutos)</div>
      <div class="num-row">
        <button class="num-btn" onclick="adjTime(-5)">−</button>
        <div class="num-v" id="nt-val">${STATE.configTime}</div>
        <button class="num-btn" onclick="adjTime(5)">+</button>
      </div>
    </div>
    ${aiOpt}
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" onclick="closeConfig()">Cancelar</button>
      <button class="btn btn-primary btn-sm" ${STATE.configTopics.length===0?'disabled':''}
        onclick="launchExam()">🚀 Empezar</button>
    </div>
  </div></div>`;
}

// ══════════════════════════════════════════════════════
//  ACCIONES GLOBALES (accesibles desde HTML onclick)
// ══════════════════════════════════════════════════════
function goHome(){STATE.view='home';render();}
function goStats(){STATE.view='stats';render();}
function openConfig(){STATE.view='config';render();}
function closeConfig(){STATE.view='home';render();}
function toggleReview(){STATE.showReview=!STATE.showReview;render();}
function clearStats(){if(confirm('¿Borrar todo el historial?')){STATE.stats={exams:[]};saveStats();render();}}

function toggleTopic(id){
  if(STATE.configTopics.includes(id)) STATE.configTopics=STATE.configTopics.filter(t=>t!==id);
  else STATE.configTopics=[...STATE.configTopics,id];
  // Re-render solo el modal para no cerrar
  $('app').querySelector('.modal').outerHTML; // hack: full re-render
  render();
}

let _useAI=false;
function toggleAI(v){
  _useAI=v;
  document.querySelectorAll('#chip-offline,#chip-ai').forEach((el,i)=>{
    el.classList.toggle('on',i===(v?1:0));
  });
}

function adjNumQ(d){
  STATE.configNumQ=Math.min(40,Math.max(5,STATE.configNumQ+d));
  const el=$('nq-val');if(el)el.textContent=STATE.configNumQ;
}
function adjTime(d){
  STATE.configTime=Math.min(90,Math.max(10,STATE.configTime+d));
  const el=$('nt-val');if(el)el.textContent=STATE.configTime;
}

function launchExam(){
  startQuiz({
    topics:STATE.configTopics,
    numQ:STATE.configNumQ,
    timeLimitSec:STATE.configTime*60,
    useAI:_useAI&&STATE.online,
  });
}

function startTopicTest(topicId){
  const t=TOPICS.find(x=>x.id===topicId);
  startQuiz({topics:[topicId],numQ:10,timeLimitSec:600,useAI:STATE.online,_label:t?.label});
}

function installApp(){
  if(STATE.installPrompt){
    STATE.installPrompt.prompt();
    STATE.installPrompt.userChoice.then(()=>{STATE.installPrompt=null;STATE.showInstall=false;render();});
  }
}
function dismissInstall(){STATE.showInstall=false;render();}

// ══════════════════════════════════════════════════════
//  PWA & EVENTOS
// ══════════════════════════════════════════════════════
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  STATE.installPrompt=e;
  STATE.showInstall=true;
  render();
});

window.addEventListener('online',()=>{STATE.online=true;render();});
window.addEventListener('offline',()=>{STATE.online=false;render();});

// Exponer funciones al scope global (necesario para onclick en HTML)
Object.assign(window,{
  goHome,goStats,openConfig,closeConfig,toggleReview,clearStats,
  toggleTopic,toggleAI,adjNumQ,adjTime,launchExam,
  startTopicTest,installApp,dismissInstall,
  selectAnswer,prevQ,nextQ,skipQ,finishQuiz,
});

// ── Init ──────────────────────────────────────────────
render();
</script>
