<style>

:root{
  --m:#7B1F5E;--md:#5E1748;
  --b1:#8B1A4A;--b2:#1D4ED8;--b3:#C2410C;--b4:#0D9488;--b5:#4F46E5;--bp:#7C3AED;
  --cream:#F4EFE6;--dark:#1C1C2E;--gold:#C8960A;
  --gray:#6B7280;--gl:#E5E7EB;
  --green:#15803D;--orange:#C2410C;--blue:#1D4ED8;
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--dark);overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column}
.hdr{background:var(--dark);color:#fff;padding:0 1rem;height:56px;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;border-bottom:3px solid var(--m);z-index:50}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-badge{background:var(--m);font-family:'Playfair Display',serif;font-weight:900;font-size:1rem;padding:3px 10px;letter-spacing:1px}
.hdr-sub{font-size:.65rem;font-weight:300;color:#999;letter-spacing:2px;text-transform:uppercase}
.hdr-nav{display:flex;gap:5px;align-items:center}
.hdr-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:#ccc;padding:5px 9px;
  border-radius:4px;cursor:pointer;font-size:.72rem;transition:all .2s;font-family:inherit}
.hdr-btn:hover,.hdr-btn.on{background:var(--m);border-color:var(--m);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:#555}
.dot.on{background:#22C55E;box-shadow:0 0 5px #22C55E}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:6px;
  cursor:pointer;font-family:inherit;font-weight:600;font-size:.9rem;padding:11px 18px;transition:all .2s}
.btn-p{background:var(--m);color:#fff}.btn-p:hover{background:var(--md)}.btn-p:active{transform:scale(.97)}
.btn-s{background:transparent;color:var(--dark);border:2px solid var(--dark)}.btn-s:hover{background:var(--dark);color:#fff}
.btn-g{background:transparent;color:var(--gray);border:1.5px solid var(--gl)}.btn-g:hover{border-color:var(--dark);color:var(--dark)}
.btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.btn-sm{padding:7px 12px;font-size:.78rem}
.inst{background:var(--dark);color:#fff;padding:.65rem 1rem;display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.inst-t{font-size:.8rem;flex:1;line-height:1.4}
.inst-x{background:transparent;border:none;color:#aaa;cursor:pointer;font-size:1rem;padding:2px 6px}
/* ── APP LAYOUT ── */
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* ── HOME ── */
.home{display:flex;flex-direction:column;height:100%;box-sizing:border-box}

.anden-header{text-align:center;padding:2.4rem 1.5rem 1rem;flex-shrink:0}
.anden-title{font-family:'Playfair Display',serif;font-size:3rem;font-weight:900;
  color:#8B1A4A;letter-spacing:-1px;line-height:1;margin-bottom:.4rem}
body.dark .anden-title{color:#D49AC4}
.anden-tagline{font-size:.9rem;color:#6B7280;letter-spacing:.3px}
body.dark .anden-tagline{color:#9CA3AF}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;
  padding:0 1.25rem .9rem;flex-shrink:0}
.kpi{background:#fff;border-radius:10px;padding:.8rem .5rem;
  text-align:center;border:1px solid #E5E7EB}
body.dark .kpi{background:#1C1C2E;border-color:#2D2D45}
.kpi-n{font-family:'Playfair Display',serif;font-size:1.5rem;
  color:#8B1A4A;line-height:1}
body.dark .kpi-n{color:#D49AC4}
.kpi-l{color:#6B7280;font-size:.65rem;margin-top:4px}

.modes-grid{display:grid;grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;gap:.85rem;
  padding:0 1.25rem 1.25rem;flex:1}
.mode-card{border:none;border-radius:16px;cursor:pointer;
  transition:transform .2s,filter .2s;color:#fff;
  padding:1rem;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:.55rem;
  width:100%;height:100%;box-sizing:border-box;
  -webkit-appearance:none;appearance:none}
.mode-card:hover{transform:translateY(-3px);filter:brightness(1.1)}
.mode-card:active{transform:scale(.96)}
.mode-card svg{display:block;width:52px;height:52px;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));flex-shrink:0}
.mode-title{font-weight:700;font-size:.92rem;color:#fff;
  text-align:center;margin:0;line-height:1.2}
.mode-sub{font-size:.66rem;color:rgba(255,255,255,.85);
  text-align:center;margin:0;line-height:1.35}

/* ── BOTTOM NAV ── */
.bottom-nav{display:flex;justify-content:center;align-items:center;
  gap:1rem;padding:.75rem 1.25rem calc(.75rem + env(safe-area-inset-bottom,0px));
  background:#F4EFE6;border-top:1px solid #E5E7EB;flex-shrink:0}
body.dark .bottom-nav{background:#0F0F1A;border-color:#2D2D45}
.bnav-btn{display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;background:#fff;border:1.5px solid #E5E7EB;
  border-radius:14px;cursor:pointer;transition:all .2s;font-family:inherit;
  width:72px;height:72px;box-sizing:border-box;-webkit-appearance:none}
body.dark .bnav-btn{background:#1C1C2E;border-color:#2D2D45}
.bnav-btn:hover,.bnav-btn.on{border-color:#8B1A4A;background:#F9F0FF}
body.dark .bnav-btn:hover,body.dark .bnav-btn.on{background:#2D1F3D}
.bnav-icon{font-size:1.55rem;line-height:1}
.bnav-lbl{font-size:.6rem;color:#6B7280;font-weight:600;white-space:nowrap}
body.dark .bnav-lbl{color:#9CA3AF}
.bnav-btn.on .bnav-lbl{color:#8B1A4A}
body.dark .bnav-btn.on .bnav-lbl{color:#D49AC4}

</style>
</head>

   e:"IRYO y OUIGO España no forman parte del AJC porque operan únicamente dentro de España, sin cumplir el requisito de ser operadoras de tráfico internacional transfronterizo."},
  {q:"¿Para quién está diseñado el Spain Rail Pass?",
   o:["Para cualquier viajero que quiera viajar por España en tren","Para residentes en países europeos que visitan España temporalmente","Para clientes con residencia permanente fuera de España","Para grupos de más de 10 personas que viajan juntas por España"],c:2,
   e:"El Spain Rail Pass está dirigido a clientes con residencia permanente fuera de España, con precio diferenciado para adultos y niños."},
],
B2S1:[
  {q:"¿Cuándo y mediante qué norma se creó RENFE?",
   o:["En 1936 mediante Decreto de Incautación Ferroviaria del Estado","En 1955 mediante el Plan de Modernización del Ferrocarril Español","En 1941 mediante la Ley de Bases de Ordenación Ferroviaria y Transportes","En 1929 mediante el Estatuto Ferroviario durante la Dictadura de Primo de Rivera"],c:2,
   e:"RENFE fue creada en 1941 mediante la Ley de Bases de Ordenación Ferroviaria para nacionalizar y unificar las compañías ferroviarias privadas deterioradas tras la Guerra Civil."},
  {q:"¿Cuál es el objetivo principal del II Plan de Igualdad del Grupo Renfe?",
   o:["Alcanzar la paridad exacta del 50% en todos los puestos directivos","Dar cumplimiento a la legislación y promover la igualdad efectiva entre hombres y mujeres","Eliminar todas las diferencias salariales en un plazo de dos años","Aumentar la contratación femenina en puestos técnicos y operativos"],c:1,
   e:"El II Plan de Igualdad tiene como objetivo dar cumplimiento a la Ley Orgánica 3/2007 y continuar el compromiso del I Plan, garantizando la igualdad real entre mujeres y hombres en el Grupo Renfe."},
  {q:"¿Qué sindicatos participaron en la elaboración del II Plan de Igualdad?",
   o:["UGT y CC.OO. exclusivamente por ser los más representativos","SEMAF, CC.OO. y UGT desde la Mesa Técnica de Igualdad del Convenio","CGT, CNT y USO en representación del personal operativo de trenes","Solo el Comité de Empresa Estatal sin participación sindical externa"],c:1,
   e:"El II Plan de Igualdad se elaboró con la participación de SEMAF, CC.OO. y UGT, que integran la Mesa Técnica de Igualdad y Aspectos Sociolaborales del II Convenio Colectivo del Grupo Renfe."},
  {q:"¿Por qué hay mayor presencia masculina en los tramos de mayor antigüedad de Renfe?",
   o:["Por una política histórica deliberada de contratación preferente de hombres","Porque el trabajo ferroviario era considerado incompatible con la maternidad","Porque la carrera militar, vía de entrada exclusivamente masculina, fue fuente histórica de incorporación","Porque las mujeres accedieron al ferrocarril solo tras la Ley de Igualdad de 2007"],c:2,
   e:"La carrera militar fue históricamente una de las principales vías de entrada en Renfe y, al ser exclusivamente masculina, generó mayor presencia de hombres en los tramos de mayor antigüedad."},
  {q:"¿Qué cláusula contempla el convenio de Renfe ante igualdad de puntuación en selección?",
   o:["Preferencia al candidato con mayor antigüedad en listas de espera","Preferencia al candidato interno frente al candidato externo","Preferencia al género subrepresentado en esa categoría profesional","Elección por sorteo entre los candidatos que hayan empatado"],c:2,
   e:"El convenio recoge preferencia al género subrepresentado cuando hay igualdad de puntuación, dejando de tener efecto al alcanzarse representación equilibrada entre ambos sexos."},
  {q:"¿Qué empresas forman actualmente el Grupo Renfe?",
   o:["Solo la EPE Renfe-Operadora como entidad pública única","Renfe Viajeros, ADIF y las Administraciones de Infraestructuras Regionales","La EPE Renfe-Operadora y sus Sociedades Mercantiles del Estado (Viajeros, Mercancías, Fabricación, Alquiler y Renfe of América)","Renfe Viajeros, Renfe Mercancías y Renfe Internacional como únicas filiales"],c:2,
   e:"El Grupo Renfe está formado por la EPE Renfe-Operadora y sus Sociedades Mercantiles: Renfe Viajeros, Renfe Mercancías, Renfe Fabricación y Mantenimiento, Renfe Alquiler de Material Ferroviario y Renfe of América."},
],
B2S2:[
  {q:"¿Qué debe recoger el registro retributivo obligatorio de una empresa?",
   o:["Solo los salarios brutos anuales de toda la plantilla sin desgloses","Solo las retribuciones variables y complementos de productividad","Los valores medios de salarios y complementos desagregados por sexo y categoría","Solo las retribuciones de los puestos de dirección y mandos intermedios"],c:2,
   e:"El registro retributivo debe recoger los valores medios de salarios, complementos salariales y percepciones extrasalariales de la plantilla, desagregados por sexo y clasificación profesional."},
  {q:"¿Qué mide la brecha salarial de género?",
   o:["La diferencia entre el salario del CEO y el salario mínimo de la empresa","El porcentaje de mujeres que cobran por debajo del salario mediano","La diferencia porcentual entre los salarios medios de hombres y mujeres","La diferencia entre la retribución fija y la retribución variable por sexo"],c:2,
   e:"La brecha salarial es la diferencia porcentual entre los salarios medios de hombres y mujeres. Su identificación y reducción es uno de los objetivos clave del Plan de Igualdad de Renfe."},
  {q:"¿Cuántas empresas del Grupo Renfe realizaron informe de diagnóstico en el II Plan?",
   o:["Solo Renfe Operadora como entidad matriz del Grupo","Únicamente Renfe Viajeros y Renfe Mercancías por su mayor plantilla","EPE Renfe-Operadora, Renfe Viajeros, Renfe Mercancías, Renfe Fabricación y Renfe Alquiler","Todo el Grupo incluyendo Renfe of América y empresas participadas"],c:2,
   e:"El II Plan incluye diagnósticos de: EPE Renfe-Operadora, Renfe Viajeros, Renfe Mercancías, Renfe Fabricación y Mantenimiento, y Renfe Alquiler de Material Ferroviario."},
  {q:"¿Qué aspectos incluye el análisis de igualdad por materia en el diagnóstico?",
   o:["Solo el análisis de la distribución de la plantilla por categoría y sexo","Únicamente los aspectos retributivos y de acceso al empleo externo","Acceso al empleo, clasificación, formación, conciliación, retribución y prevención de riesgos","Solo los aspectos de conciliación laboral y familiar de la plantilla"],c:2,
   e:"El análisis de igualdad por materia examina: acceso al empleo, clasificación profesional, formación, promoción, condiciones de trabajo, retribución, conciliación y prevención de riesgos laborales."},
],
B2S3:[
  {q:"¿Qué objetivo tiene la auditoría retributiva del Plan de Igualdad?",
   o:["Reducir el coste salarial total optimizando la estructura de complementos","Detectar puestos con retribución superior a la media del sector ferroviario","Garantizar igualdad salarial por igual trabajo identificando y corrigiendo brechas","Establecer una retribución variable ligada a objetivos de igualdad"],c:2,
   e:"La auditoría retributiva garantiza el principio de igualdad salarial por igual trabajo o trabajo de igual valor, identificando brechas y proponiendo planes de actuación para corregirlas."},
  {q:"¿Qué determina la valoración de puestos de trabajo?",
   o:["El salario exacto que debe percibir cada trabajador en su categoría","La productividad individual de cada empleado en su puesto concreto","El valor relativo de cada puesto con independencia de quien lo ocupe","El nivel de riesgo laboral asociado a cada puesto de trabajo"],c:2,
   e:"La valoración de puestos determina el valor relativo de cada puesto mediante criterios objetivos (responsabilidad, esfuerzo, conocimientos, condiciones), garantizando igual retribución por trabajo de igual valor."},
],
B2S4:[
  {q:"¿Qué tipos de acoso contempla el Protocolo de Renfe?",
   o:["Solo el acoso sexual en sus modalidades física y verbal","Acoso laboral o mobbing y acoso discriminatorio por origen étnico","Acoso sexual, acoso por razón de sexo y acoso moral (mobbing)","Acoso sexual y ciberacoso en entornos digitales de trabajo"],c:2,
   e:"El Protocolo de Renfe (aprobado el 10 de marzo de 2010) abarca: acoso sexual, acoso por razón de sexo y acoso moral o mobbing."},
  {q:"¿Cuándo fue aprobado el Protocolo de Renfe contra el acoso?",
   o:["15 de enero de 2007, coincidiendo con la Ley Orgánica de Igualdad","22 de octubre de 2012, en la primera revisión del Convenio Colectivo","10 de marzo de 2010, como parte del I Plan de Igualdad de Renfe","8 de marzo de 2019, en el Día Internacional de la Mujer Trabajadora"],c:2,
   e:"El Protocolo fue aprobado por Resolución de 10 de marzo de 2010, como parte integrante del I Plan de Igualdad de Renfe."},
  {q:"¿A qué tienen derecho los trabajadores de Renfe según el protocolo de acoso?",
   o:["A recibir formación anual obligatoria en materia de prevención del acoso","A conocer la identidad del instructor en cualquier procedimiento abierto","A un entorno laboral libre de conductas hostiles o intimidatorias","A que su denuncia sea resuelta en un plazo máximo de 30 días hábiles"],c:2,
   e:"El protocolo establece que todos los trabajadores y trabajadoras tienen derecho a un entorno laboral libre de conductas y comportamientos hostiles o intimidatorios hacia su persona."},
  {q:"¿Qué distingue el acoso sexual del acoso por razón de sexo?",
   o:["El acoso sexual es siempre físico; el acoso por razón de sexo puede ser verbal","El acoso sexual lo ejerce siempre un superior jerárquico; el otro puede ser entre iguales","El acoso sexual tiene componente sexual no deseado; el otro implica trato degradante por el sexo sin componente sexual necesario","El acoso sexual está tipificado penalmente; el acoso por razón de sexo solo en vía laboral"],c:2,
   e:"El acoso sexual implica comportamientos de naturaleza sexual no deseados. El acoso por razón de sexo supone trato degradante vinculado al sexo de la persona, sin que necesariamente tenga componente sexual."},
],
B2S5:[
  {q:"¿Cuáles son los ámbitos de acción del Plan de Igualdad de Renfe?",
   o:["Solo retribución, selección y conciliación como ámbitos prioritarios","Únicamente formación, comunicación y protocolo contra el acoso","Acceso al Grupo, condiciones de trabajo, formación, conciliación, retribución y salud laboral","Solo los ámbitos exigidos por la Ley Orgánica de Igualdad de 2007"],c:2,
   e:"Las áreas de acción incluyen: acceso al Grupo, condiciones de trabajo y carrera profesional, formación, comunicación, lenguaje no sexista, conciliación, retribución y salud laboral."},
  {q:"¿Qué es la Mesa Técnica de Igualdad y Aspectos Sociolaborales (MTIASL)?",
   o:["El departamento de RRHH encargado de aplicar el Plan de Igualdad","La comisión disciplinaria que tramita las denuncias por acoso laboral","El órgano de negociación y seguimiento del Plan, integrado por Renfe y los sindicatos","El comité externo de auditoría que verifica el cumplimiento del Plan"],c:2,
   e:"La MTIASL es el órgano de negociación y seguimiento del Plan de Igualdad, integrado por la representación de la empresa y los sindicatos SEMAF, CC.OO. y UGT."},
  {q:"¿Qué es el Observatorio de Igualdad de Género de Renfe?",
   o:["El sistema de videovigilancia para detectar situaciones de acoso en el trabajo","La plataforma digital de formación en igualdad para toda la plantilla","Un instrumento de seguimiento del Plan que analiza indicadores y propone mejoras","El registro oficial de incidencias y denuncias por discriminación de género"],c:2,
   e:"El Observatorio de Igualdad es un instrumento de gobernanza del Plan que realiza el seguimiento de los indicadores, analiza la evolución y propone medidas correctoras cuando sea necesario."},
],
B3S1:[
  {q:"¿Qué cinco cambios motivan revisar la Cultura de Seguridad según el Libro Blanco?",
   o:["Digitalización, nuevas flotas, privatización, competencia y normativa ISO","Cambios en clima, demografía, energía, materiales y tecnología de trenes","Reparto de responsabilidades, enfoque de seguridad, personas, tecnología de la información y legislación","Incorporación de ETCS, nuevas líneas, personal nuevo, IA y auditorías externas"],c:2,
   e:"El Libro Blanco identifica: cambio en el reparto de responsabilidades, cambio en el enfoque de seguridad (preventivo), relevo generacional, nuevas tecnologías de la información y nueva legislación europea (4.º Paquete Ferroviario)."},
  {q:"¿Qué implica el cambio en el 'reparto de responsabilidades' en seguridad ferroviaria?",
   o:["Que cada maquinista asume ahora toda la responsabilidad de la seguridad","Que ADIF ha asumido todas las responsabilidades de seguridad que antes tenía Renfe","Que la seguridad pasó de una empresa a compartirse entre operadoras, gestores de infraestructura y mantenedores","Que las responsabilidades de seguridad han sido transferidas a la ERA europea"],c:2,
   e:"Antes la seguridad estaba integrada en una sola empresa. Tras la liberalización, se reparte entre múltiples actores: empresas ferroviarias, ADIF, mantenedores y otros agentes del sistema."},
  {q:"¿Qué supone el paso a un 'enfoque de seguridad preventivo' según el Libro Blanco?",
   o:["Aumentar el número de inspecciones técnicas y auditorías de seguridad","Contratar más personal de seguridad privada en estaciones y trenes","Pasar de cumplir la norma reactivamente a gestionar el riesgo de forma anticipativa","Implementar cámaras de videovigilancia en todas las instalaciones ferroviarias"],c:2,
   e:"El enfoque preventivo supone pasar de una seguridad reactiva (cumplir la norma) a una proactiva (gestión del riesgo), identificando y previniendo situaciones peligrosas antes de que se materialicen."},
  {q:"¿Qué exige el Reglamento Delegado (UE) 2018/762 a las empresas ferroviarias?",
   o:["La certificación ISO 9001 de todos sus procesos operativos y de mantenimiento","La implantación completa del ETCS nivel 2 en toda su flota de material rodante","La Cultura de Seguridad y evidencias de su aplicación como requisito obligatorio del SGS","La presentación de un informe anual de accidentes ante la Agencia ERA"],c:2,
   e:"El Reglamento Delegado (UE) 2018/762 exige la Cultura de Seguridad y sus evidencias de aplicación como requisito obligatorio para los Sistemas de Gestión de Seguridad de las empresas ferroviarias."},
],
B3S2:[
  {q:"¿Qué es un Sistema de Gestión de Seguridad (SGS) ferroviario?",
   o:["El sistema informático de gestión de incidencias y averías del material rodante","El conjunto de cámaras y sensores para vigilar la seguridad en la infraestructura","El conjunto organizado de medidas y procedimientos para garantizar operaciones seguras","El departamento de seguridad y los inspectores de circulación de la empresa"],c:2,
   e:"El SGS es el conjunto organizado de medidas, procedimientos y responsabilidades que establece una empresa ferroviaria para garantizar que sus operaciones cumplan los requisitos de seguridad."},
  {q:"Según el Libro Blanco, ¿cuál es la relación entre SGS y Cultura de Seguridad?",
   o:["Son dos sistemas independientes que operan en paralelo sin influirse mutuamente","El SGS es más importante porque es obligatorio por ley; la Cultura es voluntaria","El SGS dice cómo actuar, pero la Cultura de Seguridad determina el comportamiento real","La Cultura de Seguridad sustituye al SGS en organizaciones de alta madurez"],c:2,
   e:"Según el Libro Blanco: el SGS nos dice cómo debemos actuar, pero es la Cultura de Seguridad la que determina nuestro comportamiento final. Ambos impactan en los factores técnicos y organizacionales."},
  {q:"¿Qué determina el éxito de un SGS según el Libro Blanco de Renfe?",
   o:["El presupuesto anual destinado a actividades preventivas de seguridad","El número de auditorías externas e inspecciones realizadas por la ERA","La madurez de la organización para desarrollar una Cultura de Seguridad que lo acompañe","La tecnología de señalización implantada y el porcentaje de flota con ETCS"],c:2,
   e:"El éxito de un SGS depende de la madurez de la organización para desarrollar una Cultura de Seguridad que lo acompañe. Sin cultura real, un SGS no garantiza por sí solo la seguridad operacional."},
  {q:"¿Por qué la Cultura de Seguridad es 'un bien intangible' según el Libro Blanco?",
   o:["Porque no tiene coste económico directo ni aparece en el balance contable","Porque solo puede medirse subjetivamente mediante encuestas de clima laboral","Porque sus efectos sobre la seguridad son en su mayor parte ocultos a simple vista","Porque únicamente la perciben los directivos y mandos intermedios de la organización"],c:2,
   e:"Sus efectos sobre la seguridad operacional son, en su mayor parte, ocultos a simple vista. Esta falta de visibilidad puede llevar a que algunas organizaciones le concedan menos importancia."},
],
B3S3:[
  {q:"¿Qué es la 'Just Culture' o Cultura Justa en el Libro Blanco de Renfe?",
   o:["Una cultura donde ningún empleado puede ser sancionado por ningún motivo","Una cultura donde solo los directivos asumen responsabilidades de seguridad","Una cultura que distingue error involuntario (no sancionable) de conducta negligente (sancionable), fomentando la notificación","Una cultura donde todos los fallos se tratan igual independientemente de la intención"],c:2,
   e:"La Just Culture distingue entre errores humanos involuntarios —no sancionables para no inhibir la notificación— y conductas negligentes o intencionadas, que sí deben tener consecuencias."},
  {q:"¿Cuáles son los cimientos del modelo de Cultura de Seguridad del Grupo Renfe?",
   o:["Las normas técnicas, los procedimientos operativos y los sistemas de señalización","Los presupuestos de seguridad, las auditorías anuales y los indicadores de accidentabilidad","Principios como responsabilidad compartida, Just Culture, comunicación abierta y liderazgo en seguridad","Los certificados de seguridad, las habilitaciones del personal y las homologaciones de material"],c:2,
   e:"Los cimientos del modelo incluyen: responsabilidad compartida, Just Culture, comunicación abierta, aprendizaje de incidentes y liderazgo comprometido con la seguridad en todos los niveles."},
],
B3S4:[
  {q:"¿Cuál es el objetivo del Plan de Transformación de la Cultura de Seguridad?",
   o:["Reducir el número de empleados del departamento de seguridad optimizando costes","Sustituir los sistemas de señalización ASFA por ETCS en toda la red convencional","Realizar los cambios necesarios para lograr el alineamiento con la Cultura de Seguridad deseada","Externalizar los servicios de mantenimiento preventivo a empresas especializadas"],c:2,
   e:"El Plan de Transformación busca realizar los cambios necesarios en la organización para lograr el alineamiento con la Cultura de Seguridad Operacional deseada, implicando a todos los colectivos."},
  {q:"¿Qué colectivos implica el Plan de Transformación de la Cultura de Seguridad?",
   o:["Solo el personal operativo: maquinistas, interventores y personal de a bordo","Solo los mandos intermedios y directivos responsables de operaciones","Todos los colectivos del Grupo Renfe: personal operativo, técnico y directivo","Solo el personal de mantenimiento y los técnicos de señalización"],c:2,
   e:"El Plan implica a todos los colectivos del Grupo Renfe. La Cultura de Seguridad es responsabilidad de toda la organización, desde el personal operativo hasta la alta dirección."},
],
B4S1:[
  {q:"¿Cómo define Renfe la Experiencia de Cliente (CX) en su material formativo?",
   o:["El nivel de satisfacción medido en encuestas tras el uso del servicio","La calidad percibida del servicio en comparación con la competencia","Todo lo que una persona vive con una empresa en todas sus interacciones a través de todos los canales","El conjunto de servicios adicionales que acompañan al transporte básico"],c:2,
   e:"Según el material de Renfe, la CX es todo lo que una persona vive con una empresa, en todas sus interacciones, durante toda su relación y a través de todos los canales."},
  {q:"¿Cuál es la diferencia clave entre Experiencia de Cliente y Atención al Cliente?",
   o:["La Atención al Cliente es más costosa e importante estratégicamente que la CX","La CX es solo responsabilidad del departamento de Marketing y Comunicación","La Atención al Cliente actúa en momentos puntuales; la CX abarca toda la relación y es responsabilidad de toda la organización","La CX se mide solo con el NPS; la Atención al Cliente con tiempo de resolución"],c:2,
   e:"La Atención al Cliente actúa en momentos puntuales desde un área concreta. La CX es responsabilidad de toda la organización y está presente desde el diseño del producto hasta el servicio postventa."},
  {q:"¿En qué 'era' estamos según la evolución histórica de la gestión de clientes?",
   o:["Era del producto, donde la diferenciación es la calidad técnica del servicio","Era del marketing, donde la comunicación y la marca son el factor clave","Era del cliente, donde las necesidades individuales guían todas las decisiones","Era de las experiencias, donde la diferenciación clave es la experiencia completa vivida"],c:3,
   e:"Según el material de Renfe, tras las eras de la producción, el producto, el marketing y el cliente, hoy estamos en la era de las experiencias, donde la diferenciación es la experiencia completa."},
  {q:"¿Por qué es estratégicamente importante la CX para el Grupo Renfe?",
   o:["Principalmente por la obligación legal de medir la satisfacción del cliente","Porque mejora la imagen en redes sociales y atrae a nuevos segmentos de viajeros","Porque es un pilar estratégico con impacto directo en retención, fidelización y resultados","Porque reduce los costes de gestión de reclamaciones y atención postventa"],c:2,
   e:"El foco en el Cliente es un pilar del Plan Estratégico del Grupo Renfe. Una buena CX genera retención, fidelización, recomendación y tiene impacto directo en los resultados del negocio."},
],
B4S2:[
  {q:"¿Cuáles son los elementos clave de la CX según el material de Renfe?",
   o:["Solo la puntualidad, el precio y la limpieza del material rodante","Únicamente los aspectos emocionales como satisfacción y conexión con la marca","Aspectos emocionales (satisfacción, confianza) y prácticos (calidad, eficiencia, facilidad de uso)","Solo los aspectos medibles mediante indicadores cuantitativos de rendimiento"],c:2,
   e:"Los elementos clave de la CX incluyen aspectos emocionales (satisfacción, confianza, conexión emocional) y prácticos (calidad del servicio, eficiencia, facilidad de uso), presentes en todas las interacciones."},
  {q:"¿Qué describe el ciclo de vida del cliente en CX?",
   o:["La duración media del contrato de abono de un cliente frecuente","El número de viajes que realiza un cliente en un año natural","Las etapas de la relación: atracción, adquisición, uso, fidelización y recomendación","El período desde la primera compra hasta la primera reclamación del cliente"],c:2,
   e:"El ciclo de vida del cliente describe las etapas: atracción, adquisición, primer uso, uso recurrente, fidelización y recomendación. Gestionarlo bien maximiza el valor del cliente a largo plazo."},
  {q:"¿Cuál de los siguientes es un factor que influye en la CX según Renfe?",
   o:["La modernidad y tecnología del material rodante exclusivamente","Solo la velocidad y puntualidad de los servicios ferroviarios","La empatía, personalización y comunicación efectiva entre otros factores","Únicamente el precio del billete y la disponibilidad de plazas"],c:2,
   e:"Los factores que influyen en la CX incluyen empatía, personalización, comunicación efectiva, accesibilidad y capacidad de resolver problemas, además de la calidad y consistencia del servicio."},
],
B4S3:[
  {q:"¿Qué representa el Customer Journey Map (Pasillo del Cliente)?",
   o:["El recorrido físico del viajero dentro de la estación hasta el andén","El mapa geográfico de la red de líneas y servicios de Renfe Viajeros","Una herramienta visual de todos los touchpoints del cliente identificando emociones y fricción","El diagrama de flujo del proceso de compra de billetes en la web de Renfe"],c:2,
   e:"El Customer Journey Map visualiza todas las interacciones del cliente con la empresa, identificando sus emociones y necesidades en cada momento, así como los puntos de dolor a mejorar."},
  {q:"¿Qué son los 'arquetipos' como herramienta de Experiencia de Cliente?",
   o:["Los prototipos de nuevos materiales rodantes antes de su homologación","Los modelos de formación estandarizados para el personal de atención al cliente","Representaciones de segmentos de clientes basadas en datos reales para diseñar mejores experiencias","Los estándares de calidad del servicio definidos en el contrato de gestión de Renfe"],c:2,
   e:"Los arquetipos son representaciones de segmentos de clientes basadas en datos reales sobre comportamientos y motivaciones, ayudando a diseñar experiencias centradas en sus necesidades reales."},
  {q:"¿Qué son los KPIs de Experiencia de Cliente?",
   o:["Los kilómetros recorridos por unidad de flota en servicio comercial","Los tiempos de intervención ante incidencias técnicas en la infraestructura","Indicadores clave que miden el grado de cumplimiento de los objetivos de CX","Los porcentajes de ocupación y puntualidad de los servicios ferroviarios"],c:2,
   e:"Los KPIs de CX miden la experiencia del cliente. Los más relevantes: NPS (Net Promoter Score), CSAT (Customer Satisfaction Score) y CES (Customer Effort Score), entre otros."},
  {q:"¿Qué representa el Blueprint o Mapa de Procesos en CX?",
   o:["El plano arquitectónico de las nuevas estaciones de alta velocidad","El manual de procedimientos de atención al cliente en ventanilla","Una herramienta que muestra la experiencia visible del cliente y los procesos internos que la sostienen","El diagrama de los sistemas informáticos de venta y gestión de reservas"],c:2,
   e:"El Blueprint representa en un mismo documento la experiencia del cliente (lo que ve) y los procesos internos de la empresa (lo que no ve) que la sostienen, ayudando a identificar fallos de proceso."},
],
B4S4:[
  {q:"¿Qué significa una 'cultura orientada al cliente' en una organización?",
   o:["Que el departamento de atención al cliente tiene el mayor presupuesto de la empresa","Que todos los procesos están certificados con la norma ISO de calidad en el servicio","Que el cliente está en el centro de todas las decisiones y todos los empleados contribuyen a su experiencia","Que la empresa realiza encuestas de satisfacción después de cada interacción con el cliente"],c:2,
   e:"Una cultura orientada al cliente significa que el cliente está en el centro de todas las decisiones, con todos los empleados (no solo los de atención directa) contribuyendo activamente."},
  {q:"¿Qué habilidades son clave para la Experiencia de Cliente en Renfe?",
   o:["Conocimientos técnicos del sistema ferroviario y la normativa de circulación","Dominio de los sistemas informáticos de venta y gestión de incidencias","Empatía, escucha activa, comunicación efectiva, resolución de problemas y orientación al cliente","Idiomas extranjeros y conocimiento de tarifas internacionales y pases ferroviarios"],c:2,
   e:"Las competencias clave para la CX incluyen habilidades relacionales (empatía, escucha activa, comunicación), de gestión (resolución de problemas) y de actitud (orientación al cliente, proactividad)."},
],
B4S5:[
  {q:"¿Qué mide el NPS (Net Promoter Score)?",
   o:["La velocidad media de resolución de reclamaciones por canal de atención","El porcentaje de clientes que repiten viaje en los siguientes 30 días","La propensión a recomendar el servicio: % Promotores (9-10) menos % Detractores (0-6)","El nivel de satisfacción con la limpieza y confort de los trenes"],c:2,
   e:"El NPS mide la lealtad del cliente preguntando la probabilidad de recomendar el servicio (0-10). Promotores=9-10, Pasivos=7-8, Detractores=0-6. NPS = % Promotores - % Detractores."},
  {q:"¿Cómo impacta la IA en la Experiencia de Cliente Digital?",
   o:["Solo en la venta automatizada de billetes y la gestión de cancelaciones masivas","Únicamente en la detección de fraude en compras online y en la seguridad de pagos","Permite personalizar experiencias, anticipar necesidades, automatizar respuestas y ofrecer CX omnicanal coherente","Solo mejora la velocidad de respuesta en el chat de atención al cliente online"],c:2,
   e:"La IA permite personalizar experiencias a escala, anticiparse a necesidades, automatizar procesos (chatbots, recomendadores) y garantizar experiencia omnicanal coherente en todos los canales."},
  {q:"¿Qué es el proceso de recuperación del servicio en CX?",
   o:["El protocolo técnico para restablecer el servicio tras una avería o incidencia","El procedimiento de reembolso automático cuando el retraso supera 60 minutos","Las acciones para corregir un fallo en el servicio y reconquistar la confianza del cliente afectado","El plan de contingencia para desviar viajeros a servicios alternativos de transporte"],c:2,
   e:"La recuperación del servicio son las acciones que la empresa pone en marcha para corregir un fallo, disculparse adecuadamente y ofrecer soluciones. Una buena recuperación puede fidelizar más que si el fallo no hubiera ocurrido."},
],
B5S1:[
  {q:"¿Cuál es el fundamento técnico que explica la ventaja del ferrocarril?",
   o:["La capacidad de alcanzar velocidades superiores a los 300 km/h en alta velocidad","La posibilidad de transportar mercancías peligrosas con mayor seguridad","La rodadura metal sobre metal tiene resistencia al avance muy inferior a la de caucho sobre asfalto","La menor emisión de CO2 por kilómetro frente a los modos de transporte carreteros"],c:2,
   e:"El fundamento técnico del ferrocarril es que la rodadura de acero sobre acero tiene una resistencia al avance muy inferior a caucho sobre asfalto, permitiendo mover grandes cargas con menor energía."},
  {q:"¿Cuál fue el primer ferrocarril inaugurado en la Península Ibérica?",
   o:["Barcelona-Mataró en 1848, primera línea en territorio peninsular","Valencia-Játiva en 1852, promovida por el capital inglés","Madrid-Toledo en 1858, primera línea de la meseta central","Sevilla-Jerez en 1860, primera línea de Andalucía occidental"],c:0,
   e:"El primer ferrocarril peninsular fue el de Madrid-Aranjuez (1851). En el conjunto del Estado español, el primero fue Barcelona-Mataró (1848). En Cuba (entonces española) se inauguró el primero en 1837."},
  {q:"¿Cuándo y cómo se creó RENFE?",
   o:["En 1929 mediante el Estatuto Ferroviario durante la Dictadura de Primo de Rivera","En 1936 por Decreto de Incautación durante el inicio de la Guerra Civil","En 1941 mediante la Ley de Bases de Ordenación Ferroviaria, nationalizando las compañías privadas","En 1953 mediante un convenio entre el Estado y las principales compañías ferroviarias"],c:2,
   e:"RENFE fue creada en 1941 mediante la Ley de Bases de Ordenación Ferroviaria y de los Transportes por Carretera, nationalizando las compañías privadas muy deterioradas tras la Guerra Civil."},
  {q:"¿En qué año entró en servicio el primer AVE en España y entre qué ciudades?",
   o:["1988 entre Madrid y Ciudad Real, como tramo inicial de pruebas","1992 entre Madrid y Sevilla, coincidiendo con la Expo Universal","1995 entre Madrid y Zaragoza, al inaugurarse el primer tramo aragonés","2000 entre Madrid y Lleida, primer tramo hacia Barcelona"],c:1,
   e:"El primer AVE en España entró en servicio el 14 de abril de 1992, uniendo Madrid con Sevilla coincidiendo con la Expo. Adoptó el ancho UIC de 1.435 mm y electrificación a 25 kV/50 Hz."},
  {q:"¿En qué Consejo de Ministros se adoptó el ancho UIC para la alta velocidad española?",
   o:["En el Consejo de Ministros del 15 de junio de 1985","En el Consejo de Ministros del 9 de diciembre de 1988","En el Consejo de Ministros del 23 de febrero de 1991","En el Consejo de Ministros del 7 de abril de 1992"],c:1,
   e:"La decisión de adoptar el ancho UIC de 1.435 mm para la red de alta velocidad española fue tomada en el Consejo de Ministros del 9 de diciembre de 1988."},
],
B5S2:[
  {q:"¿Qué son los Paquetes Ferroviarios de la Unión Europea?",
   o:["Los contratos marco de suministro de material rodante entre operadoras europeas","Los acuerdos bilaterales de interoperabilidad entre países fronterizos","Conjuntos de directivas y reglamentos que liberalizaron el sector separando infraestructura de operación","Los planes de inversión plurianuales en infraestructura ferroviaria de la UE"],c:2,
   e:"Los Paquetes Ferroviarios son conjuntos de legislación europea que han liberalizado progresivamente el sector, separando gestión de infraestructuras de operación y avanzando hacia el Espacio Ferroviario Europeo Único."},
  {q:"¿Qué son las ETI (Especificaciones Técnicas de Interoperabilidad)?",
   o:["Los contratos de mantenimiento estándar entre operadoras y talleres europeos","Los certificados de aptitud profesional del personal ferroviario en la UE","Normas técnicas europeas que definen requisitos de subsistemas ferroviarios para garantizar la interoperabilidad","Los estándares de confort y accesibilidad obligatorios en el material rodante europeo"],c:2,
   e:"Las ETI son especificaciones técnicas europeas que definen los requisitos de los subsistemas ferroviarios para garantizar que los trenes puedan circular por las redes de diferentes países miembros."},
  {q:"¿Qué es la ERA (Agencia Ferroviaria de la UE)?",
   o:["La empresa de trenes de alta velocidad que opera servicios transfronterizos en Europa","El organismo de la UE que fija los precios máximos de los billetes ferroviarios internacionales","La Agencia que promueve el Espacio Ferroviario Europeo Único y establece normas de seguridad e interoperabilidad","El tribunal europeo que resuelve disputas entre operadoras y gestores de infraestructura"],c:2,
   e:"ERA (European Union Agency for Railways) promueve el Espacio Ferroviario Europeo Único, elabora normas técnicas de seguridad e interoperabilidad y emite autorizaciones de vehículos desde 2019."},
  {q:"¿Qué Ley separó la gestión de infraestructuras de la operación ferroviaria en España?",
   o:["La Ley 16/1987 de Ordenación de los Transportes Terrestres (LOTT)","La Ley 39/2003 del Sector Ferroviario que creó ADIF y Renfe Operadora","El Real Decreto 2387/2004 por el que se aprobó el Reglamento del Sector Ferroviario","La Ley 38/2015 del Sector Ferroviario que actualizó el marco regulatorio"],c:1,
   e:"La Ley 39/2003 del Sector Ferroviario separó la gestión de infraestructuras (ADIF) de la operación de servicios (RENFE Operadora), liberalizando progresivamente el mercado ferroviario español."},
  {q:"¿Qué es la CIAF?",
   o:["El Centro de Intervención y Asistencia Ferroviaria de ADIF en operaciones","La Comisión de Investigación de Accidentes Ferroviarios, organismo independiente para mejorar la seguridad","La Comisión Interministerial de Acceso Ferroviario para nuevas operadoras","El Centro Integrado de Atención Ferroviaria al viajero de Renfe"],c:1,
   e:"La CIAF (Comisión de Investigación de Accidentes Ferroviarios) investiga accidentes e incidentes graves en el ferrocarril español con el único objetivo de mejorar la seguridad, sin determinar culpabilidades."},
],
B5S3:[
  {q:"¿Qué es la RFIG?",
   o:["La Red Ferroviaria Internacional de Gran velocidad entre España y Francia","La Red Ferroviaria de Interés General cuya titularidad corresponde al Estado y administra ADIF","El Reglamento Ferroviario Interno del Grupo Renfe para la explotación de servicios","La Red de Ferrocarriles de Interés Geográfico de las Comunidades Autónomas"],c:1,
   e:"La RFIG (Red Ferroviaria de Interés General) es el conjunto de líneas cuya titularidad corresponde al Estado español, siendo ADIF el organismo encargado de su administración y gestión."},
  {q:"¿Cuántos km aproximados tiene la RFIG en España?",
   o:["En torno a 5.000 km concentrados principalmente en la red de alta velocidad","Aproximadamente 8.500 km de red convencional de ancho ibérico exclusivamente","Más de 15.000 km incluyendo alta velocidad y red convencional en ambos anchos","Aproximadamente 25.000 km siendo la red más extensa de Europa occidental"],c:2,
   e:"La RFIG supera los 15.000 km, incluyendo la red de alta velocidad (en torno a 3.800 km, segunda más extensa del mundo) y la red convencional de ancho ibérico y métrico."},
  {q:"¿Qué recoge el Catálogo de Líneas de la RFIG?",
   o:["Los horarios oficiales de todos los servicios que circulan por cada línea","La relación de empresas autorizadas a operar servicios en cada tramo de la red","Todas las líneas de la RFIG con sus características técnicas: longitud, ancho, electrificación y velocidad máxima","Los planes de inversión y mejora previstos para cada línea en el próximo decenio"],c:2,
   e:"El Catálogo de Líneas relaciona y clasifica todas las líneas de la RFIG con sus características técnicas: longitud, ancho de vía, electrificación, velocidad máxima y tipo de tráfico."},
],
B5S4:[
  {q:"¿Cuál es el ancho de vía de la red convencional española (ancho ibérico)?",
   o:["1.000 mm, también llamado ancho métrico o estrecho","1.435 mm, el estándar UIC utilizado en la mayoría de países europeos","1.668 mm, mayor que el UIC europeo, propio de la red convencional española","1.520 mm, ancho utilizado en los países de la antigua Unión Soviética"],c:2,
   e:"El ancho ibérico es de 1.668 mm y es el utilizado en la red ferroviaria convencional española. Es mayor que el UIC europeo (1.435 mm), que se usa en la red de alta velocidad española."},
  {q:"¿Qué función cumple el balasto en la superestructura ferroviaria?",
   o:["Proporciona la señal de control al sistema ASFA mediante elementos magnéticos","Actúa como conductor eléctrico entre el carril y el sistema de retorno de corriente","Sirve de asiento a las traviesas distribuyendo cargas, facilitando drenaje y manteniendo geometría","Protege la infraestructura ferroviaria frente a los efectos de las heladas invernales"],c:2,
   e:"El balasto es el lecho de grava que forma la capa de asiento de las traviesas. Distribuye cargas, facilita el drenaje, absorbe vibraciones y mantiene la geometría de la vía."},
  {q:"¿Qué distingue a la 'vía en placa' de la vía con balasto?",
   o:["La vía en placa usa carril de mayor sección y más resistente al desgaste","La vía en placa incorpora traviesas de madera en lugar de hormigón pretensado","La vía en placa prescinde del balasto, fijando el carril sobre una losa de hormigón","La vía en placa utiliza un ancho de vía ligeramente diferente al estándar UIC"],c:2,
   e:"La vía en placa prescinde del balasto, fijando el carril sobre una losa de hormigón o asfalto. Se usa en túneles, viaductos y tramos de alta velocidad por mayor durabilidad y menor mantenimiento."},
  {q:"¿Qué tensión usa la catenaria de la red de alta velocidad española?",
   o:["1.500 V en corriente continua, igual que la red convencional francesa","3.000 V en corriente continua, igual que la red convencional española","25.000 V en corriente alterna monofásica a 50 Hz, estándar UIC europeo","15.000 V en corriente alterna a 16,7 Hz, estándar de la red alemana y austriaca"],c:2,
   e:"La red de alta velocidad española usa 25.000 V en corriente alterna monofásica a 50 Hz (estándar UIC europeo). La red convencional de Renfe usa 3.000 V en corriente continua."},
  {q:"¿Qué compone un desvío en la infraestructura ferroviaria?",
   o:["Una señal luminosa, un detector de paso y un sistema de enclavamiento automático","Una baliza ASFA, un contador de ejes y un circuito de vía de corriente alterna","Agujas que guían el tren, cruzamiento donde se cruzan los carriles y contracarriles","Un motor de agujas, un transformador de potencia y un sistema de calefacción antihielo"],c:2,
   e:"Un desvío se compone de agujas (guían al tren hacia una u otra dirección), cruzamiento (donde se cruzan los carriles) y contracarriles (guían la pestaña de la rueda en el cruzamiento)."},
],
B5S5:[
  {q:"¿Qué define al 'material motor' en terminología ferroviaria?",
   o:["Todo el material que requiere homologación técnica antes de su puesta en servicio","Los vehículos que transportan exclusivamente carga y mercancías en la red ferroviaria","Los vehículos ferroviarios con sistema de tracción propio (locomotoras, automotores, unidades con motores distribuidos)","Los vehículos de mantenimiento e inspección de la infraestructura ferroviaria"],c:2,
   e:"El material motor son los vehículos ferroviarios con tracción propia: locomotoras, automotores y unidades con motores distribuidos como el AVE S-100 o el S-102."},
  {q:"¿Qué caracteriza al 'material remolcado'?",
   o:["Que incorpora motores auxiliares para maniobras en estaciones y talleres","Que solo puede circular por líneas de ancho ibérico de la red convencional","Que carece de tracción propia y debe ser arrastrado por material motor","Que está diseñado exclusivamente para el transporte de mercancías especiales"],c:2,
   e:"El material remolcado carece de sistema de tracción y debe ser arrastrado por material motor. Incluye coches de viajeros, furgones, vagones de mercancías y plataformas de transporte combinado."},
  {q:"¿Qué tipos de material motor existen según la fuente de energía?",
   o:["Solo eléctrico de catenaria y diésel de combustión interna como únicos tipos","Eléctrico, diésel de vapor y nuclear, según la fuente de energía primaria utilizada","Eléctrico (catenaria), diésel (combustión interna) y dual o bimodal (puede usar ambas fuentes)","Solo eléctrico en España al estar toda la red de Renfe Viajeros electrificada"],c:2,
   e:"Existen tres tipos: eléctrico (alimentado por catenaria), diésel (combustión interna para líneas sin electrificar) y dual o bimodal (puede funcionar con catenaria o motor diésel)."},
],
B5S6:[
  {q:"¿Qué hace el sistema ASFA en la red convencional española?",
   o:["Gestiona la venta y validación automática de billetes en los trenes regionales","Controla la apertura y cierre de puertas en las estaciones de Cercanías","Transmite indicaciones de señales al tren y activa el freno de emergencia si el maquinista no las reconoce","Regula automáticamente la velocidad en las curvas según el radio de curvatura"],c:2,
   e:"ASFA (Anuncio de Señales y Frenado Automático) transmite mediante balizas las indicaciones de las señales al tren y activa el freno de emergencia si el maquinista no reconoce una señal restrictiva."},
  {q:"¿A qué sistema más amplio pertenece el ETCS?",
   o:["Al sistema ASFA digital de nueva generación para la red convencional española","Al sistema LZB de control continuo de origen alemán implantado en líneas de alta velocidad","Al ERTMS (European Rail Traffic Management System) como componente de control de trenes","Al sistema GSM-R de comunicaciones ferroviarias digitales de banda UHF"],c:2,
   e:"El ETCS (European Train Control System) es el componente de control de trenes del ERTMS. Supervisa continuamente la velocidad y aplica el freno si se supera la velocidad permitida."},
  {q:"¿Cuáles son los niveles de aplicación del ETCS?",
   o:["Solo existe el Nivel 2 como único nivel plenamente operativo en toda Europa","Nivel básico (balizas), Nivel avanzado (radio) y Nivel completo (satélite)","Nivel 1 (eurobalizas con señales), Nivel 2 (GSM-R sin señales laterales) y Nivel 3 (con control de integridad)","Nivel A (alta velocidad), Nivel B (media distancia) y Nivel C (Cercanías y regional)"],c:2,
   e:"ETCS tiene tres niveles: Nivel 1 (información puntual por eurobalizas, compatible con señales laterales), Nivel 2 (comunicación continua via GSM-R, sin señales laterales) y Nivel 3 (añade control de integridad del tren)."},
  {q:"¿Qué garantiza el sistema de enclavamiento en señalización ferroviaria?",
   o:["Que los trenes reducen velocidad automáticamente al aproximarse a las estaciones","Que las puertas de los trenes no se abren mientras el vehículo está en movimiento","Que no pueden darse simultáneamente condiciones de circulación incompatibles o peligrosas","Que los sistemas de climatización funcionan correctamente en túneles y zonas confinadas"],c:2,
   e:"El enclavamiento garantiza que no puedan darse simultáneamente condiciones peligrosas, como dar vía libre a dos trenes en ruta de colisión, o que las agujas cambien con un tren encima."},
  {q:"¿Qué garantiza el principio de circulación por cantones?",
   o:["Que los trenes mantengan siempre la velocidad máxima autorizada en cada tramo","Que el sistema de señalización funcione aunque falle la alimentación principal","Que solo un tren puede ocupar cada cantón a la vez, previniendo colisiones traseras","Que los trenes de alta velocidad no compartan infraestructura con los trenes regionales"],c:2,
   e:"Las señales de cantón dividen la vía en tramos y garantizan que solo un tren puede ocupar un cantón al mismo tiempo, lo que constituye la base de la seguridad en la circulación ferroviaria."},
],
B5S7:[
  {q:"¿Cuál es el principio fundamental de circulación ferroviaria?",
   o:["El principio de velocidad máxima ajustada al perfil de la línea en cada tramo","El principio de intervalo de tiempo mínimo garantizado entre trenes consecutivos","El principio de un solo tren por cantón: en cada sección delimitada solo puede circular un tren a la vez","El principio de señalización redundante con doble sistema de control independiente"],c:2,
   e:"El principio fundamental es que en cada cantón solo puede circular un tren a la vez. Este principio, implementado por el sistema de bloqueo, es la base de toda la seguridad en la circulación ferroviaria."},
  {q:"¿Qué representa el gráfico de marchas (o malla horaria) en planificación ferroviaria?",
   o:["El organigrama del personal de conducción asignado a cada línea","El mapa de las líneas y conexiones de la Red Ferroviaria de Interés General","La representación gráfica en tiempo-distancia de la circulación de trenes que permite planificar la línea","El calendario anual de mantenimiento preventivo de la infraestructura ferroviaria"],c:2,
   e:"El gráfico de marchas es una representación gráfica con tiempo en el eje horizontal y distancia (estaciones) en el vertical. Permite planificar la circulación, identificar cruces y optimizar el uso de la infraestructura."},
  {q:"¿Qué es una maniobra en explotación ferroviaria?",
   o:["La actuación de emergencia cuando un tren se detiene fuera de estación","El procedimiento de cambio de maquinista al llegar a una estación de relevo","El movimiento de vehículos en zona de maniobras que no constituye circulación de tren","La operación de inversión del sentido de marcha en cabos de línea o estaciones terminales"],c:2,
   e:"Las maniobras son movimientos de vehículos ferroviarios en estaciones o zonas habilitadas que no constituyen circulación de tren. Se realizan a baja velocidad bajo la autoridad del jefe de maniobras."},
  {q:"¿Cuáles son los tipos de personal operativo ferroviario?",
   o:["Solo maquinistas y personal de mantenimiento de material rodante","Personal administrativo y personal de atención al cliente en estaciones","Personal de circulación (jefes de circulación, operadores CTC) y personal en los trenes (maquinistas, interventores, personal de a bordo)","Solo el personal con habilitaciones de seguridad reconocidas por la CIAF"],c:2,
   e:"El personal operativo incluye: personal de circulación (jefes de circulación, operadores de CTC) y personal en servicio en los trenes (maquinistas, interventores, personal de atención a bordo)."},
],

PS2:[
  {q:"Sinónimo de DILIGENTE:",o:["Perezoso y descuidado","Laborioso y aplicado","Lento y torpe","Vago e indolente"],c:1,e:"Diligente = rápido, cuidadoso y eficaz. Sinónimo: laborioso, aplicado, trabajador."},
  {q:"Antónimo de FRUGAL:",o:["Austero y moderado","Sobrio y comedido","Derrochador y pródigo","Sencillo y humilde"],c:2,e:"Frugal = sobrio, moderado en gastos y consumo. Antónimo: derrochador, pródigo."},
  {q:"LIBRO es a BIBLIOTECA como CUADRO es a:",o:["Pintura al óleo","Museo de arte","Marco de madera","Artista plástico"],c:1,e:"Objeto → lugar donde se expone o conserva: libro en biblioteca, cuadro en museo."},
  {q:"Sinónimo de EFÍMERO:",o:["Eterno e imperecedero","Transitorio y pasajero","Permanente y duradero","Sólido e inmutable"],c:1,e:"Efímero = de muy corta duración. Sinónimo: transitorio, pasajero, fugaz."},

function loadStats(){try{const s=localStorage.getItem('rnf_v5');return s?JSON.parse(s):{exams:[]}}catch{return{exams:[]}}}
function saveStats(){try{localStorage.setItem('rnf_v5',JSON.stringify(S.stats))}catch{}}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
function fmt(s){return`${0|s/60}:${String(s%60).padStart(2,'0')}`}
function getC(q){return q.c!==undefined?q.c:q.correct}
function getO(q){return q.o||q.opts||q.options||[]}
async function genAI(sid,label,n){
  const p=`Eres experto en oposiciones Renfe Operador Comercial de Entrada N2 (Oferta de Empleo Grupo Renfe 2026).\nGenera ${n} preguntas tipo test rigurosas sobre: "${label}".\nBasadas estrictamente en el temario oficial del Grupo Renfe 2026. 4 opciones, 1 correcta, opciones plausibles, explicación detallada.\nRespende SOLO JSON sin markdown:\n{"questions":[{"question":"...","options":["A","B","C","D"],"correct":0,"explanation":"..."}]}`;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content:p}]})});
  const d=await r.json();
  const t=d.content?.map(i=>i.text||"").join("")||"";
  const parsed=JSON.parse(t.replace(/```json|```/g,"").trim());
  return(parsed.questions||[]).map(q=>({q:q.question,o:q.options,c:q.correct,e:q.explanation,src:'ia'}));
}
async function startQuiz(cfg){
  S.cfg=cfg;S.view='loading';S.ans={};S.rev={};S.cur=0;render();
  let qs=[];
  if(S.online&&cfg.useAI){
    try{
      const pp=Math.max(3,Math.ceil(cfg.n/cfg.subs.length));
      const all=await Promise.all(cfg.subs.map(sid=>{
        const sub=[...BLOQUES.flatMap(b=>b.subs),...PSICO_SUBS].find(s=>s.id===sid);
        return genAI(sid,sub?.name||sid,pp);
      }));
      qs=shuffle(all.flat()).slice(0,cfg.n).map((q,i)=>({...q,id:i}));
    }catch(e){console.warn('AI fail',e)}
  }
  if(qs.length<cfg.n){
    let pool=[];cfg.subs.forEach(sid=>(QB[sid]||[]).forEach(q=>pool.push({...q,src:'offline',sid})));
    const need=cfg.n-qs.length;
    qs=[...qs,...shuffle(pool).slice(0,need).map((q,i)=>({...q,id:qs.length+i}))];
  }
  S.qs=qs;S.tLeft=cfg.tSec;S.view='quiz';
  clearInterval(S.tInt);
  S.tInt=setInterval(()=>{if(--S.tLeft<=0){clearInterval(S.tInt);finishQuiz();}else updT();},1000);
  render();
}
function updT(){
  const el=document.getElementById('tmr');if(!el)return;
  el.textContent='⏱ '+fmt(S.tLeft);
  el.className='timer'+(S.tLeft<60?' danger':S.tLeft<180?' warn':'');
}
function selAns(qi,opt){if(S.ans[qi]!==undefined)return;S.ans[qi]=opt;S.rev[qi]=true;renderQ();}
function finishQuiz(){
  clearInterval(S.tInt);
  const q=S.qs;
  const correct=q.filter((_,i)=>S.ans[i]===getC(q[i])).length;
  const wrong=q.filter((_,i)=>S.ans[i]!==undefined&&S.ans[i]!==-1&&S.ans[i]!==getC(q[i])).length;
  const skipped=q.length-correct-wrong;
  const pct=Math.round(correct/q.length*100);
  S.result={questions:q,answers:{...S.ans},correct,wrong,skipped,total:q.length,pct,timeTaken:S.cfg.tSec-S.tLeft};
  S.stats.exams.push({date:Date.now(),correct,total:q.length,pct,label:S.cfg.label||''});
  saveStats();
  saveFailedQuestions(S.result);S.showRev=false;S.view='results';render();
}

// Save failed/skipped questions after each exam
function saveFailedQuestions(result){
  let failed=[];
  try{const s=localStorage.getItem('rnf_failed');if(s)failed=JSON.parse(s);}catch{}
  const newFailed=result.questions.filter((_,i)=>{
    const ua=result.answers[i];
    const c=result.questions[i].c!==undefined?result.questions[i].c:result.questions[i].correct;
    return ua===undefined||ua===-1||ua!==c;
  });
  // Merge avoiding duplicates (by question text)
  const existingQs=new Set(failed.map(q=>q.q||q.question));
  const toAdd=newFailed.filter(q=>!existingQs.has(q.q||q.question));
  // Remove questions that were answered correctly this time
  const correctQs=new Set(result.questions.filter((_,i)=>{
    const ua=result.answers[i];
    const c=result.questions[i].c!==undefined?result.questions[i].c:result.questions[i].correct;
    return ua===c;
  }).map(q=>q.q||q.question));
  const merged=[...failed.filter(q=>!correctQs.has(q.q||q.question)),...toAdd];
  // Keep max 200
  try{localStorage.setItem('rnf_failed',JSON.stringify(merged.slice(0,200)));}catch{}
}

      <button class="btn btn-g btn-sm" onclick="goHome()">← Volver</button>
      <div class="sec-hd" style="margin:0">📖 Practicar por bloque</div>
    </div>
    <div style="font-size:.82rem;color:var(--gray);margin-bottom:1rem">Selecciona un bloque para hacer un test con todas sus preguntas:</div>
    ${cards}${pCard}
  </div>`;
}

function startBloqueTest(bloqueId){
  let subs, label, color;
  if(bloqueId==='PSICO'){
    subs=PSICO_SUBS.map(s=>s.id);
    label='Psicotécnicos';color='var(--bp)';
  } else {
    const b=BLOQUES.find(b=>b.id===bloqueId);
    if(!b)return;
    subs=b.subs.map(s=>s.id);
    label=`Bloque ${b.num}: ${b.title}`;color=b.color;
  }
  let pool=[];
  subs.forEach(sid=>(QB[sid]||[]).forEach(q=>pool.push({...q,src:'offline',sid})));
  pool=shuffle(pool).map((q,i)=>({...q,id:i}));
  const n=pool.length;
  S.cfg={subs,n,tSec:n*60,useAI:S.online,label,blkLabel:'📖 Por bloque',subLabel:label};
  S.qs=pool;S.ans={};S.rev={};S.cur=0;S.tLeft=n*60;S.view='quiz';
  clearInterval(S.tInt);
  S.tInt=setInterval(()=>{if(--S.tLeft<=0){clearInterval(S.tInt);finishQuiz();}else updT();},1000);
  render();
}

// ── SIMULACRO REAL ─────────────────────────────────────────────────────────
// Phase 0: Temario — 64 preguntas, 60 min, avisos a 30 min y 5 min restantes
// Phase 1: Psicotécnico A (series + abstracto) — 36 preguntas, 12 min
// Phase 2: Psicotécnico B (verbal) — 15 preguntas, 6 min

const SIM_PHASES = [
  {name:'Temario',icon:'📚',questions:64,timeSec:3600,
   subs:['B1S1','B1S2','B1S3','B2S1','B2S2','B2S3','B2S4','B2S5','B3S1','B3S2','B3S3','B3S4','B4S1','B4S2','B4S3','B4S4','B4S5','B5S1','B5S2','B5S3','B5S4','B5S5','B5S6','B5S7'],
   warnings:[{at:1800,msg:'⏱ Quedan 30 minutos'},{at:300,msg:'⚠️ ¡Quedan 5 minutos!'}]},
  {name:'Psicotécnico I',icon:'🔢',questions:36,timeSec:720,
   subs:['PS1','PS3'],warnings:[]},
  {name:'Psicotécnico II',icon:'📝',questions:15,timeSec:360,
   subs:['PS2'],warnings:[]},
];

function startSimulacroReal(){
  S.simPhase=0;S.simResults=[];
  S.view='simreal';
  render();
}

function buildPhaseQs(phaseIdx){
  const phase=SIM_PHASES[phaseIdx];
  let pool=[];
  phase.subs.forEach(sid=>(QB[sid]||[]).forEach(q=>pool.push({...q,src:'offline',sid})));
  // If pool smaller than target, repeat questions
  let result=[];
  if(pool.length===0)return result;
  while(result.length<phase.questions){
    result=[...result,...shuffle(pool)];
  }
  return result.slice(0,phase.questions).map((q,i)=>({...q,id:i}));
}

function runSimPhase(phaseIdx){
  const phase=SIM_PHASES[phaseIdx];
  const qs=buildPhaseQs(phaseIdx);
  S.simPhaseData=phase;
  S.cfg={
    subs:phase.subs,n:qs.length,tSec:phase.timeSec,
    useAI:false,label:`Simulacro real · ${phase.name}`,
    blkLabel:'🎯 Simulacro real',subLabel:`${phase.icon} ${phase.name}`,
    isSimReal:true,phaseIdx,
  };
  S.qs=qs;S.ans={};S.rev={};S.cur=0;S.tLeft=phase.timeSec;
  S.view='simreal_running';
  S._warnFired={};
  clearInterval(S.tInt);
  S.tInt=setInterval(()=>{
    if(--S.tLeft<=0){
      clearInterval(S.tInt);
      finishSimPhase(true); // time expired
    } else {
      // Check warnings
      if(phase.warnings){
        phase.warnings.forEach(w=>{
          if(S.tLeft===w.at && !S._warnFired[w.at]){
            S._warnFired[w.at]=true;
            showToast(w.msg);
          }
        });
      }
      updT();
    }
  },1000);
  render();
}

function showToast(msg){
  // Remove existing toast
  const old=document.getElementById('sim-toast');
  if(old)old.remove();
  const toast=document.createElement('div');
  toast.id='sim-toast';
  toast.className='toast';
  toast.textContent=msg;
  document.body.appendChild(toast);
  setTimeout(()=>{ const t=document.getElementById('sim-toast');if(t)t.remove(); },4000);
}

function finishSimPhase(timeExpired=false){
  clearInterval(S.tInt);
  const phaseIdx=S.cfg.phaseIdx;
  const q=S.qs;
  const correct=q.filter((_,i)=>S.ans[i]===getC(q[i])).length;
  const wrong=q.filter((_,i)=>S.ans[i]!==undefined&&S.ans[i]!==-1&&S.ans[i]!==getC(q[i])).length;
  const skipped=q.length-correct-wrong;
  S.simResults.push({
    phaseIdx,name:SIM_PHASES[phaseIdx].name,icon:SIM_PHASES[phaseIdx].icon,
    correct,wrong,skipped,total:q.length,
    pct:Math.round(correct/q.length*100),
    timeTaken:SIM_PHASES[phaseIdx].timeSec-S.tLeft,
    timeExpired,questions:[...q],answers:{...S.ans},
  });
  saveFailedQuestions({questions:q,answers:S.ans});
  const nextPhase=phaseIdx+1;
  if(nextPhase>=SIM_PHASES.length){
    // All done — show final results
    finishSimulacroReal();
  } else {
    S.simPhase=nextPhase;
    S.view='simreal';
    render();
  }
}

function renderSimrealPhaseEnd(){
  const phaseIdx=S.simPhase;
  const prevResult=S.simResults[S.simResults.length-1];
  const nextPhase=SIM_PHASES[phaseIdx];
  const isFirst=S.simResults.length===0;

  if(isFirst){
    // Intro screen before phase 0
    return`<div class="phase-end">
      <div class="phase-end-icon">🎯</div>
      <div class="phase-end-title">Simulacro Real</div>
      <div class="phase-end-sub">El examen consta de 3 partes. Cada parte tiene un tiempo límite. Cuando se acabe el tiempo, pasarás automáticamente a la siguiente parte.</div>
      <div style="background:#fff;border-radius:10px;padding:1rem;margin-bottom:1.5rem;border:1px solid var(--gl)">
        ${SIM_PHASES.map((p,i)=>`
        <div style="display:flex;align-items:center;gap:.75rem;padding:.6rem 0;${i<SIM_PHASES.length-1?'border-bottom:1px solid var(--gl)':''}">
          <div style="font-size:1.2rem">${p.icon}</div>
          <div><div style="font-weight:600;font-size:.85rem">${p.name}</div>
          <div style="font-size:.75rem;color:var(--gray)">${p.questions} preguntas · ${Math.round(p.timeSec/60)} minutos</div></div>
        </div>`).join('')}
      </div>
      <div class="phase-end-btns">
        <button class="btn btn-p" style="width:100%;justify-content:center" onclick="runSimPhase(0)">🚀 Comenzar el examen</button>
        <button class="btn btn-g btn-sm" onclick="goHome()">← Cancelar</button>
      </div>
    </div>`;
  }

  // Between phases
  const prev=SIM_PHASES[phaseIdx-1];
  return`<div class="phase-end">
    <div class="phase-end-icon">${prevResult.timeExpired?'⏰':'✅'}</div>
    <div class="phase-end-title">${prevResult.timeExpired?'Tiempo agotado':'Parte completada'}</div>
    <div class="phase-end-sub">
      <strong>${prev.icon} ${prev.name}</strong><br>
      ${prevResult.correct}/${prevResult.total} correctas · ${prevResult.pct}%<br>
      ${prevResult.timeExpired?'Se ha agotado el tiempo de esta parte.':'Has terminado antes del tiempo límite.'}
    </div>
    <div style="background:#fff;border-radius:10px;padding:1rem;margin-bottom:1.5rem;border:1px solid var(--gl);text-align:left">
      <div style="font-weight:600;font-size:.82rem;color:var(--gray);margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.5px">Siguiente parte</div>
      <div style="display:flex;align-items:center;gap:.75rem">
        <div style="font-size:1.4rem">${nextPhase.icon}</div>
        <div>
          <div style="font-weight:700;font-size:.95rem">${nextPhase.name}</div>
          <div style="font-size:.78rem;color:var(--gray)">${nextPhase.questions} preguntas · ${Math.round(nextPhase.timeSec/60)} minutos</div>
        </div>
      </div>
    </div>
    <div class="phase-end-btns">
      <button class="btn btn-p" style="width:100%;justify-content:center" onclick="runSimPhase(${phaseIdx})">▶ Empezar ${nextPhase.name}</button>
      <button class="btn btn-g btn-sm" onclick="abandonSimulacro()">Abandonar examen</button>
    </div>
  </div>`;
}

function abandonSimulacro(){
  if(confirm('¿Abandonar el simulacro real? Los resultados parciales se perderán.')){
    clearInterval(S.tInt);
    S.simResults=[];S.simPhase=0;
    goHome();
  }
}

function finishSimulacroReal(){
  const totalCorrect=S.simResults.reduce((a,r)=>a+r.correct,0);
  const totalQ=S.simResults.reduce((a,r)=>a+r.total,0);
  const pct=Math.round(totalCorrect/totalQ*100);
  S.stats.exams.push({date:Date.now(),correct:totalCorrect,total:totalQ,pct,label:'Simulacro real completo'});
  saveStats();
  S.result={
    isSimReal:true,
    phases:S.simResults,
    correct:totalCorrect,total:totalQ,pct,
    timeTaken:S.simResults.reduce((a,r)=>a+r.timeTaken,0),
  };
  S.showRev=false;
  S.view='results';
  render();
}


function skipToNextSimPhase(){
  if(!S.cfg||!S.cfg.isSimReal)return;
  const nextIdx=S.cfg.phaseIdx+1;
  if(nextIdx>=SIM_PHASES.length){
    if(confirm('¿Finalizar el examen? Las preguntas sin contestar contarán como omitidas.')){
      finishSimPhase(false);
    }
    return;
  }
  if(confirm('¿Saltar a la siguiente parte? Las preguntas sin contestar contarán como omitidas.')){
    finishSimPhase(false);
  }
}
Object.assign(window,{goHome,goStats,openConfig,closeConfig,toggleRev,clearStats,
  toggleBlk,toggleSub,setAI,adjN,adjT,launchExam,startSubTest,
  prevQ,nextQ,skipQ,finishQuiz,selAns,doIP,dismissIP,
  toggleDark,startQuickMode,goRevision,startRevisionExam,clearFailed,
  startByBloque,startBloqueTest,startSimulacroReal,runSimPhase,
  finishSimPhase,abandonSimulacro});
// Apply dark on load
if(S.dark)document.body.classList.add('dark');
render();
</script>
