:root{
  --m:#7B1F5E;--md:#5E1748;
  --b1:#8B1A4A;--b2:#1D4ED8;--b3:#C2410C;--b4:#0D9488;--b5:#4F46E5;
  --cream:#F4EFE6;--dark:#1C1C2E;--gray:#6B7280;--gl:#E5E7EB;--card:#fff;--line:#E5E7EB;--txt:#1f2937;
  --sb:env(safe-area-inset-bottom,0px);
}
body.dark{--cream:#0F0F1A;--card:#1C1C2E;--line:#2D2D45;--txt:#E5E7EB;--gl:#2D2D45}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"Geist",system-ui,sans-serif;background:var(--cream);color:var(--txt);overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:1rem 1rem 1.5rem;max-width:760px;margin:0 auto}
.brand{text-align:center;padding:2.6rem 1rem 1rem;position:relative}
.anden-title{font-family:"Shrimp",serif;font-size:3rem;font-weight:700;color:#8B1A4A;letter-spacing:-1px;line-height:1;margin-bottom:.5rem}
body.dark .anden-title{color:#D49AC4}
.anden-tagline{font-family:"NewTitle",serif;font-size:.92rem;font-weight:300;color:var(--gray)}
.dark-toggle{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.3rem;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;font-size:.9rem;padding:11px 18px}
.btn-p{background:var(--m);color:#fff}.btn-p:active{transform:scale(.97)}
.btn-g{background:transparent;color:var(--gray);border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-sm{padding:7px 12px;font-size:.78rem}
.wide{width:100%}
.hd{display:flex;align-items:center;gap:.75rem;margin:.25rem 0 1rem}
.hd .btn{flex-shrink:0;white-space:nowrap}.hd-t{min-width:0}
.kick{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--m)}
body.dark .kick{color:#D49AC4}
.tit{font-weight:700;font-size:1.05rem}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:1rem;margin-bottom:1rem;line-height:1.5;font-size:.92rem}
.box p+p{margin-top:.5rem}.center{text-align:center}
.filtros{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.9rem}
.sel{flex:1 1 150px;min-width:0;padding:.6rem .7rem;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:.86rem;background:var(--card);color:var(--txt)}
.chips{display:flex;flex-wrap:wrap;gap:.35rem;width:100%}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--txt);border-radius:20px;padding:.3rem .75rem;font:inherit;font-size:.75rem;cursor:pointer}
.chip.on{background:var(--m);color:#fff;border-color:var(--m)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;text-align:center;margin-bottom:.7rem}
.stats b{display:block;font-size:1.5rem;color:var(--m)}body.dark .stats b{color:#D49AC4}
.stats span{font-size:.68rem;color:var(--gray)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:.9rem}.bar i{display:block;height:100%;background:var(--m)}
.ajustes{display:flex;flex-direction:column;gap:.15rem;margin-top:.5rem}
.aj-row{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--gray);padding:.3rem 0}
.lnk{background:none;border:none;text-align:left;font:inherit;font-size:.82rem;color:var(--gray);padding:.45rem 0;cursor:pointer}
.flash{min-height:230px;cursor:pointer}
.grp{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--m);margin-bottom:.4rem}body.dark .grp{color:#D49AC4}
.q{font-size:1.1rem;font-weight:600;margin:.4rem 0}
.a{font-size:1.04rem;margin-top:.8rem;padding-top:.8rem;border-top:1.5px dashed var(--line)}
.a b,.q b{color:var(--m)}body.dark .a b{color:#D49AC4}
.hint{margin-top:1.6rem;font-size:.75rem;color:var(--gray);text-align:center}
.cita{margin-top:.9rem;font-size:.8rem;color:#4b5563;background:#F4F4F6;border-left:4px solid var(--m);border-radius:6px;padding:.55rem .7rem;line-height:1.45}
body.dark .cita{background:#252538;color:#C7C7D1}
.ap{font-size:.65rem;color:var(--gray);margin-bottom:.25rem}
.tag{display:inline-block;font-size:.6rem;font-weight:700;text-transform:uppercase;padding:.1rem .45rem;border-radius:9px;margin:0 .2rem .2rem 0}
.t-ya{background:#FBE9E9;color:#C00000}.t-tr{background:#FCEFE3;color:#C55A11}.t-cl{background:#F4E9F2;color:#80206D}
.row2{display:flex;justify-content:space-between;gap:.5rem}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.eb{border:none;border-radius:10px;padding:.75rem .2rem;font:inherit;font-size:.82rem;font-weight:700;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.1rem}
.eb small{font-weight:400;font-size:.66rem;opacity:.85}
.eb0{background:#C00000}.eb1{background:#C55A11}.eb2{background:#15803D}.eb3{background:#1D4ED8}
.gh{font-weight:700;font-size:.78rem;color:var(--m);text-transform:uppercase;letter-spacing:.6px;margin:1.1rem 0 .5rem}body.dark .gh{color:#D49AC4}
.truco{border-left:4px solid;border-radius:8px;padding:.65rem .8rem;margin-bottom:.6rem;font-size:.88rem;line-height:1.5}
.truco.cl{border-color:#2E7D32;background:#EAF4EA}.truco.pr{border-color:#80206D;background:#F4E9F2}
body.dark .truco.cl{background:#1d2b1f}body.dark .truco.pr{background:#2a1f2c}
.tt{font-weight:700;margin-bottom:.25rem}.tt span{font-weight:400;font-size:.66rem;color:var(--gray);margin-left:.3rem}
.intro{font-size:.88rem;margin-bottom:.6rem}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:.8rem;border-radius:10px}
.tb{border-collapse:collapse;font-size:.77rem;min-width:100%;line-height:1.35}
.tb th,.tb td{padding:.45rem .5rem;border:1px solid var(--cream);vertical-align:top;text-align:left}
.tb thead th{background:#80206D;color:#fff;font-size:.7rem;text-transform:uppercase}
.tb tbody th{background:#E4D3E1;color:#3b0f33;min-width:95px}
.tb td{background:#EBEBEC;color:#262626;min-width:95px}
body.dark .tb td{background:#252538;color:#E5E7EB}body.dark .tb tbody th{background:#3a2440;color:#F1E3EE}
.clave{background:#FBE9E9;border-left:4px solid #C00000;border-radius:8px;padding:.55rem .7rem;font-size:.84rem;margin-bottom:.5rem;line-height:1.45}
body.dark .clave{background:#2e1b1b}
.preg{margin-top:.7rem;padding:.55rem .7rem;background:#F4E9F2;border-radius:8px}body.dark .preg{background:#2a1f2c}
.item{display:flex;align-items:center;gap:.7rem;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:.8rem .9rem;margin-bottom:.55rem;cursor:pointer}
.item>span{color:var(--m);font-size:1.1rem;margin-left:auto}
.it-t{font-weight:600;font-size:.88rem}.it-s{font-size:.72rem;color:var(--gray)}
.num{width:30px;height:30px;border-radius:8px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.temario{font-size:.9rem;line-height:1.6}.temario p{margin-bottom:.6rem}.temario table{border-collapse:collapse;font-size:.78rem;display:block;overflow-x:auto}.temario td,.temario th{border:1px solid var(--line);padding:.3rem}
.empty{color:var(--gray);font-size:.85rem}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1.5px solid var(--line);padding:.35rem .25rem calc(.35rem + var(--sb));flex-shrink:0}
.tab{background:none;border:none;font:inherit;font-size:.64rem;font-weight:600;color:var(--gray);display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.3rem 0;cursor:pointer}
.tab span{font-size:1.25rem;filter:grayscale(1);opacity:.6}
.tab.on{color:var(--m)}.tab.on span{filter:none;opacity:1}body.dark .tab.on{color:#D49AC4}
.loader{display:flex;justify-content:center;padding:2rem}.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--m);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--sb));transform:translateX(-50%);background:#1C1C2E;color:#fff;padding:.6rem 1rem;border-radius:10px;font-size:.82rem;z-index:99;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
