<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#7B1F5E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Renfe OC N2">
<link rel="manifest" href="manifest.json">
<title>Renfe · Operador Comercial N2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --m:#7B1F5E;--md:#5E1748;
  --b1:#8B1A4A;--b2:#1D4ED8;--b3:#C2410C;--b4:#0D9488;--b5:#4F46E5;--bp:#7C3AED;
  --cream:#F4EFE6;--dark:#1C1C2E;--gold:#C8960A;
  --gray:#6B7280;--gl:#E5E7EB;
  --green:#15803D;--orange:#C2410C;--blue:#1D4ED8;
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--dark);overscroll-behavior:none}
#app{height:100%;display:flex;flex-direction:column}
.hdr{background:var(--dark);color:#fff;padding:0 1rem;height:56px;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;border-bottom:3px solid var(--m);z-index:50}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-badge{background:var(--m);font-family:'Playfair Display',serif;font-weight:900;font-size:1rem;padding:3px 10px;letter-spacing:1px}
.hdr-sub{font-size:.65rem;font-weight:300;color:#999;letter-spacing:2px;text-transform:uppercase}
.hdr-nav{display:flex;gap:5px;align-items:center}
.hdr-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:#ccc;padding:5px 9px;
  border-radius:4px;cursor:pointer;font-size:.72rem;transition:all .2s;font-family:inherit}
.hdr-btn:hover,.hdr-btn.on{background:var(--m);border-color:var(--m);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:#555}
.dot.on{background:#22C55E;box-shadow:0 0 5px #22C55E}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:6px;
  cursor:pointer;font-family:inherit;font-weight:600;font-size:.9rem;padding:11px 18px;transition:all .2s}
.btn-p{background:var(--m);color:#fff}.btn-p:hover{background:var(--md)}.btn-p:active{transform:scale(.97)}
.btn-s{background:transparent;color:var(--dark);border:2px solid var(--dark)}.btn-s:hover{background:var(--dark);color:#fff}
.btn-g{background:transparent;color:var(--gray);border:1.5px solid var(--gl)}.btn-g:hover{border-color:var(--dark);color:var(--dark)}
.btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.btn-sm{padding:7px 12px;font-size:.78rem}
.inst{background:var(--dark);color:#fff;padding:.65rem 1rem;display:flex;align-items:center;gap:.75rem;flex-shrink:0}
.inst-t{font-size:.8rem;flex:1;line-height:1.4}
.inst-x{background:transparent;border:none;color:#aaa;cursor:pointer;font-size:1rem;padding:2px 6px}
.home{padding:1.25rem;max-width:720px;margin:0 auto}
.hero{background:var(--dark);border-radius:14px;padding:1.5rem 1.5rem 1.25rem;color:#fff;
  margin-bottom:1.25rem;position:relative;overflow:hidden}
.hero::after{content:'🚄';font-size:5rem;position:absolute;right:-.5rem;top:50%;transform:translateY(-50%);opacity:.07;pointer-events:none}
.hero-ey{font-size:.68rem;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem;font-weight:600}
.hero-title{font-family:'Playfair Display',serif;font-size:1.8rem;line-height:1.1;margin-bottom:.45rem}
.hero-sub{color:#aaa;font-size:.82rem;line-height:1.55;margin-bottom:1.1rem}
.hero-btns{display:flex;gap:.65rem;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:.65rem;margin-bottom:1.5rem}
.kpi{background:#fff;border-radius:8px;padding:.85rem;text-align:center;border:1px solid var(--gl)}
.kpi-n{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--m);line-height:1}
.kpi-l{color:var(--gray);font-size:.65rem;margin-top:3px}
.sec-hd{font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:.85rem;color:var(--dark)}
.bloque{margin-bottom:.85rem}
.blk-hdr{display:flex;align-items:center;gap:.65rem;padding:.85rem 1rem;border-radius:10px;
  background:#fff;border:1px solid var(--gl);cursor:pointer;transition:all .2s}
.blk-hdr:hover{box-shadow:0 3px 12px rgba(0,0,0,.08)}
.blk-num{width:28px;height:28px;border-radius:50%;color:#fff;font-size:.78rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.blk-info{flex:1}
.blk-title{font-weight:600;font-size:.88rem;line-height:1.3}
.blk-sub{font-size:.7rem;color:var(--gray);margin-top:2px}
.blk-arr{color:var(--gray);transition:transform .25s;font-size:.85rem}
.blk-arr.open{transform:rotate(90deg)}
.subs-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;padding:.6rem .5rem 0}
.sub-card{background:#fff;border-radius:8px;padding:.85rem;cursor:pointer;
  border:1px solid var(--gl);border-left:3px solid var(--bc,var(--m));transition:all .2s}
.sub-card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sub-card:active{transform:scale(.97)}
.sc-icon{font-size:1.1rem;margin-bottom:.3rem}
.sc-name{font-weight:600;font-size:.76rem;line-height:1.3}
.sc-desc{font-size:.64rem;color:var(--gray);margin-top:2px;line-height:1.35}
.quiz{padding:1rem;max-width:720px;margin:0 auto}
.quiz-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:.6rem;gap:.5rem}
.quiz-meta{flex:1;min-width:0}
.quiz-blk{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--m);margin-bottom:2px}
.quiz-sub{font-family:'Playfair Display',serif;font-size:1.05rem;line-height:1.2}
.timer{background:var(--dark);color:#fff;padding:5px 9px;border-radius:4px;
  font-weight:700;font-size:.83rem;white-space:nowrap;font-family:monospace;flex-shrink:0}
.timer.warn{background:var(--orange)}.timer.danger{background:var(--m);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.prog-wrap{margin-bottom:.75rem}
.prog-bar{height:4px;background:var(--gl);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--m);transition:width .3s}
.prog-txt{display:flex;justify-content:space-between;font-size:.7rem;color:var(--gray);margin-top:4px}
.q-card{background:#fff;border-radius:12px;padding:1.2rem;margin-bottom:.65rem;
  border:1px solid var(--gl);box-shadow:0 2px 8px rgba(0,0,0,.05)}
.q-num{color:var(--m);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem}
.q-src{background:var(--gl);color:var(--gray);font-size:.6rem;padding:1px 6px;border-radius:3px;font-weight:600;margin-left:6px}
.q-text{font-size:.97rem;font-weight:500;line-height:1.55;margin-bottom:.9rem}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:flex-start;gap:9px;background:var(--cream);border:2px solid transparent;
  border-radius:8px;padding:10px 13px;cursor:pointer;font-family:inherit;font-size:.87rem;
  line-height:1.4;text-align:left;transition:all .15s;width:100%}
.opt:hover:not(:disabled){border-color:var(--m);background:#fff}
.opt.sel{border-color:var(--dark);background:#fff}
.opt.ok{border-color:var(--green);background:#F0FDF4;color:var(--green)}
.opt.ko{border-color:var(--m);background:#FDF2F8;color:var(--md)}
.opt:disabled{cursor:default}
.opt-l{width:22px;height:22px;border-radius:50%;background:var(--gl);display:flex;
  align-items:center;justify-content:center;font-weight:700;font-size:.7rem;flex-shrink:0;margin-top:1px}
.opt.sel .opt-l{background:var(--dark);color:#fff}
.opt.ok .opt-l{background:var(--green);color:#fff}
.opt.ko .opt-l{background:var(--m);color:#fff}
.expl{background:#EFF6FF;border-left:4px solid var(--blue);border-radius:0 8px 8px 0;
  padding:.9rem;margin-top:.65rem;font-size:.82rem;line-height:1.6;color:#1E3A8A}
.expl strong{display:block;margin-bottom:3px;font-size:.74rem;text-transform:uppercase;letter-spacing:.5px}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;
  padding:.85rem 1rem;background:var(--cream);border-top:1px solid var(--gl);
  flex-shrink:0;padding-bottom:calc(.85rem + var(--sb))}
.loader{display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:.85rem;color:var(--gray);padding:2rem;text-align:center}
.spin{width:38px;height:38px;border:3px solid var(--gl);border-top-color:var(--m);
  border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-t{font-weight:600;font-size:.95rem;color:var(--dark)}
.results{padding:1.25rem;max-width:720px;margin:0 auto}
.res-hero{background:var(--dark);border-radius:14px;padding:1.75rem;text-align:center;color:#fff;margin-bottom:1.1rem}
.res-score{font-family:'Playfair Display',serif;font-size:4.5rem;color:var(--gold);line-height:1}
.res-lbl{color:#999;font-size:.82rem;margin-top:.2rem}
.res-verd{font-size:1rem;font-weight:600;margin-top:.6rem}
.res-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.65rem;margin-top:.9rem}
.rs{text-align:center}
.rs-n{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700}
.rs-l{font-size:.7rem;color:#aaa}
.cg{color:#4ADE80}.cr{color:#F87171}.cs{color:#94A3B8}
.rev-list{display:flex;flex-direction:column;gap:.65rem}
.rev-item{background:#fff;border-radius:8px;padding:.9rem .9rem .9rem 1.1rem;
  border:1px solid var(--gl);border-left:4px solid var(--ac,var(--gl))}
.rev-q{font-weight:500;font-size:.87rem;margin-bottom:.4rem;line-height:1.4}
.rev-a{font-size:.8rem}
.stats-pg{padding:1.25rem;max-width:720px;margin:0 auto}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin-bottom:1.25rem}
.big-s{background:#fff;border-radius:8px;padding:1.1rem;text-align:center;border:1px solid var(--gl)}
.big-n{font-family:'Playfair Display',serif;font-size:2.1rem;color:var(--m)}
.big-l{color:var(--gray);font-size:.72rem;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;border:1px solid var(--gl);font-size:.83rem}
.tbl th{background:var(--dark);color:#fff;padding:9px 11px;text-align:left;font-weight:500;font-size:.75rem}
.tbl td{padding:9px 11px;border-bottom:1px solid var(--gl)}
.tbl tr:last-child td{border-bottom:none}
.badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:.7rem;font-weight:600}
.bg{background:#D1FAE5;color:var(--green)}.bo{background:#FEF3C7;color:var(--orange)}.br{background:#FEE2E2;color:var(--m)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:1.5rem;width:100%;max-width:600px;
  max-height:90vh;overflow-y:auto;padding-bottom:calc(1.5rem + var(--sb))}
.modal-t{font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:1rem}
.modal-sec{margin-bottom:1rem}
.modal-lbl{font-weight:600;font-size:.8rem;margin-bottom:.5rem}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1.5px solid var(--gl);border-radius:20px;padding:4px 10px;font-size:.75rem;
  cursor:pointer;transition:all .15s;background:#fff;font-family:inherit}
.chip.on{border-color:var(--m);background:var(--m);color:#fff}
.num-row{display:flex;align-items:center;gap:.85rem}
.num-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--gl);background:#fff;
  cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .15s}
.num-btn:hover{border-color:var(--m);color:var(--m)}
.num-v{font-size:1.15rem;font-weight:700;min-width:30px;text-align:center}
.modal-act{display:flex;gap:.65rem;justify-content:flex-end;margin-top:1rem}
@media(min-width:580px){
  .subs-grid{grid-template-columns:repeat(3,1fr)}
  .sg{grid-template-columns:repeat(4,1fr)}
  .overlay{align-items:center}
  .modal{border-radius:14px;max-height:80vh}
}

/* DARK MODE */
body.dark{background:#0F0F1A;color:#E5E7EB}
body.dark .hdr{background:#07070F;border-color:#4B1A3A}
body.dark .screen{background:#0F0F1A}
body.dark .hero{background:#1A0A2E}
body.dark .kpi{background:#1C1C2E;border-color:#2D2D45}
body.dark .kpi-n{color:#C47DB5}
body.dark .blk-hdr{background:#1C1C2E;border-color:#2D2D45}
body.dark .blk-title{color:#E5E7EB}
body.dark .blk-sub{color:#9CA3AF}
body.dark .blk-arr{color:#9CA3AF}
body.dark .sub-card{background:#1C1C2E;border-color:#2D2D45}
body.dark .sc-name{color:#E5E7EB}
body.dark .sc-desc{color:#9CA3AF}
body.dark .q-card{background:#1C1C2E;border-color:#2D2D45}
body.dark .q-text{color:#E5E7EB}
body.dark .opt{background:#252538;color:#E5E7EB;border-color:transparent}
body.dark .opt:hover:not(:disabled){background:#2D2D45;border-color:#7B1F5E}
body.dark .opt.sel{background:#2D2D45;border-color:#C5C5E8}
body.dark .opt.ok{background:#052E16;border-color:#15803D;color:#4ADE80}
body.dark .opt.ko{background:#2D0A1E;border-color:#7B1F5E;color:#F9A8D4}
body.dark .opt-l{background:#2D2D45;color:#E5E7EB}
body.dark .opt.sel .opt-l{background:#E5E7EB;color:#1C1C2E}
body.dark .opt.ok .opt-l{background:#15803D;color:#fff}
body.dark .opt.ko .opt-l{background:#7B1F5E;color:#fff}
body.dark .expl{background:#0D1F3C;border-color:#2563EB;color:#93C5FD}
body.dark .expl strong{color:#60A5FA}
body.dark .quiz-nav{background:#0F0F1A;border-color:#2D2D45}
body.dark .prog-bar{background:#2D2D45}
body.dark .quiz-blk{color:#C47DB5}
body.dark .quiz-sub{color:#E5E7EB}
body.dark .res-hero{background:#07070F}
body.dark .rev-item{background:#1C1C2E;border-color:#2D2D45}
body.dark .rev-q{color:#E5E7EB}
body.dark .stats-pg{background:#0F0F1A}
body.dark .big-s{background:#1C1C2E;border-color:#2D2D45;color:#E5E7EB}
body.dark .big-n{color:#C47DB5}
body.dark .big-l{color:#9CA3AF}
body.dark .tbl{background:#1C1C2E;border-color:#2D2D45}
body.dark .tbl th{background:#07070F}
body.dark .tbl td{border-color:#2D2D45;color:#E5E7EB}
body.dark .modal{background:#1C1C2E}
body.dark .modal-t{color:#E5E7EB}
body.dark .modal-lbl{color:#E5E7EB}
body.dark .chip{background:#252538;border-color:#2D2D45;color:#E5E7EB}
body.dark .btn-g{color:#9CA3AF;border-color:#2D2D45}
body.dark .btn-g:hover{border-color:#C47DB5;color:#E5E7EB}
body.dark .btn-s{color:#E5E7EB;border-color:#C5C5E8}
body.dark .btn-s:hover{background:#E5E7EB;color:#1C1C2E}
body.dark .sec-hd{color:#E5E7EB}
body.dark .inst{background:#07070F}
body.dark .loader{background:#0F0F1A}
body.dark .loader-t{color:#E5E7EB}
body.dark .home{background:#0F0F1A}
body.dark .results{background:#0F0F1A}
body.dark .sg{background:transparent}
body.dark .num-btn{background:#252538;border-color:#2D2D45;color:#E5E7EB}
body.dark .num-v{color:#E5E7EB}
body.dark .overlay{background:rgba(0,0,0,.75)}
/* Dark mode toggle button */
.dark-btn{background:transparent;border:1px solid rgba(255,255,255,.2);color:#ccc;
  padding:5px 8px;border-radius:4px;cursor:pointer;font-size:.85rem;transition:all .2s;line-height:1}
.dark-btn:hover{background:rgba(255,255,255,.1)}
/* REVISION MODE */
.rev-mode-card{background:#fff;border-radius:12px;padding:1.2rem;margin-bottom:.65rem;
  border:1px solid var(--gl);box-shadow:0 2px 8px rgba(0,0,0,.05)}
body.dark .rev-mode-card{background:#1C1C2E;border-color:#2D2D45}
.rev-mode-empty{text-align:center;padding:3rem 1rem;color:var(--gray)}
.rev-mode-empty .rev-icon{font-size:3rem;margin-bottom:1rem}
/* QUICK MODE banner */
.quick-btn{
  background:linear-gradient(135deg,#4F46E5,#7B1F5E);
  color:#fff;border:none;border-radius:10px;
  padding:1rem 1.25rem;width:100%;text-align:left;
  cursor:pointer;transition:all .2s;margin-bottom:.65rem;
  display:flex;align-items:center;gap:.85rem;font-family:inherit}
.quick-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(79,70,229,.35)}
.quick-btn:active{transform:scale(.98)}
.quick-icon{font-size:1.75rem;flex-shrink:0}
.quick-title{font-weight:700;font-size:1rem;margin-bottom:2px}
.quick-sub{font-size:.75rem;opacity:.85}

</style>

B1S2:[
  {q:"¿Qué es el servicio AVLO de Renfe?",o:["El servicio premium de primera clase","Un servicio de alta velocidad de bajo coste con condiciones específicas de tarifa y servicios","Un abono mensual para AVE","Un servicio de media distancia nocturno"],c:1,e:"AVLO es el servicio de alta velocidad de bajo coste de Renfe. Opera con tarifas más económicas y condiciones comerciales propias, incluyendo restricciones de equipaje y condiciones de posventa más limitadas."},
  {q:"¿Qué permite el 'Combinado Cercanías' al comprar un billete AVE o Larga Distancia?",o:["Descuento del 50% en el siguiente viaje","Obtener gratuitamente un billete de Cercanías en origen y/o destino","Acceso gratuito a la Sala Club","Cambio gratuito del billete AVE"],c:1,e:"El Combinado Cercanías permite que con la compra de un billete AVE o Larga Distancia, el cliente obtenga de forma gratuita un billete de Cercanías tanto en origen como en destino."},

  {q:"¿Qué es el programa '+Renfe'?",o:["Un seguro de viaje adicional","El programa de fidelización de Renfe que permite acumular puntos canjeables por descuentos y billetes","Un servicio premium de alta velocidad","Un abono de Cercanías para toda España"],c:1,e:"+Renfe es el programa de fidelización de Renfe Viajeros. Los clientes acumulan puntos con cada viaje, canjeables por descuentos, billetes gratuitos y otros beneficios."},
  {q:"¿Qué son las Salas Club de Renfe?",o:["Los vagones de primera clase del AVE","Salas de espera exclusivas en estaciones para clientes de primera clase o tarjeta habilitada","Los comedores a bordo en trenes de Larga Distancia","Las oficinas de atención al cliente"],c:1,e:"Las Salas Club son espacios exclusivos en determinadas estaciones para clientes que viajan en primera clase o que disponen de tarjeta habilitada, ofreciendo servicios adicionales de confort."},

  {q:"¿Qué son los billetes y tarjetas FIP?",o:["Billetes con descuento para familias numerosas","Títulos de transporte para personal ferroviario internacional y sus beneficiarios, fruto de acuerdos de reciprocidad entre compañías europeas","Billetes internacionales de alta velocidad","Tarjetas de fidelización para europeos"],c:1,e:"Los billetes y tarjetas FIP (Formulaire d'Identité Professionnelle) son títulos de transporte para el personal ferroviario internacional y sus beneficiarios, resultado de acuerdos de reciprocidad entre operadoras europeas."},
  {q:"¿Qué condiciones aplica AVLO en materia de equipaje respecto al AVE estándar?",o:["Sin restricciones, igual que el AVE","Condiciones más restrictivas en número y tamaño de bultos","Solo permite equipaje de mano de cabina","El equipaje siempre va en bodega facturado"],c:1,e:"AVLO, al ser un servicio de bajo coste, aplica condiciones de equipaje más restrictivas que el AVE convencional. Los clientes deben respetar los límites de la normativa comercial específica de AVLO."},

B1S3:[
  {q:"¿Cuál es la diferencia fundamental entre Eurail e Interrail?",o:["No hay diferencia, son el mismo producto","Eurail es para residentes fuera de Europa; Interrail para residentes en un país europeo participante","Interrail solo vale para España","Eurail es más caro que Interrail"],c:1,e:"La diferencia clave es la residencia: Interrail es para personas residentes en países europeos participantes; Eurail, para viajeros residentes fuera del área europea."},
  {q:"¿Cuántos viajes permite el Spain Rail Pass?",o:["Viajes ilimitados durante 1 mes","4, 6, 8 ó 10 viajes según la modalidad elegida","2 viajes de ida y vuelta","1 viaje de larga distancia"],c:1,e:"El Spain Rail Pass permite realizar 4, 6, 8 ó 10 viajes en trenes de Renfe Viajeros en función de la modalidad adquirida."},

  {q:"¿Es obligatoria la formalización del viaje con el Spain Rail Pass?",o:["No, basta con mostrar el pase al interventor","Sí, es obligatoria para cada viaje","Solo en trenes AVE","Solo si supera los 200 km"],c:1,e:"La formalización es obligatoria para cada trayecto. Puede hacerse en taquillas, web, agencias de viaje, venta telefónica o App de Renfe, sin necesidad de usar el mismo canal de compra del pase."},

B2S1:[
  {q:"¿Cuándo y cómo se creó RENFE?",o:["En 1936, tras el inicio de la Guerra Civil","En 1941, mediante la Ley de Bases de Ordenación Ferroviaria, para unificar las compañías ferroviarias privadas","En 1950, por decisión del gobierno","En 1929, tras la crisis económica"],c:1,e:"RENFE fue creada en 1941 mediante la Ley de Bases de Ordenación Ferroviaria y de los Transportes por Carretera, para nacionalizar y unificar las compañías ferroviarias privadas en situación deficitaria tras la Guerra Civil."},
  {q:"¿Cuál es el objetivo principal del II Plan de Igualdad del Grupo Renfe?",o:["Aumentar beneficios de Renfe","Dar cumplimiento a la legislación de igualdad y continuar el compromiso del I Plan, promoviendo la igualdad efectiva entre hombres y mujeres","Reducir la plantilla","Mejorar la puntualidad de los trenes"],c:1,e:"El II Plan de Igualdad tiene como objetivo dar cumplimiento a la Ley Orgánica 3/2007 y continuar el compromiso asumido en el I Plan, garantizando la igualdad real entre mujeres y hombres en el Grupo Renfe."},
  {q:"¿Qué sindicatos participaron en la elaboración del II Plan de Igualdad?",o:["Solo UGT","SEMAF, CC.OO. y UGT, desde la Mesa Técnica de Igualdad y Aspectos Sociolaborales","CNT y CGT únicamente","Solo SEMAF y CC.OO."],c:1,e:"El II Plan de Igualdad se elaboró con la participación de SEMAF, CC.OO. y UGT, que forman parte de la Mesa Técnica de Igualdad y Aspectos Sociolaborales del II Convenio Colectivo del Grupo Renfe."},
  {q:"¿Por qué la presencia masculina es mayor en tramos de mayor antigüedad de Renfe?",o:["Por política deliberada de la empresa","Porque históricamente la carrera militar, vía de entrada exclusivamente masculina, fue una de las principales fuentes de incorporación a Renfe","Por decisiones sindicales","Por falta de candidatas femeninas"],c:1,e:"La carrera militar fue históricamente una de las principales vías de entrada en Renfe y, al ser exclusivamente masculina, incrementó la diferencia de género en los tramos de mayor antigüedad de la plantilla."},
  {q:"¿Qué cláusula contempla el convenio de Renfe cuando hay igualdad de puntuación en selección?",o:["Preferencia al candidato con más experiencia","Preferencia al género subrepresentado en esa categoría profesional","Preferencia al candidato interno","Elección aleatoria"],c:1,e:"El convenio recoge preferencia al género subrepresentado cuando existe igualdad de puntuación, dejando de tener efecto cuando se logre representación equilibrada."},
  {q:"¿Qué es el Grupo Renfe actualmente?",o:["Solo Renfe Operadora como empresa única","La EPE Renfe-Operadora y sus Sociedades Mercantiles del Estado: Renfe Viajeros, Renfe Mercancías, Renfe Fabricación y Mantenimiento, Renfe Alquiler de Material Ferroviario y Renfe of América","Un organismo público autónomo","Una empresa privada cotizada en bolsa"],c:1,e:"El Grupo Renfe está formado por la Entidad Pública Empresarial Renfe-Operadora y sus Sociedades Mercantiles del Estado: Renfe Viajeros, Renfe Mercancías, Renfe Fabricación y Mantenimiento, Renfe Alquiler de Material Ferroviario y Renfe of América."},
],
B2S2:[
  {q:"¿Qué recoge el registro retributivo obligatorio de una empresa?",o:["Solo salarios de directivos","Los valores medios de salarios, complementos y percepciones extrasalariales, desagregados por sexo y categoría profesional","Solo nóminas del último mes","Los convenios colectivos aplicables"],c:1,e:"El registro retributivo debe recoger los valores medios de salarios, complementos salariales y percepciones extrasalariales de la plantilla, desagregados por sexo y clasificación profesional."},
  {q:"¿Qué es la brecha salarial de género?",o:["La diferencia entre el SMI y el salario medio","La diferencia porcentual entre los salarios medios de hombres y mujeres en una organización","El número de mujeres que cobran menos del SMI","La diferencia entre categorías salariales"],c:1,e:"La brecha salarial es la diferencia porcentual entre los salarios medios de hombres y mujeres. Su identificación y reducción es uno de los objetivos clave del Plan de Igualdad de Renfe."},
  {q:"¿Cuántas empresas del Grupo Renfe han realizado informe de diagnóstico en el II Plan de Igualdad?",o:["Solo Renfe Operadora","EPE Renfe-Operadora, Renfe Viajeros, Renfe Mercancías, Renfe Fabricación y Mantenimiento, y Renfe Alquiler Ferroviario","Solo Renfe Viajeros y Renfe Mercancías","Todas menos Renfe of América"],c:1,e:"El II Plan incluye diagnósticos de: EPE Renfe-Operadora, Renfe Viajeros, Renfe Mercancías, Renfe Fabricación y Mantenimiento, y Renfe Alquiler Ferroviario."},
  {q:"¿Qué incluye el 'análisis de igualdad por materia' en el diagnóstico?",o:["Solo análisis de salarios","Acceso al empleo, clasificación profesional, formación, conciliación, retribución y prevención de riesgos, entre otros ámbitos","Solo la distribución de plantilla por sexo","Solo las quejas de los empleados"],c:1,e:"El análisis de igualdad por materia examina: acceso al empleo, clasificación profesional, formación, promoción, condiciones de trabajo, retribución, conciliación y prevención de riesgos, para detectar desigualdades en cada área."},
],
B2S3:[
  {q:"¿Qué objetivo tiene la auditoría retributiva del Plan de Igualdad de Renfe?",o:["Reducir el coste salarial total","Garantizar la igualdad salarial por igual trabajo, identificando y corrigiendo posibles brechas","Establecer nuevas categorías profesionales","Actualizar el convenio colectivo"],c:1,e:"La auditoría retributiva garantiza el principio de igualdad salarial por igual trabajo o trabajo de igual valor, identificando posibles brechas y proponiendo planes de actuación para corregirlas."},
  {q:"¿Qué es la 'valoración de puestos de trabajo' en la auditoría retributiva?",o:["La evaluación del rendimiento individual","El proceso analítico para determinar el valor relativo de cada puesto con independencia de quien lo ocupe, garantizando la equidad retributiva","La clasificación de empleados por antigüedad","El sistema de evaluación del desempeño anual"],c:1,e:"La valoración de puestos determina el valor relativo de cada puesto mediante criterios objetivos (responsabilidad, esfuerzo, conocimientos, condiciones), garantizando que trabajos de igual valor reciben igual retribución independientemente del sexo."},
],
B2S4:[
  {q:"¿Qué tipos de acoso contempla el Protocolo de Renfe?",o:["Solo acoso sexual","Acoso sexual, acoso por razón de sexo y acoso moral (mobbing)","Solo el acoso laboral o mobbing","Acoso sexual y acoso laboral únicamente"],c:1,e:"El Protocolo de Renfe (aprobado el 10 de marzo de 2010) abarca: acoso sexual (conductas sexuales no deseadas), acoso por razón de sexo (trato degradante por el sexo) y acoso moral o mobbing."},
  {q:"¿Cuándo fue aprobado el Protocolo de Renfe contra el acoso?",o:["10 de marzo de 2010","En 2005","En 2015","En 2020"],c:0,e:"El Protocolo para la prevención del acoso sexual, por razón de sexo y acoso moral fue aprobado por Resolución de 10 de marzo de 2010, como parte del I Plan de Igualdad."},
  {q:"¿A qué tienen derecho todos los trabajadores de Renfe según el protocolo de acoso?",o:["A teletrabajar el 100% del tiempo","A un entorno laboral libre de conductas y comportamientos hostiles o intimidatorios","A elegir su horario de trabajo","A cambiar de departamento sin justificación"],c:1,e:"El protocolo establece que todos los trabajadores y trabajadoras tienen derecho a un entorno laboral libre de conductas y comportamientos hostiles o intimidatorios hacia su persona."},
  {q:"¿Cuál es la diferencia entre acoso sexual y acoso por razón de sexo?",o:["Son exactamente lo mismo","El acoso sexual tiene componente sexual no deseado; el acoso por razón de sexo supone trato degradante vinculado al sexo de la persona, sin componente sexual necesariamente","El acoso por razón de sexo solo lo sufren las mujeres","El acoso sexual es siempre físico"],c:1,e:"El acoso sexual implica comportamientos de naturaleza sexual no deseados que atentan contra la dignidad. El acoso por razón de sexo supone un trato degradante vinculado al sexo de la persona, sin que tenga necesariamente componente sexual."},
],
B2S5:[
  {q:"¿Cuáles son los principales ámbitos de acción del Plan de Igualdad de Renfe?",o:["Solo retribución y promoción","Acceso al Grupo, condiciones de trabajo, formación, comunicación, conciliación, retribución y salud laboral","Solo conciliación y formación","Únicamente selección y contratación"],c:1,e:"Las áreas de acción incluyen: acceso al Grupo, condiciones de trabajo y carrera profesional, formación, comunicación y sensibilización, lenguaje e imagen no sexista, conciliación, retribución y salud laboral."},
  {q:"¿Qué es la Mesa Técnica de Igualdad y Aspectos Sociolaborales (MTIASL)?",o:["La comisión disciplinaria de Renfe","El órgano de negociación y seguimiento del Plan de Igualdad, integrado por Renfe y los sindicatos SEMAF, CC.OO. y UGT","El departamento de RRHH de Renfe","El comité de auditoría interna"],c:1,e:"La MTIASL es el órgano de negociación y seguimiento del Plan de Igualdad del Grupo Renfe, integrado por la representación de la empresa y los sindicatos SEMAF, CC.OO. y UGT."},
  {q:"¿Qué es el Observatorio de Igualdad de Género de Renfe?",o:["Un sistema de cámaras para vigilar igualdad","Un instrumento de seguimiento del Plan de Igualdad que analiza indicadores y propone medidas correctoras","Un programa de televisión interno","Una aplicación informática de RRHH"],c:1,e:"El Observatorio de Igualdad es uno de los instrumentos de gobernanza del Plan de Igualdad que realiza el seguimiento de los indicadores, analiza la evolución y propone medidas correctoras."},
],
B3S1:[
  {q:"¿Cuáles son los cambios en el sector ferroviario que motivan revisar la Cultura de Seguridad según el Libro Blanco?",o:["Solo el cambio tecnológico","Ha cambiado el reparto de responsabilidades, el enfoque de seguridad, las personas (relevo generacional), las tecnologías de la información y la legislación aplicable","Solo la entrada de nuevos operadores","Solo la normativa europea"],c:1,e:"El Libro Blanco identifica cinco grandes cambios: reparto de responsabilidades (seguridad compartida entre más actores), enfoque de seguridad (preventivo vs. normativo), personas (relevo generacional), tecnologías de la información y legislación (4.º Paquete Ferroviario)."},
  {q:"¿Qué implica el cambio en el 'reparto de responsabilidades' en seguridad ferroviaria?",o:["Que solo ADIF es responsable de la seguridad","Que la seguridad ha pasado de una sola empresa a ser compartida entre empresas ferroviarias, administradores de infraestructura y mantenedores","Que el conductor es el único responsable","Que la responsabilidad recae solo en los técnicos"],c:1,e:"Anteriormente la seguridad estaba integrada en una sola empresa. Tras la liberalización, se reparte entre múltiples actores: empresas ferroviarias, ADIF, mantenedores y otros, exigiendo una coordinación más compleja."},
  {q:"¿Qué implica el 'enfoque de seguridad preventivo' según el Libro Blanco?",o:["Que ya no hay normas de seguridad","Pasar de una seguridad basada en el cumplimiento de la norma a una basada en la gestión del riesgo: identificación y prevención anticipativa de situaciones peligrosas","Que los accidentes no son responsabilidad de la empresa","Que solo se actúa tras los accidentes"],c:1,e:"El nuevo enfoque supone pasar de una seguridad reactiva (cumplir la norma) a una proactiva (gestión del riesgo), identificando y previniendo anticipativamente situaciones peligrosas antes de que se materialicen en accidentes."},
  {q:"¿Qué exige el Reglamento Delegado (UE) 2018/762 a las empresas ferroviarias?",o:["La eliminación de sistemas de señalización nacionales","La Cultura de Seguridad y las evidencias de su aplicación como requisito obligatorio","La privatización de todos los operadores ferroviarios","La homologación de todos los materiales rodantes"],c:1,e:"El Reglamento Delegado (UE) 2018/762, sobre requisitos de los Sistemas de Gestión de Seguridad, exige la Cultura de Seguridad y sus evidencias de aplicación como requisito obligatorio para las empresas ferroviarias."},
],
B3S2:[
  {q:"¿Qué es un Sistema de Gestión de Seguridad (SGS) en el ferrocarril?",o:["El sistema informático de venta de billetes","El conjunto de medidas que establece la empresa para garantizar que sus operaciones sean seguras, conforme a la normativa ferroviaria","El sistema de señalización ferroviaria","El plan de mantenimiento de trenes"],c:1,e:"El SGS es el conjunto organizado de medidas, procedimientos y responsabilidades que establece una empresa ferroviaria para garantizar que sus operaciones cumplan los requisitos de seguridad exigidos por la normativa."},
  {q:"¿Cuál es la relación entre el SGS y la Cultura de Seguridad?",o:["Son exactamente lo mismo","El SGS establece cómo debe actuarse; la Cultura de Seguridad determina el comportamiento real. Ambos impactan en los factores técnicos y organizacionales de la operación","El SGS es más importante que la Cultura de Seguridad","La Cultura de Seguridad sustituye al SGS"],c:1,e:"Según el Libro Blanco: el SGS nos dice cómo debemos actuar, pero es la Cultura de Seguridad la que determina nuestro comportamiento final. Ambos impactan simultáneamente en los factores técnicos y organizacionales de la operación ferroviaria."},
  {q:"¿Qué determina el éxito de un SGS según el Libro Blanco?",o:["El presupuesto dedicado a seguridad","La madurez de la organización para desarrollar una Cultura de Seguridad que lo acompañe","El número de inspecciones realizadas","El número de empleados en el departamento de seguridad"],c:1,e:"El éxito de un SGS depende de la madurez de la organización para desarrollar una Cultura de Seguridad que lo acompañe. Un SGS sin cultura real de seguridad no garantiza por sí solo la seguridad operacional."},
  {q:"¿Por qué la Cultura de Seguridad es 'un bien intangible' según el Libro Blanco?",o:["Porque no tiene valor económico","Porque sus efectos sobre la seguridad operacional son, en su mayor parte, ocultos a simple vista, lo que puede llevar a que se le conceda menos importancia","Porque no se puede medir","Porque solo la perciben los directivos"],c:1,e:"Disponer de una Cultura de Seguridad positiva resulta un bien intangible, puesto que sus efectos son en su mayor parte ocultos a simple vista. Esta falta de visibilidad puede llevar a que algunas organizaciones le den menos importancia."},
],
B3S3:[
  {q:"¿Qué es la 'Just Culture' o Cultura Justa en el Libro Blanco de Renfe?",o:["Una cultura donde nadie responde de los accidentes","Una cultura que distingue el error humano involuntario (no sancionable) de conductas negligentes o intencionadas (sancionables), fomentando la notificación sin miedo a represalias","Una cultura donde todos los fallos se sancionan igual","Una cultura solo aplicable a maquinistas"],c:1,e:"La Just Culture distingue entre errores humanos involuntarios —no sancionables para no inhibir la notificación— de conductas negligentes o intencionadas, que sí deben tener consecuencias. Fomenta la transparencia y el aprendizaje."},
  {q:"¿Cuáles son los principios que forman los cimientos del modelo de Cultura de Seguridad del Grupo Renfe?",o:["Solo la normativa y el cumplimiento","Principios como responsabilidad compartida, Just Culture, comunicación abierta, aprendizaje continuo y liderazgo visible en seguridad","Solo el cumplimiento de normas técnicas","Solo la formación técnica del personal"],c:1,e:"El Grupo Renfe ha definido principios cimientos de su modelo: responsabilidad compartida, Just Culture, comunicación abierta, aprendizaje de incidentes y liderazgo comprometido con la seguridad."},
],
B3S4:[
  {q:"¿Cuál es el objetivo del Plan de Transformación de la Cultura de Seguridad de Renfe?",o:["Reducir el presupuesto del departamento de seguridad","Realizar los cambios necesarios para lograr el alineamiento con la Cultura de Seguridad deseada en toda la organización","Sustituir los sistemas de señalización","Aumentar la velocidad de los trenes"],c:1,e:"El Plan de Transformación tiene como objetivo realizar los cambios necesarios para lograr el alineamiento con la Cultura de Seguridad Operacional deseada, implicando a todos los colectivos del Grupo Renfe."},
  {q:"¿Qué colectivos están implicados en el Plan de Transformación de la Cultura de Seguridad?",o:["Solo los maquinistas","Solo los directivos","Todos los colectivos del Grupo Renfe: personal operativo, técnico y directivo","Solo el personal de mantenimiento"],c:2,e:"El Plan implica a todos los colectivos del Grupo Renfe. La Cultura de Seguridad es responsabilidad de toda la organización, desde el personal operativo hasta la alta dirección."},
],
B4S1:[
  {q:"¿Cómo define Renfe la Experiencia de Cliente (CX)?",o:["El servicio de atención al cliente en ventanilla","Todo lo que una persona vive con una empresa a lo largo de todas las interacciones durante toda su relación y a través de todos los canales","El sistema de reclamaciones","La calidad técnica del servicio de transporte"],c:1,e:"Según el material formativo de Renfe, la CX se refiere a todo lo que una persona vive con una empresa, a lo largo de todas las interacciones, durante toda su relación y a través de todos los canales."},
  {q:"¿Cuál es la principal diferencia entre Experiencia de Cliente y Atención al Cliente?",o:["Son lo mismo","La Atención al Cliente depende de un área concreta y actúa en momentos puntuales; la CX es responsabilidad de toda la organización y está presente desde el diseño del producto hasta el servicio postventa","La CX es menos importante","La Atención al Cliente es más amplia"],c:1,e:"La Atención al Cliente depende de un área concreta y actúa puntualmente. La CX es responsabilidad de toda la organización, presente desde el diseño del producto hasta el servicio postventa y más allá."},
  {q:"¿En qué 'era' estamos actualmente según la evolución histórica de la gestión de clientes?",o:["Era de la producción","Era del producto","Era del cliente","Era de las experiencias, donde la diferenciación clave es la experiencia que vive el cliente"],c:3,e:"Según el material de Renfe, tras pasar por las eras de la producción, el producto, el marketing y el cliente, hoy estamos en la era de las experiencias, donde la diferenciación no es solo el precio o el producto sino la experiencia completa."},
  {q:"¿Por qué es estratégicamente importante la Experiencia de Cliente para el Grupo Renfe?",o:["Solo para mejorar la imagen en redes sociales","Porque el foco en el Cliente es un pilar estratégico del Plan Estratégico del Grupo, con impacto directo en retención, fidelización, recomendación y resultados económicos","Solo por obligación regulatoria","Únicamente para diferenciarse de competidores"],c:1,e:"El foco en el Cliente es uno de los pilares estratégicos del Plan Estratégico del Grupo Renfe. Una buena CX genera retención, fidelización, recomendación y tiene impacto directo en los resultados del negocio."},
],
B4S2:[
  {q:"¿Cuáles son los elementos clave de la Experiencia de Cliente según Renfe?",o:["Solo el precio y la puntualidad","Aspectos emocionales (satisfacción, confianza, conexión emocional) y prácticos (calidad del servicio, eficiencia, facilidad de uso) en todas las interacciones","Solo la limpieza del tren","Solo la atención del personal a bordo"],c:1,e:"Los elementos clave de la CX incluyen aspectos emocionales (satisfacción, confianza, conexión emocional con la marca) y prácticos (calidad, eficiencia, facilidad de uso), presentes en todas las interacciones."},
  {q:"¿Qué es el 'ciclo de vida del cliente' en CX?",o:["La vida útil de la flota de trenes","Las etapas de la relación del cliente con la empresa: desde la atracción y adquisición hasta la fidelización y recomendación","La duración de un contrato de abono","El tiempo medio de espera en taquilla"],c:1,e:"El ciclo de vida del cliente describe las etapas: atracción, adquisición, primer uso, uso recurrente, fidelización y recomendación. Gestionarlo bien es clave para maximizar el valor del cliente a largo plazo."},
  {q:"¿Cuál de los siguientes es un factor que influye en la CX según Renfe?",o:["La antigüedad del tren","La empatía, la personalización y la comunicación efectiva, entre otros","Solo la puntualidad","Solo el precio del billete"],c:1,e:"Los factores que influyen en la CX incluyen empatía, personalización del servicio, comunicación efectiva, accesibilidad y capacidad de resolver problemas, además de la calidad y consistencia del servicio."},
],
B4S3:[
  {q:"¿Qué es el Customer Journey Map (Pasillo del Cliente)?",o:["Un mapa geográfico de rutas ferroviarias","Una herramienta visual que representa todos los puntos de contacto del cliente con la empresa, identificando emociones, necesidades y momentos de fricción","Un informe de ventas mensual","El plano de una estación"],c:1,e:"El Customer Journey Map visualiza esquemáticamente todas las interacciones del cliente con la empresa, identificando sus emociones y necesidades en cada momento, así como los puntos de dolor a mejorar."},
  {q:"¿Qué son los 'arquetipos' como herramienta de CX?",o:["Los tipos de trenes de Renfe","Representaciones semifictícias de segmentos de clientes basadas en datos reales, que ayudan a entender necesidades y motivaciones para diseñar mejores experiencias","Los prototipos de nuevos materiales rodantes","Los tipos de reclamaciones más frecuentes"],c:1,e:"Los arquetipos (o 'personas') son representaciones de segmentos de clientes basadas en datos reales sobre comportamientos y motivaciones. Ayudan a empatizar con el cliente y diseñar experiencias centradas en sus necesidades."},
  {q:"¿Qué son los KPIs de Experiencia de Cliente?",o:["Los kilómetros por hora de los trenes","Indicadores clave de rendimiento que miden el grado de cumplimiento de los objetivos de CX (NPS, CSAT, CES, etc.)","Las estadísticas de puntualidad","El número de billetes vendidos"],c:1,e:"Los KPIs de CX son métricas para medir la experiencia del cliente. Los más relevantes: NPS (Net Promoter Score), CSAT (Customer Satisfaction Score) y CES (Customer Effort Score), junto con indicadores operativos."},
  {q:"¿Qué es el Blueprint o Mapa de Procesos en CX?",o:["El plano de construcción de una estación","Una herramienta que representa la experiencia visible del cliente y los procesos internos de la empresa que la sostienen, visibilizando los momentos de verdad","El manual de procedimientos de atención al cliente","El sistema de control de calidad de Renfe"],c:1,e:"El Blueprint representa en un mismo documento la experiencia del cliente (lo que ve) y los procesos internos de la empresa (lo que no ve) que la sostienen. Ayuda a identificar fallos de proceso que impactan negativamente al cliente."},
],
B4S4:[
  {q:"¿Qué significa que una organización tenga 'cultura orientada al cliente'?",o:["Que el departamento de atención al cliente es el más numeroso","Que el cliente está en el centro de todas las decisiones y todos los empleados contribuyen a su experiencia","Que solo se preocupan por las quejas","Que ofrecen los precios más bajos del mercado"],c:1,e:"Una cultura orientada al cliente significa que el cliente está en el centro de todas las decisiones, con todos los empleados (no solo los de atención directa) contribuyendo activamente a generar experiencias positivas."},
  {q:"¿Qué habilidades son clave para la Experiencia de Cliente en Renfe?",o:["Solo conocimientos técnicos del ferrocarril","Empatía, escucha activa, comunicación efectiva, resolución de problemas, orientación al cliente y trabajo en equipo","Solo idiomas extranjeros","Solo habilidades informáticas"],c:1,e:"Las competencias clave para la CX incluyen habilidades relacionales (empatía, escucha activa, comunicación efectiva), de gestión (resolución de problemas) y de actitud (orientación al cliente, proactividad, trabajo en equipo)."},
],
B4S5:[
  {q:"¿Qué es el NPS (Net Promoter Score)?",o:["Un indicador financiero de beneficios netos","Un índice que mide la propensión a recomendar el servicio: % Promotores (9-10) menos % Detractores (0-6)","El número de pasajeros por servicio","La puntuación media de reseñas online"],c:1,e:"El NPS mide la lealtad del cliente. Pregunta: '¿Con qué probabilidad recomendaría el servicio?' (0-10). Promotores=9-10, Pasivos=7-8, Detractores=0-6. NPS = % Promotores - % Detractores."},
  {q:"¿Cómo impacta la IA en la Experiencia de Cliente Digital?",o:["No tiene impacto relevante","Permite personalizar la experiencia, anticiparse a necesidades, automatizar respuestas (chatbots) y ofrecer experiencias omnicanal coherentes","Solo sirve para vender billetes online","Solo para gestionar reclamaciones"],c:1,e:"La IA permite personalizar experiencias a escala, anticiparse a necesidades, automatizar procesos (chatbots, recomendadores), analizar feedback en tiempo real y garantizar experiencia omnicanal coherente en todos los canales."},
  {q:"¿Qué es el 'proceso de recuperación del servicio' en CX?",o:["El procedimiento de mantenimiento de trenes","Las acciones que la empresa pone en marcha para corregir un fallo en el servicio y reconquistar la confianza del cliente afectado","El procedimiento de reembolso de billetes","El sistema de limpieza de los trenes"],c:1,e:"La recuperación del servicio es el proceso por el que la empresa detecta un fallo, actúa con rapidez para corregirlo, se disculpa adecuadamente y ofrece soluciones al cliente. Una buena recuperación puede fidelizar más que si el fallo no hubiera ocurrido."},
],
B5S1:[
  {q:"¿Cuál es el fundamento técnico que explica la existencia del ferrocarril?",o:["La velocidad superior a otros medios","Que la rodadura metal sobre metal tiene resistencia al avance muy inferior a la de caucho sobre asfalto, requiriendo menos energía por tonelada transportada","El menor coste de construcción de vías","La capacidad de transportar mercancías peligrosas"],c:1,e:"El fundamento técnico del ferrocarril es que la rodadura de acero sobre acero tiene resistencia al avance muy inferior a caucho sobre asfalto, permitiendo mover grandes cargas con menor consumo energético."},
  {q:"¿En qué año se inauguró el primer ferrocarril de vapor en España peninsular y entre qué ciudades?",o:["1830, Barcelona-Mataró","1848, Barcelona-Mataró","1851, Madrid-Aranjuez","1855, Madrid-Valencia"],c:2,e:"El primer ferrocarril en la Península Ibérica fue Madrid-Aranjuez en 1851. En el conjunto del Estado español, el primero fue el de Barcelona-Mataró (1848). En Cuba (entonces española) se inauguró el primero en 1837."},
  {q:"¿Cuándo y cómo se creó RENFE?",o:["En 1929, mediante fusión voluntaria","En 1941, mediante la Ley de Bases de Ordenación Ferroviaria, que nacionalizó las compañías ferroviarias privadas","En 1955, por Real Decreto","En 1936, al inicio de la Guerra Civil"],c:1,e:"RENFE fue creada en 1941 mediante la Ley de Bases de Ordenación Ferroviaria y de los Transportes por Carretera, que nacionalizó las compañías ferroviarias privadas muy deterioradas tras la Guerra Civil."},
  {q:"¿En qué año entró en servicio el primer AVE en España y entre qué ciudades?",o:["1988, Madrid-Barcelona","1992, Madrid-Sevilla","1995, Madrid-Valencia","2000, Madrid-Málaga"],c:1,e:"El primer AVE en España entró en servicio el 14 de abril de 1992, uniendo Madrid con Sevilla, coincidiendo con la Expo de Sevilla. Adoptó el ancho UIC de 1.435 mm y la electrificación a 25 kV/50 Hz."},
  {q:"¿En qué Consejo de Ministros se adoptó el ancho UIC para la alta velocidad española?",o:["En 1985","En el Consejo de Ministros del 9 de diciembre de 1988","En 1992, antes de la Expo de Sevilla","En 1986, con la entrada en la CEE"],c:1,e:"La decisión de adoptar el ancho UIC de 1.435 mm para la red de alta velocidad española fue tomada en el Consejo de Ministros del 9 de diciembre de 1988."},
],
B5S2:[
  {q:"¿Qué son los 'Paquetes Ferroviarios' de la UE?",o:["Ofertas comerciales conjuntas de operadoras europeas","Conjuntos de directivas y reglamentos europeos que han liberalizado y armonizado el sector ferroviario, separando infraestructura de operación y creando el Espacio Ferroviario Europeo Único","Los conjuntos de vagones de un tren de mercancías","Las tarifas de peaje de ADIF"],c:1,e:"Los Paquetes Ferroviarios son conjuntos de legislación europea (directivas y reglamentos) que han liberalizado progresivamente el sector, separando la gestión de infraestructuras de la operación de servicios y avanzando hacia un Espacio Ferroviario Europeo Único."},
  {q:"¿Qué son las ETI (Especificaciones Técnicas de Interoperabilidad)?",o:["Las especificaciones de los billetes internacionales","Normas técnicas europeas que definen los requisitos de los subsistemas ferroviarios para garantizar la interoperabilidad en la red transeuropea","Los horarios internacionales de trenes","Las normas de seguridad para viajeros"],c:1,e:"Las ETI son especificaciones técnicas europeas que definen los requisitos de los subsistemas ferroviarios (vía, energía, material rodante, señalización, etc.) para garantizar la interoperabilidad, es decir, que los trenes puedan circular por redes de diferentes países miembros."},
  {q:"¿Qué es la ERA (Agencia Ferroviaria de la UE)?",o:["La empresa de trenes europeos de alta velocidad","La Agencia de la UE que promueve el Espacio Ferroviario Europeo Único, establece normas técnicas de seguridad e interoperabilidad y emite autorizaciones de puesta en servicio","El organismo regulador de precios ferroviarios en Europa","La asociación de maquinistas europeos"],c:1,e:"ERA (European Union Agency for Railways) promueve el Espacio Ferroviario Europeo Único, elabora normas técnicas de seguridad e interoperabilidad y, desde 2019, emite autorizaciones de vehículos ferroviarios para toda la UE."},
  {q:"¿Qué Ley separó la gestión de infraestructuras de la operación ferroviaria en España?",o:["Ley 16/1987 de Ordenación de Transportes Terrestres","Ley 39/2003 del Sector Ferroviario","Real Decreto 2387/2004","Ley 38/2015 del Sector Ferroviario"],c:1,e:"La Ley 39/2003 del Sector Ferroviario separó la gestión de infraestructuras (ADIF) de la operación de servicios (RENFE Operadora), liberalizando progresivamente el mercado ferroviario español conforme a las directivas europeas."},
  {q:"¿Qué es la CIAF?",o:["El Centro de Intervención y Asistencia Ferroviaria","La Comisión de Investigación de Accidentes Ferroviarios, organismo independiente que investiga accidentes e incidentes graves para mejorar la seguridad ferroviaria","La Confederación Internacional de Administradores Ferroviarios","El Centro de Información de ADIF"],c:1,e:"La CIAF (Comisión de Investigación de Accidentes Ferroviarios) es el organismo independiente del Ministerio de Transportes que investiga accidentes e incidentes graves en el ferrocarril español, con el único objetivo de mejorar la seguridad."},
],
B5S3:[
  {q:"¿Qué es la RFIG?",o:["La Red Ferroviaria Internacional de Gran velocidad","La Red Ferroviaria de Interés General: el conjunto de líneas cuya titularidad corresponde al Estado, administradas por ADIF","El Reglamento Ferroviario Interno del Grupo","La Red de Ferrocarriles de Infraestructura Grande"],c:1,e:"La RFIG (Red Ferroviaria de Interés General) es el conjunto de líneas ferroviarias cuya titularidad corresponde al Estado español, siendo ADIF el organismo encargado de su administración y gestión."},
  {q:"¿Cuántos km aproximados tiene la RFIG en España?",o:["Menos de 5.000 km","Aproximadamente 7.000 km","Más de 15.000 km","Aproximadamente 25.000 km"],c:2,e:"La RFIG supera los 15.000 km, incluyendo la red de alta velocidad (en torno a 3.800 km, segunda más extensa del mundo tras China) y la red convencional de ancho ibérico y métrico."},
  {q:"¿Qué es el Catálogo de Líneas de la RFIG?",o:["El horario oficial de trenes de Renfe","El documento que relaciona y clasifica todas las líneas de la RFIG con sus características técnicas: longitud, ancho de vía, electrificación, velocidad máxima y tipo de tráfico","La lista de estaciones de Renfe por tráfico","El manual de procedimientos de ADIF"],c:1,e:"El Catálogo de Líneas de la RFIG es el documento oficial que relaciona y clasifica todas las líneas de la Red Ferroviaria de Interés General con sus características técnicas relevantes."},
],
B5S4:[
  {q:"¿Cuál es el ancho de vía ibérico de la red convencional española?",o:["1.000 mm","1.435 mm (UIC)","1.668 mm","1.520 mm"],c:2,e:"El ancho ibérico es de 1.668 mm, utilizado en la red ferroviaria convencional española. Es mayor que el UIC europeo (1.435 mm). La red de alta velocidad usa el ancho UIC para garantizar la interoperabilidad europea."},
  {q:"¿Qué es el balasto en la superestructura ferroviaria?",o:["El sistema de frenado del tren","La capa de piedra machacada sobre la que descansan las traviesas y el carril, distribuyendo cargas, facilitando el drenaje y manteniendo la geometría de la vía","El revestimiento interior del túnel","El tipo de carril utilizado en alta velocidad"],c:1,e:"El balasto es el lecho de grava que forma la capa de asiento de las traviesas. Distribuye cargas, facilita el drenaje, absorbe vibraciones y mantiene la geometría de la vía."},
  {q:"¿Qué es la 'vía en placa'?",o:["Una vía construida sobre un viaducto metálico","Un tipo de superestructura sin balasto donde el carril se fija directamente sobre una losa de hormigón","Un tipo de carril de perfil plano para tranvías","Una vía con doble carril para alta velocidad"],c:1,e:"La vía en placa prescinde del balasto, fijando el carril sobre una losa de hormigón o asfalto. Se usa en túneles, viaductos y tramos de alta velocidad por su mayor durabilidad y menor necesidad de mantenimiento."},
  {q:"¿Qué tensión usa la catenaria de la red de alta velocidad española?",o:["1.500 V continua","3.000 V continua","25.000 V alterna a 50 Hz","15.000 V alterna a 16,7 Hz"],c:2,e:"La red de alta velocidad española usa 25.000 V en corriente alterna monofásica a 50 Hz (estándar UIC europeo). La red convencional de Renfe usa 3.000 V en corriente continua."},
  {q:"¿Qué es un desvío en la infraestructura ferroviaria?",o:["Una señal de limitación de velocidad","Un elemento de la vía que permite el paso de un tren de una vía a otra, compuesto por agujas, cruzamiento y contracarriles","Una avería en la catenaria","Una señal de bifurcación de andenes"],c:1,e:"Un desvío permite a un tren cambiar de vía. Se compone de agujas (guían al tren), cruzamiento (donde se cruzan los carriles) y contracarriles (guían la pestaña de la rueda en el cruzamiento)."},
],
B5S5:[
  {q:"¿Qué es el 'material motor' en terminología ferroviaria?",o:["Los materiales de construcción de las vías","Los vehículos ferroviarios con sistema de tracción propio (locomotoras, automotores, unidades con motores distribuidos)","El combustible de los trenes diésel","Las herramientas de mantenimiento ferroviario"],c:1,e:"El material motor son los vehículos ferroviarios con tracción propia: locomotoras (arrastran al resto del tren), automotores (vehículos autopropulsados) y unidades con motores distribuidos (como el AVE S-100 o S-102)."},
  {q:"¿Qué es el 'material remolcado'?",o:["Solo los vagones de mercancías","El material ferroviario sin tracción propia que necesita ser arrastrado por material motor (coches de viajeros, furgones, vagones, etc.)","Los remolques de camiones que viajan en tren","El material de repuesto en talleres"],c:1,e:"El material remolcado carece de sistema de tracción y debe ser arrastrado. Incluye coches de viajeros de larga distancia, furgones de equipajes, vagones de mercancías y plataformas de transporte combinado."},
  {q:"¿Qué tipos de material motor existen según la fuente de energía?",o:["Solo eléctrico y diésel","Material motor eléctrico (catenaria), diésel (combustión interna) y dual o bimodal (puede usar ambas fuentes)","Solo eléctrico","Solo diésel en España"],c:1,e:"Existen tres tipos: eléctrico (alimentado por catenaria), diésel (motor de combustión interna para líneas sin electrificar) y dual o bimodal (puede funcionar con catenaria o motor diésel, útil en líneas mixtas)."},
],
B5S6:[
  {q:"¿Qué es el ASFA en el ferrocarril español?",o:["El sistema de reserva de billetes","El sistema de Anuncio de Señales y Frenado Automático: transmite las indicaciones de las señales al tren y activa el freno de emergencia si el maquinista no las reconoce","La Agencia de Seguridad Ferroviaria Avanzada","El sistema de control de acceso a andenes"],c:1,e:"ASFA (Anuncio de Señales y Frenado Automático) es el sistema de seguridad de la red convencional española. Mediante balizas en la vía transmite indicaciones de señales al tren y activa el freno de emergencia si el maquinista no reconoce una señal restrictiva."},
  {q:"¿Qué es el ETCS y a qué sistema más amplio pertenece?",o:["Un tipo de locomotora eléctrica europea","El European Train Control System, componente del ERTMS, que supervisa continuamente la velocidad del tren y garantiza la interoperabilidad ferroviaria europea","Un sistema de venta de billetes europeo","El sistema de facturación de equipajes"],c:1,e:"El ETCS (European Train Control System) es el componente de control de trenes del ERTMS. Supervisa continuamente la velocidad y aplica el freno si se supera la permitida. Es obligatorio en nuevas líneas de alta velocidad y garantiza la interoperabilidad entre países europeos."},
  {q:"¿Cuáles son los niveles de aplicación del ETCS?",o:["Solo existe un nivel","Nivel 1 (eurobalizas con señales laterales), Nivel 2 (comunicación continua GSM-R sin señales laterales) y Nivel 3 (con control de integridad del tren)","Solo Nivel 2 en España","Solo Niveles 1 y 3"],c:1,e:"El ETCS tiene tres niveles: Nivel 1 (información puntual por eurobalizas, compatible con señales laterales), Nivel 2 (comunicación continua via GSM-R, sin señales laterales necesarias) y Nivel 3 (añade control de integridad del tren)."},

function loadStats(){try{const s=localStorage.getItem('rnf_v5');return s?JSON.parse(s):{exams:[]}}catch{return{exams:[]}}}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]]}return b}
function fmt(s){return`${0|s/60}:${String(s%60).padStart(2,'0')}`}
function getC(q){return q.c!==undefined?q.c:q.correct}
function getO(q){return q.o||q.opts||q.options||[]}
async function genAI(sid,label,n){
  const p=`Eres experto en oposiciones Renfe Operador Comercial de Entrada N2 (Oferta de Empleo Grupo Renfe 2026).\nGenera ${n} preguntas tipo test rigurosas sobre: "${label}".\nBasadas estrictamente en el temario oficial del Grupo Renfe 2026. 4 opciones, 1 correcta, opciones plausibles, explicación detallada.\nRespende SOLO JSON sin markdown:\n{"questions":[{"question":"...","options":["A","B","C","D"],"correct":0,"explanation":"..."}]}`;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,messages:[{role:"user",content:p}]})});
  const d=await r.json();
  const t=d.content?.map(i=>i.text||"").join("")||"";
  const parsed=JSON.parse(t.replace(/```json|```/g,"").trim());
  return(parsed.questions||[]).map(q=>({q:q.question,o:q.options,c:q.correct,e:q.explanation,src:'ia'}));
}
async function startQuiz(cfg){
  S.cfg=cfg;S.view='loading';S.ans={};S.rev={};S.cur=0;render();
  let qs=[];
  if(S.online&&cfg.useAI){
    try{
      const pp=Math.max(3,Math.ceil(cfg.n/cfg.subs.length));
      const all=await Promise.all(cfg.subs.map(sid=>{
        const sub=[...BLOQUES.flatMap(b=>b.subs),...PSICO_SUBS].find(s=>s.id===sid);
        return genAI(sid,sub?.name||sid,pp);
      }));
      qs=shuffle(all.flat()).slice(0,cfg.n).map((q,i)=>({...q,id:i}));
    }catch(e){console.warn('AI fail',e)}
  }
  if(qs.length<cfg.n){
    let pool=[];cfg.subs.forEach(sid=>(QB[sid]||[]).forEach(q=>pool.push({...q,src:'offline',sid})));
    const need=cfg.n-qs.length;
    qs=[...qs,...shuffle(pool).slice(0,need).map((q,i)=>({...q,id:qs.length+i}))];
  }
  S.qs=qs;S.tLeft=cfg.tSec;S.view='quiz';
  clearInterval(S.tInt);
  S.tInt=setInterval(()=>{if(--S.tLeft<=0){clearInterval(S.tInt);finishQuiz();}else updT();},1000);
  render();
}

function finishQuiz(){
  clearInterval(S.tInt);
  const q=S.qs;
  const correct=q.filter((_,i)=>S.ans[i]===getC(q[i])).length;
  const wrong=q.filter((_,i)=>S.ans[i]!==undefined&&S.ans[i]!==-1&&S.ans[i]!==getC(q[i])).length;
  const skipped=q.length-correct-wrong;
  const pct=Math.round(correct/q.length*100);
  S.result={questions:q,answers:{...S.ans},correct,wrong,skipped,total:q.length,pct,timeTaken:S.cfg.tSec-S.tLeft};
  S.stats.exams.push({date:Date.now(),correct,total:q.length,pct,label:S.cfg.label||''});

  nav.innerHTML=`
    <button class="btn btn-g btn-sm" ${S.cur===0?'disabled':''} onclick="prevQ()">← Anterior</button>
    <div style="display:flex;gap:6px">
      ${!ans?`<button class="btn btn-g btn-sm" onclick="skipQ()">Omitir</button>`:''}
      ${!last?`<button class="btn btn-p btn-sm" ${!ans?'disabled':''} onclick="nextQ()">Siguiente →</button>`
             :`<button class="btn btn-p btn-sm" onclick="finishQuiz()">Finalizar ✓</button>`}
    </div>`;
}
function renderResults(){
  const r=S.result;const pass=r.pct>=50;
  let revHtml='';
  if(S.showRev){
    revHtml=`<div class="sec-hd" style="margin-top:1.25rem">Revisión de respuestas</div>
    <div class="rev-list">${r.questions.map((q,i)=>{
      const ua=r.answers[i];const c=getC(q);const opts=getO(q);
      const isOk=ua===c;const isSkip=ua===-1||ua===undefined;
      const ac=isSkip?'#6B7280':isOk?'#15803D':'#7B1F5E';
      return`<div class="rev-item" style="--ac:${ac}">
        <div class="rev-q">${i+1}. ${q.q||q.question}</div>
        <div class="rev-a">${isSkip?'<span style="color:#6B7280">⬜ Sin contestar</span>':
          isOk?`<span style="color:#15803D">✅ ${opts[c]}</span>`:
          `<span style="color:#7B1F5E">❌ Tu resp: ${opts[ua]||'?'}</span> · <span style="color:#15803D">✓ ${opts[c]}</span>`}
        </div>
        ${!isSkip&&!isOk&&(q.e||q.explanation)?`<div class="expl" style="margin-top:.5rem;font-size:.8rem"><strong>💡</strong>${q.e||q.explanation}</div>`:''}
      </div>`;
    }).join('')}</div>`;
  }
  return`<div class="results">
    <div class="res-hero">
      <div class="res-score">${r.pct}%</div>
      <div class="res-lbl">${r.correct}/${r.total} correctas · ⏱${fmt(r.timeTaken)}</div>
      <div class="res-verd">${pass?'✅ APROBADO':'❌ SUSPENSO'}</div>
      <div class="res-grid">
        <div class="rs"><div class="rs-n cg">${r.correct}</div><div class="rs-l">Correctas</div></div>
        <div class="rs"><div class="rs-n cr">${r.wrong}</div><div class="rs-l">Incorrectas</div></div>
        <div class="rs"><div class="rs-n cs">${r.skipped}</div><div class="rs-l">Omitidas</div></div>
      </div>
    </div>
    <div style="display:flex;gap:.65rem;margin-bottom:1rem;flex-wrap:wrap">
      <button class="btn btn-s btn-sm" onclick="goHome()">← Volver</button>
      <button class="btn btn-p btn-sm" onclick="toggleRev()">📋 ${S.showRev?'Ocultar':'Ver'} revisión</button>
      <button class="btn btn-g btn-sm" onclick="openConfig()">🔄 Repetir</button>
    </div>
    ${revHtml}
  </div>`;
}
function renderStats(te,avg){
  const best=te?Math.max(...S.stats.exams.map(e=>e.pct)):0;
  const totalQ=S.stats.exams.reduce((a,b)=>a+(b.total||0),0);
  const rows=te?[...S.stats.exams].reverse().slice(0,20).map((e,i)=>`
    <tr>
      <td>${S.stats.exams.length-i}</td>
      <td>${new Date(e.date).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit'})}</td>
      <td style="font-size:.72rem;color:#6B7280;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.label||'Simulacro'}</td>
      <td>${e.correct}/${e.total}</td>
      <td><strong>${e.pct}%</strong></td>
      <td><span class="badge ${e.pct>=50?'bg':e.pct>=35?'bo':'br'}">${e.pct>=50?'Aprobado':e.pct>=35?'Cerca':'Suspenso'}</span></td>
    </tr>`).join('')
    :`<tr><td colspan="6" style="text-align:center;color:#6B7280;padding:1.5rem">Sin simulacros aún</td></tr>`;
  return`<div class="stats-pg">
    <div class="sec-hd">📊 Mi Progreso</div>
    <div style="display:flex;gap:.65rem;margin-bottom:1.1rem">
      <button class="btn btn-p btn-sm" onclick="startQuickMode()">⚡ Modo rápido</button>
      <button class="btn btn-g btn-sm" onclick="goRevision()">🔁 Revisión</button>
    </div>
    <div class="sg">
      <div class="big-s"><div class="big-n">${te}</div><div class="big-l">Simulacros</div></div>
      <div class="big-s"><div class="big-n">${avg?avg+'%':'—'}</div><div class="big-l">Media</div></div>
      <div class="big-s"><div class="big-n">${best?best+'%':'—'}</div><div class="big-l">Mejor nota</div></div>
      <div class="big-s"><div class="big-n">${totalQ}</div><div class="big-l">Preguntas</div></div>
    </div>
    <div class="sec-hd">Historial</div>
    <div style="overflow-x:auto"><table class="tbl">
      <thead><tr><th>#</th><th>Fecha</th><th>Test</th><th>Res.</th><th>%</th><th>Estado</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div style="text-align:right;margin-top:.75rem">
      <button class="btn btn-g btn-sm" onclick="clearStats()">🗑 Borrar historial</button>
    </div>
  </div>`;
}
function renderModal(){
  const blkChips=BLOQUES.map(b=>`
    <div style="margin-bottom:.6rem">
      <div style="font-size:.7rem;font-weight:700;color:${b.color};text-transform:uppercase;letter-spacing:1px;margin-bottom:.3rem">
        ${b.icon} Bloque ${b.num}</div>
      <div class="chips">${b.subs.map(s=>`
        <button class="chip ${S.cSubs.includes(s.id)?'on':''}" onclick="toggleSub('${s.id}')"
          style="${S.cSubs.includes(s.id)?`background:${b.color};border-color:${b.color}`:''}">
          ${s.icon} ${s.name.split(' ').slice(0,3).join(' ')}</button>`).join('')}
      </div>
    </div>`).join('');
  const psChips=`<div style="margin-bottom:.6rem">
    <div style="font-size:.7rem;font-weight:700;color:var(--bp);text-transform:uppercase;letter-spacing:1px;margin-bottom:.3rem">🧠 Psicotécnicos</div>
    <div class="chips">${PSICO_SUBS.map(s=>`
      <button class="chip ${S.cSubs.includes(s.id)?'on':''}" onclick="toggleSub('${s.id}')"
        style="${S.cSubs.includes(s.id)?'background:var(--bp);border-color:var(--bp)':''}">
        ${s.icon} ${s.name}</button>`).join('')}
    </div>
  </div>`;
  const aiOpt=S.online?`<div class="modal-sec"><div class="modal-lbl">Tipo de preguntas</div>
    <div class="chips">
      <button class="chip ${!S.useAI?'on':''}" onclick="setAI(false)">📦 Banco offline</button>
      <button class="chip ${S.useAI?'on':''}" onclick="setAI(true)">🤖 IA — preguntas nuevas</button>
    </div></div>`:`<p style="font-size:.75rem;color:#6B7280;margin-bottom:.75rem">📦 Sin conexión — banco offline</p>`;
  return`<div class="overlay" onclick="closeConfig()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-t">⚙️ Configurar simulacro</div>
    <div class="modal-sec"><div class="modal-lbl">Selecciona subapartados</div>${blkChips}${psChips}</div>
    <div class="modal-sec"><div class="modal-lbl">Nº de preguntas</div>
      <div class="num-row">
        <button class="num-btn" onclick="adjN(-5)">−</button>
        <div class="num-v" id="nv">${S.cN}</div>
        <button class="num-btn" onclick="adjN(5)">+</button>
      </div></div>
    <div class="modal-sec"><div class="modal-lbl">Tiempo límite (minutos)</div>
      <div class="num-row">
        <button class="num-btn" onclick="adjT(-5)">−</button>
        <div class="num-v" id="tv">${S.cT}</div>
        <button class="num-btn" onclick="adjT(5)">+</button>
      </div></div>
    ${aiOpt}
    <div class="modal-act">
      <button class="btn btn-g btn-sm" onclick="closeConfig()">Cancelar</button>
      <button class="btn btn-p btn-sm" ${S.cSubs.length===0?'disabled':''} onclick="launchExam()">🚀 Empezar</button>
    </div>
  </div></div>`;
}
function goHome(){S.view='home';render()}
function goStats(){S.view='stats';render()}
function openConfig(){S.view='config';render()}
function closeConfig(){S.view='home';render()}
function toggleRev(){S.showRev=!S.showRev;render()}
function clearStats(){if(confirm('¿Borrar todo el historial?')){S.stats={exams:[]};saveStats();render()}}
function toggleBlk(id){S.openBlks[id]=!S.openBlks[id];render()}
function toggleSub(id){S.cSubs=S.cSubs.includes(id)?S.cSubs.filter(t=>t!==id):[...S.cSubs,id];render();}
function setAI(v){S.useAI=v;render()}
function adjN(d){S.cN=Math.min(40,Math.max(5,S.cN+d));const el=document.getElementById('nv');if(el)el.textContent=S.cN}
function adjT(d){S.cT=Math.min(90,Math.max(10,S.cT+d));const el=document.getElementById('tv');if(el)el.textContent=S.cT}
function launchExam(){
  const label=S.cSubs.length===1?[...BLOQUES.flatMap(b=>b.subs),...PSICO_SUBS].find(s=>s.id===S.cSubs[0])?.name||'Simulacro':'Simulacro completo';
  startQuiz({subs:S.cSubs,n:S.cN,tSec:S.cT*60,useAI:S.useAI&&S.online,label,blkLabel:'Simulacro Oficial'});
}
function startSubTest(subId,name,blkId){
  const pool=QB[subId]||[];
  const b=BLOQUES.find(b=>b.id===blkId);
  startQuiz({subs:[subId],n:Math.min(pool.length||10,10),tSec:600,
    useAI:S.online,label:name,blkLabel:b?`Bloque ${b.num} · ${b.icon}`:'🧠 Psicotécnicos',subLabel:name});
}
function prevQ(){S.cur--;renderQ();document.getElementById('scr')?.scrollTo(0,0)}
function nextQ(){S.cur++;renderQ();document.getElementById('scr')?.scrollTo(0,0)}
function skipQ(){S.ans[S.cur]=-1;if(S.cur<S.qs.length-1){S.cur++;renderQ();}else renderQ();}
function doIP(){if(S.ip){S.ip.prompt();S.ip.userChoice.then(()=>{S.ip=null;S.showIP=false;render()})}}
function dismissIP(){S.showIP=false;render()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();S.ip=e;S.showIP=true;render()});
window.addEventListener('online',()=>{S.online=true;render()});
window.addEventListener('offline',()=>{S.online=false;render()});

function toggleDark(){
  S.dark=!S.dark;
  document.body.classList.toggle('dark',S.dark);
  localStorage.setItem('rnf_dark',S.dark?'1':'0');
  render();
}

function startQuickMode(){
  // Random 10 questions from all offline bank
  const allSubs=[...BLOQUES.flatMap(b=>b.subs.map(s=>s.id)),...PSICO_SUBS.map(s=>s.id)];
  let pool=[];
  allSubs.forEach(sid=>(QB[sid]||[]).forEach(q=>pool.push({...q,src:'offline',sid})));
  pool=shuffle(pool).slice(0,10).map((q,i)=>({...q,id:i}));
  S.cfg={subs:allSubs,n:10,tSec:300,useAI:false,label:'Modo rápido',blkLabel:'⚡ Modo rápido',subLabel:'10 preguntas aleatorias'};
  S.qs=pool;S.ans={};S.rev={};S.cur=0;S.tLeft=300;S.view='quiz';
  clearInterval(S.tInt);
  S.tInt=setInterval(()=>{if(--S.tLeft<=0){clearInterval(S.tInt);finishQuiz();}else updT();},1000);
  render();
}

function goRevision(){S.view='revision';render();}

function renderRevision(){
  // Collect all wrong/skipped questions from stat exams stored in localStorage
  // We store failed questions separately
  let failed=[];
  try{const s=localStorage.getItem('rnf_failed');if(s)failed=JSON.parse(s);}catch{}

  if(failed.length===0){
    return`<div class="quiz" style="padding:1.25rem">
      <div style="display:flex;align-items:center;gap:.75rem;margin-bottom:1.25rem">
        <button class="btn btn-g btn-sm" onclick="goHome()">← Volver</button>
        <div class="sec-hd" style="margin:0">🔁 Modo revisión</div>
      </div>
      <div class="rev-mode-empty">
        <div class="rev-icon">✅</div>
        <div style="font-weight:600;margin-bottom:.5rem">¡Sin preguntas pendientes!</div>
        <div style="font-size:.85rem">Las preguntas que falles o dejes sin contestar en los simulacros aparecerán aquí para que las repases.</div>
        <button class="btn btn-p btn-sm" style="margin-top:1.25rem" onclick="openConfig()">🚀 Hacer un simulacro</button>
      </div>
    </div>`;
  }

  const pool=shuffle(failed).slice(0,Math.min(failed.length,20));
  return`<div class="quiz" style="padding:1.25rem">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.65rem">
      <div style="display:flex;align-items:center;gap:.75rem">
        <button class="btn btn-g btn-sm" onclick="goHome()">← Volver</button>
        <div class="sec-hd" style="margin:0">🔁 Modo revisión</div>
      </div>
      <div style="font-size:.78rem;color:var(--gray)">${failed.length} preguntas pendientes</div>
    </div>
    <div style="display:flex;gap:.65rem;margin-bottom:1.25rem;flex-wrap:wrap">
      <button class="btn btn-p btn-sm" onclick="startRevisionExam(${Math.min(failed.length,20)})">
        🔁 Repasar ${Math.min(failed.length,20)} preguntas
      </button>
      <button class="btn btn-g btn-sm" onclick="clearFailed()">🗑 Borrar lista</button>
    </div>
    <div style="font-size:.82rem;color:var(--gray);margin-bottom:1rem">
      Preguntas que has fallado o dejado sin contestar en simulacros anteriores:
    </div>
    <div class="rev-list">
      ${pool.map((q,i)=>{
        const opts=q.o||q.opts||q.options||[];
        const c=q.c!==undefined?q.c:q.correct;
        return`<div class="rev-item" style="--ac:var(--m)">
          <div class="rev-q">${i+1}. ${q.q||q.question}</div>
          <div class="rev-a" style="color:var(--green)">✓ Respuesta correcta: <strong>${opts[c]}</strong></div>
          ${q.e?`<div class="expl" style="margin-top:.5rem;font-size:.8rem"><strong>💡</strong>${q.e}</div>`:''}
        </div>`;
      }).join('')}
      ${failed.length>20?`<div style="text-align:center;color:var(--gray);font-size:.8rem;padding:.75rem">
        ... y ${failed.length-20} preguntas más. Practica para ir reduciéndolas.</div>`:''}
    </div>
  </div>`;
}

function startRevisionExam(n){
  let failed=[];
  try{const s=localStorage.getItem('rnf_failed');if(s)failed=JSON.parse(s);}catch{}
  if(!failed.length){goHome();return;}
  const pool=shuffle(failed).slice(0,n).map((q,i)=>({...q,id:i,src:'revision'}));
  S.cfg={subs:[],n:pool.length,tSec:pool.length*60,useAI:false,label:'Modo revisión',blkLabel:'🔁 Modo revisión',subLabel:'Preguntas falladas'};
  S.qs=pool;S.ans={};S.rev={};S.cur=0;S.tLeft=pool.length*60;S.view='quiz';
  clearInterval(S.tInt);
  S.tInt=setInterval(()=>{if(--S.tLeft<=0){clearInterval(S.tInt);finishQuiz();}else updT();},1000);
  render();
}

function clearFailed(){
  if(confirm('¿Borrar todas las preguntas pendientes de revisión?')){
    localStorage.removeItem('rnf_failed');render();
  }
}

// Save failed/skipped questions after each exam
function saveFailedQuestions(result){
  let failed=[];
  try{const s=localStorage.getItem('rnf_failed');if(s)failed=JSON.parse(s);}catch{}
  const newFailed=result.questions.filter((_,i)=>{
    const ua=result.answers[i];
    const c=result.questions[i].c!==undefined?result.questions[i].c:result.questions[i].correct;
    return ua===undefined||ua===-1||ua!==c;
  });
  // Merge avoiding duplicates (by question text)
  const existingQs=new Set(failed.map(q=>q.q||q.question));
  const toAdd=newFailed.filter(q=>!existingQs.has(q.q||q.question));
  // Remove questions that were answered correctly this time
  const correctQs=new Set(result.questions.filter((_,i)=>{
    const ua=result.answers[i];
    const c=result.questions[i].c!==undefined?result.questions[i].c:result.questions[i].correct;
    return ua===c;
  }).map(q=>q.q||q.question));
  const merged=[...failed.filter(q=>!correctQs.has(q.q||q.question)),...toAdd];
  // Keep max 200
  try{localStorage.setItem('rnf_failed',JSON.stringify(merged.slice(0,200)));}catch{}
}

Object.assign(window,{goHome,goStats,openConfig,closeConfig,toggleRev,clearStats,
  toggleBlk,toggleSub,setAI,adjN,adjT,launchExam,startSubTest,
  prevQ,nextQ,skipQ,finishQuiz,selAns,doIP,dismissIP,
  toggleDark,startQuickMode,goRevision,startRevisionExam,clearFailed});
// Apply dark on load
if(S.dark)document.body.classList.add('dark');
render();
</script>
</body>
